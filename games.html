    /* ==========================================================================
       2. WEB AUDIO API PROCEDURAL SOUND & BGM SYNTHESIZER
       ========================================================================== */
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
        this.bgmTimer = null;
        this.bgmStep = 0;
        this.unlocked = false;

        // C-D-E-F-G-A-B-C-D-E ascending major frequencies for cascades
        this.scaleFreqs = [523.25, 587.33, 659.25, 698.46, 783.99, 880.00, 987.77, 1046.50, 1174.66, 1318.51];

        // Gentle cheerful candy marimba melody
        this.melody = [
          523.25, 0, 659.25, 783.99, 0, 659.25, 880.00, 783.99,
          698.46, 0, 659.25, 587.33, 0, 523.25, 587.33, 0,
          523.25, 0, 659.25, 783.99, 1046.5, 0, 880.00, 783.99,
          659.25, 587.33, 523.25, 0, 587.33, 659.25, 523.25, 0
        ];
        this.bass = [
          261.63, 0, 0, 0, 196.00, 0, 0, 0,
          174.61, 0, 0, 0, 196.00, 0, 0, 0,
          261.63, 0, 0, 0, 220.00, 0, 0, 0,
          174.61, 0, 196.00, 0, 261.63, 0, 0, 0
        ];
      }

      unlock() {
        try {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return;
            this.ctx = new AudioCtx();
          }
          if (this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
          if (!this.unlocked) {
            this.unlocked = true;
            this.startBGM();
          }
        } catch (e) {
          // Gracefully ignore restricted audio context errors
        }
      }

      toggleMute() {
        this.muted = !this.muted;
        if (!this.muted) this.unlock();
        return this.muted;
      }

      startBGM() {
        if (this.bgmTimer) return;
        this.bgmTimer = setInterval(() => {
          if (this.muted || !this.ctx || this.ctx.state !== 'running') return;
          const now = this.ctx.currentTime;
          const mFreq = this.melody[this.bgmStep % this.melody.length];
          const bFreq = this.bass[this.bgmStep % this.bass.length];
          if (mFreq > 0) this._playMarimbaNote(mFreq, now, 0.19, 0.03);
          if (bFreq > 0) this._playSoftTone(bFreq, 'triangle', now, 0.27, 0.024);
          this.bgmStep = (this.bgmStep + 1) % this.melody.length;
        }, 235);
      }

      _playMarimbaNote(freq, startTime, duration, peakGain) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, startTime);
        gain.gain.setValueAtTime(0.0001, startTime);
        gain.gain.exponentialRampToValueAtTime(peakGain, startTime + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(startTime);
        osc.stop(startTime + duration + 0.02);
      }

      _playSoftTone(freq, type, startTime, duration, peakGain) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, startTime);
        gain.gain.setValueAtTime(0.0001, startTime);
        gain.gain.linearRampToValueAtTime(peakGain, startTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(startTime);
        osc.stop(startTime + duration + 0.02);
      }

      playSwap() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(560, now + 0.09);
        gain.gain.setValueAtTime(0.09, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.11);
      }

      playInvalidSwap() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        [0, 0.1].forEach((offset, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(i === 0 ? 220 : 165, now + offset);
          osc.frequency.exponentialRampToValueAtTime(110, now + offset + 0.08);
          gain.gain.setValueAtTime(0.11, now + offset);
          gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.09);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + offset);
          osc.stop(now + offset + 0.1);
        });
      }

      playPop(comboIndex = 0) {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const idx = Math.min(comboIndex, this.scaleFreqs.length - 1);
        const freq = this.scaleFreqs[idx];

        // Crisp candy bubble pop
        const popOsc = this.ctx.createOscillator();
        const popGain = this.ctx.createGain();
        popOsc.type = 'sine';
        popOsc.frequency.setValueAtTime(freq * 0.65, now);
        popOsc.frequency.exponentialRampToValueAtTime(freq * 1.48, now + 0.055);
        popGain.gain.setValueAtTime(0.14, now);
        popGain.gain.exponentialRampToValueAtTime(0.001, now + 0.072);
        popOsc.connect(popGain);
        popGain.connect(this.ctx.destination);
        popOsc.start(now);
        popOsc.stop(now + 0.08);

        // Ascending musical chime
        const chimeOsc = this.ctx.createOscillator();
        const chimeGain = this.ctx.createGain();
        chimeOsc.type = 'triangle';
        chimeOsc.frequency.setValueAtTime(freq, now + 0.01);
        chimeGain.gain.setValueAtTime(0.001, now + 0.01);
        chimeGain.gain.linearRampToValueAtTime(0.12, now + 0.024);
        chimeGain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
        chimeOsc.connect(chimeGain);
        chimeGain.connect(this.ctx.destination);
        chimeOsc.start(now + 0.01);
        chimeOsc.stop(now + 0.3);
      }

      playSpecialCreate() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        [659.25, 880.00, 1046.50, 1318.51].forEach((f, i) => {
          this._playMarimbaNote(f, now + i * 0.045, 0.22, 0.1);
        });
      }

      playLaser() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const filter = this.ctx.createBiquadFilter();
        const gain = this.ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(1420, now);
        osc.frequency.exponentialRampToValueAtTime(210, now + 0.26);

        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(2200, now);
        filter.frequency.exponentialRampToValueAtTime(420, now + 0.26);
        filter.Q.value = 3.2;

        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.3);
      }

      playExplosion(mega = false) {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const dur = mega ? 0.52 : 0.36;

        // Deep bass boom
        const osc = this.ctx.createOscillator();
        const oscGain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(mega ? 132 : 112, now);
        osc.frequency.exponentialRampToValueAtTime(26, now + dur);
        oscGain.gain.setValueAtTime(mega ? 0.34 : 0.24, now);
        oscGain.gain.exponentialRampToValueAtTime(0.001, now + dur);
        osc.connect(oscGain);
        oscGain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + dur + 0.02);

        // Filtered noise burst
        const bufferSize = Math.floor(this.ctx.sampleRate * dur);
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 1.8);
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(mega ? 980 : 760, now);
        filter.frequency.exponentialRampToValueAtTime(120, now + dur);

        const nGain = this.ctx.createGain();
        nGain.gain.setValueAtTime(mega ? 0.22 : 0.16, now);
        nGain.gain.exponentialRampToValueAtTime(0.001, now + dur);

        noise.connect(filter);
        filter.connect(nGain);
        nGain.connect(this.ctx.destination);
        noise.start(now);
      }

      playLightning() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        for (let i = 0; i < 4; i++) {
          const t = now + i * 0.045;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(720 + Math.random() * 1400, t);
          osc.frequency.exponentialRampToValueAtTime(240 + Math.random() * 500, t + 0.055);
          gain.gain.setValueAtTime(0.075, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.07);
        }
      }

      playUnlock() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        [1046.5, 1567.98].forEach((f, i) => {
          this._playMarimbaNote(f, now + i * 0.05, 0.18, 0.12);
        });
      }

      playPraise(tier) {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const base = 523.25 * Math.pow(1.122, Math.min(tier, 4));
        [1, 1.25, 1.5, 2].forEach((mult, i) => {
          this._playMarimbaNote(base * mult, now + i * 0.04, 0.38, 0.09);
        });
      }

      playShuffle() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        [440, 523.25, 659.25, 587.33, 783.99].forEach((f, i) => {
          this._playSoftTone(f, 'sine', now + i * 0.06, 0.14, 0.08);
        });
      }

      playBooster() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        [783.99, 987.77, 1174.66, 1567.98].forEach((f, i) => {
          this._playMarimbaNote(f, now + i * 0.04, 0.2, 0.11);
        });
      }

      playWin() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const notes = [523.25, 659.25, 783.99, 1046.50, 783.99, 1046.50];
        const times = [0, 0.1, 0.2, 0.32, 0.46, 0.56];
        notes.forEach((f, i) => {
          this._playMarimbaNote(f, now + times[i], i === 5 ? 0.68 : 0.22, 0.14);
        });
      }

      playLose() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        [440, 392, 349.23, 293.66].forEach((f, i) => {
          this._playSoftTone(f, 'triangle', now + i * 0.16, 0.34, 0.11);
        });
      }
    }

    /* ==========================================================================
       3. PSEUDO-3D GLOSSY CANDY RENDERER (MULTI-LAYER PROCEDURAL CANVAS 2D)
       ========================================================================== */
    class CandyRenderer {
      constructor() {
        this.cache = new Map();
        this.haloCache = new Map();
        this.bakeAllSprites();
      }

      getHalo(color) {
        return this.haloCache.get(color);
      }

      getSprite(color, special) {
        const key = special === SPECIAL.BOMB ? 'bomb' : `${color}_${special}`;
        return this.cache.get(key);
      }

      bakeAllSprites() {
        // Bake 3D Color Bomb
        this.cache.set('bomb', this._createOffscreen((ctx, s) => this._drawColorBomb(ctx, s)));

        // Bake 6 Basic Candies x (Normal, Striped H, Striped V, Wrapped, Fish) + Halo cache
        const specials = [SPECIAL.NONE, SPECIAL.STRIPED_H, SPECIAL.STRIPED_V, SPECIAL.WRAPPED, SPECIAL.FISH];
        for (let c = 0; c < 6; c++) {
          this.haloCache.set(c, this._createOffscreen((ctx, s) => {
            const g = ctx.createRadialGradient(s * 0.5, s * 0.5, s * 0.08, s * 0.5, s * 0.5, s * 0.48);
            g.addColorStop(0, CANDY_COLORS[c].glow + '99');
            g.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, s, s);
          }));
          for (const sp of specials) {
            const key = `${c}_${sp}`;
            this.cache.set(key, this._createOffscreen((ctx, s) => {
              if (sp === SPECIAL.WRAPPED) {
                this._drawWrappedCandy(ctx, s, c);
              } else if (sp === SPECIAL.FISH) {
                this._drawFishCandy(ctx, s, c);
              } else {
                this._drawBaseCandyWithStripes(ctx, s, c, sp);
              }
            }));
          }
        }
      }

      _createOffscreen(drawFn) {
        const canvas = document.createElement('canvas');
        canvas.width = SPRITE_SIZE;
        canvas.height = SPRITE_SIZE;
        const ctx = canvas.getContext('2d');
        drawFn(ctx, SPRITE_SIZE);
        return canvas;
      }

      _traceCandyPath(ctx, s, colorIdx) {
        const cx = s * 0.5;
        const cy = s * 0.5;
        ctx.beginPath();

        switch (colorIdx) {
          case 0: {
            // 1. Ruby Swirl Lollipop: glowing 3D round cherry-cream lollipop
            ctx.arc(cx, cy, s * 0.365, 0, Math.PI * 2);
            ctx.closePath();
            break;
          }
          case 1: {
            // 2. Golden Caramel Nougat: 3D tilted beveled caramel-nougat bar
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(-0.26);
            traceRoundRect(ctx, -s * 0.36, -s * 0.24, s * 0.72, s * 0.48, s * 0.13);
            ctx.restore();
            break;
          }
          case 2: {
            // 3. Yellow Lemon Drop: plump 3D teardrop
            ctx.moveTo(cx + s * 0.02, cy - s * 0.39);
            ctx.bezierCurveTo(cx + s * 0.20, cy - s * 0.18, cx + s * 0.34, cy - s * 0.02, cx + s * 0.33, cy + s * 0.14);
            ctx.bezierCurveTo(cx + s * 0.32, cy + s * 0.34, cx + s * 0.14, cy + s * 0.40, cx, cy + s * 0.40);
            ctx.bezierCurveTo(cx - s * 0.16, cy + s * 0.40, cx - s * 0.33, cy + s * 0.32, cx - s * 0.33, cy + s * 0.14);
            ctx.bezierCurveTo(cx - s * 0.33, cy - s * 0.03, cx - s * 0.16, cy - s * 0.18, cx + s * 0.02, cy - s * 0.39);
            ctx.closePath();
            break;
          }
          case 3: {
            // 4. Green Gum Square: cushioned 3D rounded square
            const r = s * 0.34;
            const c = s * 0.38;
            ctx.moveTo(cx - r * 0.72, cy - r);
            ctx.quadraticCurveTo(cx, cy - c, cx + r * 0.72, cy - r);
            ctx.quadraticCurveTo(cx + r, cy - r, cx + r, cy - r * 0.72);
            ctx.quadraticCurveTo(cx + c, cy, cx + r, cy + r * 0.72);
            ctx.quadraticCurveTo(cx + r, cy + r, cx + r * 0.72, cy + r);
            ctx.quadraticCurveTo(cx, cy + c, cx - r * 0.72, cy + r);
            ctx.quadraticCurveTo(cx - r, cy + r, cx - r, cy + r * 0.72);
            ctx.quadraticCurveTo(cx - c, cy, cx - r, cy - r * 0.72);
            ctx.quadraticCurveTo(cx - r, cy - r, cx - r * 0.72, cy - r);
            ctx.closePath();
            break;
          }
          case 4: {
            // 5. Blue Lollipop Head: 3D sapphire sphere
            ctx.arc(cx, cy, s * 0.36, 0, Math.PI * 2);
            ctx.closePath();
            break;
          }
          case 5: {
            // 6. Purple Cluster: 6-lobe amethyst berry rosette
            const ringR = s * 0.21;
            const lobeR = s * 0.17;
            for (let i = 0; i < 6; i++) {
              const a = (i / 6) * Math.PI * 2 - Math.PI / 2;
              const lx = cx + Math.cos(a) * ringR;
              const ly = cy + Math.sin(a) * ringR;
              ctx.moveTo(lx + lobeR, ly);
              ctx.arc(lx, ly, lobeR, 0, Math.PI * 2);
            }
            ctx.moveTo(cx + lobeR * 1.1, cy);
            ctx.arc(cx, cy, lobeR * 1.1, 0, Math.PI * 2);
            break;
          }
        }
      }

      _drawBaseCandyWithStripes(ctx, s, colorIdx, special) {
        const cx = s * 0.5;
        const cy = s * 0.5;
        const pal = CANDY_COLORS[colorIdx];
        const CANDY_TO_FLOWER = [0, 6, 1, 5, 4, 3]; // Rose, Lily, Sunflower, Lotus, ForgetMe, Orchid
        const ROTS = [0, 0.22, 0.08, 0, 0.16, -0.14];
        const flIdx = CANDY_TO_FLOWER[colorIdx % 6];

        // 1. Soft bioluminescent aura halo behind the flower
        ctx.save();
        const aura = ctx.createRadialGradient(cx, cy, s * 0.06, cx, cy, s * 0.48);
        aura.addColorStop(0, pal.light + 'aa');
        aura.addColorStop(0.55, pal.glow + '55');
        aura.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = aura;
        ctx.fillRect(0, 0, s, s);

        // 2. Sculpted emerald sepal leaves peeking behind flower
        const leafCount = (colorIdx === 0 || colorIdx === 5) ? 3 : 2;
        const leafBase = colorIdx * 0.65 - 0.7;
        for (let li = 0; li < leafCount; li++) {
          const la = leafBase + li * ((Math.PI * 2) / leafCount);
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(la);
          ctx.beginPath();
          ctx.moveTo(s * 0.12, 0);
          ctx.quadraticCurveTo(s * 0.30, -s * 0.14, s * 0.45, 0);
          ctx.quadraticCurveTo(s * 0.30, s * 0.14, s * 0.12, 0);
          const lg = ctx.createLinearGradient(s * 0.14, 0, s * 0.45, 0);
          lg.addColorStop(0, '#065f46');
          lg.addColorStop(0.6, '#22c55e');
          lg.addColorStop(1, '#86efac');
          ctx.fillStyle = lg;
          ctx.fill();
          ctx.strokeStyle = 'rgba(255,255,255,0.45)';
          ctx.lineWidth = s * 0.012;
          ctx.stroke();
          ctx.restore();
        }
        ctx.restore();

        // 3. High-DPI 3D Glowing Flower Blossom
        drawFlowerOn(ctx, flIdx, cx, cy, s * 0.84, ROTS[colorIdx % 6], 1);

        // 4. Translucent crystal dew-dome gleam + sparkling pollen dots
        ctx.save();
        const dew = ctx.createRadialGradient(cx - s * 0.10, cy - s * 0.12, s * 0.02, cx, cy, s * 0.38);
        dew.addColorStop(0, 'rgba(255,255,255,0.34)');
        dew.addColorStop(0.45, 'rgba(255,255,255,0.06)');
        dew.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = dew;
        ctx.beginPath();
        ctx.arc(cx, cy, s * 0.36, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.92)';
        ctx.beginPath();
        ctx.arc(cx - s * 0.16, cy - s * 0.18, s * 0.028, 0, Math.PI * 2);
        ctx.arc(cx + s * 0.18, cy + s * 0.14, s * 0.020, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // 5. Luminous Plasma Striped Ribbons + Direction Arrows (STRIPED_H / STRIPED_V)
        if (special === SPECIAL.STRIPED_H || special === SPECIAL.STRIPED_V) {
          this._drawCurved3DStripes(ctx, s, special === SPECIAL.STRIPED_H, pal);
        }
      }

      _drawFishCandy(ctx, s, colorIdx) {
        const pal = CANDY_COLORS[colorIdx];
        const cx = s * 0.5;
        const cy = s * 0.52;

        // Luminous Fairy Flower-Butterfly with glowing crystal wings
        ctx.save();
        ctx.shadowColor = pal.glow;
        ctx.shadowBlur = s * 0.14;

        const drawWing = (signX, wy, rx, ry, rot) => {
          ctx.save();
          ctx.translate(cx + signX * s * 0.14, cy + wy);
          ctx.rotate(signX * rot);
          ctx.beginPath();
          ctx.moveTo(-signX * s * 0.10, 0);
          ctx.bezierCurveTo(signX * rx * 0.25, -ry * 1.15, signX * rx * 1.15, -ry * 0.75, signX * rx, 0);
          ctx.bezierCurveTo(signX * rx * 1.15, ry * 0.75, signX * rx * 0.25, ry * 1.15, -signX * s * 0.10, 0);
          ctx.closePath();
          const wg = ctx.createRadialGradient(signX * rx * 0.35, -ry * 0.15, s * 0.02, signX * rx * 0.4, 0, rx);
          wg.addColorStop(0, '#ffffff');
          wg.addColorStop(0.32, pal.light);
          wg.addColorStop(0.76, pal.main);
          wg.addColorStop(1, pal.dark);
          ctx.fillStyle = wg;
          ctx.fill();
          ctx.lineWidth = s * 0.022;
          ctx.strokeStyle = 'rgba(255,255,255,0.88)';
          ctx.stroke();

          ctx.fillStyle = 'rgba(255,255,255,0.68)';
          ctx.beginPath();
          ctx.arc(signX * rx * 0.48, -ry * 0.15, s * 0.04, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        };

        // Lower pair + upper pair crystal wings
        drawWing(-1, s * 0.10, s * 0.23, s * 0.16, -0.45);
        drawWing(1,  s * 0.10, s * 0.23, s * 0.16, -0.45);
        drawWing(-1, -s * 0.09, s * 0.29, s * 0.21, 0.32);
        drawWing(1,  -s * 0.09, s * 0.29, s * 0.21, 0.32);

        // Glowing golden flower-seed thorax & antennae
        const bg = ctx.createLinearGradient(cx, cy - s * 0.22, cx, cy + s * 0.24);
        bg.addColorStop(0, '#fff9c4');
        bg.addColorStop(0.5, '#fbbf24');
        bg.addColorStop(1, '#b45309');
        ctx.fillStyle = bg;
        ctx.beginPath();
        ctx.ellipse(cx, cy + s * 0.02, s * 0.068, s * 0.20, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = s * 0.018;
        ctx.stroke();

        ctx.strokeStyle = '#fef08a';
        ctx.lineWidth = s * 0.022;
        ctx.beginPath();
        ctx.moveTo(cx - s * 0.02, cy - s * 0.15);
        ctx.quadraticCurveTo(cx - s * 0.10, cy - s * 0.30, cx - s * 0.14, cy - s * 0.28);
        ctx.moveTo(cx + s * 0.02, cy - s * 0.15);
        ctx.quadraticCurveTo(cx + s * 0.10, cy - s * 0.30, cx + s * 0.14, cy - s * 0.28);
        ctx.stroke();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(cx - s * 0.14, cy - s * 0.28, s * 0.028, 0, Math.PI * 2);
        ctx.arc(cx + s * 0.14, cy - s * 0.28, s * 0.028, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      _drawCurved3DStripes(ctx, s, horizontal, pal) {
        ctx.save();
        ctx.translate(s * 0.5, s * 0.5);
        if (!horizontal) ctx.rotate(Math.PI / 2);

        ctx.shadowColor = '#ffffff';
        ctx.shadowBlur = s * 0.08;
        const offsets = [-s * 0.20, 0, s * 0.20];
        for (const yOff of offsets) {
          const bend = yOff === 0 ? 0 : -yOff * 0.24;
          ctx.beginPath();
          ctx.moveTo(-s * 0.42, yOff);
          ctx.quadraticCurveTo(0, yOff + bend, s * 0.42, yOff);
          ctx.lineWidth = yOff === 0 ? s * 0.095 : s * 0.068;
          ctx.lineCap = 'round';
          const stGrad = ctx.createLinearGradient(-s * 0.4, yOff, s * 0.4, yOff);
          stGrad.addColorStop(0, pal.light);
          stGrad.addColorStop(0.5, '#ffffff');
          stGrad.addColorStop(1, pal.light);
          ctx.strokeStyle = stGrad;
          ctx.stroke();
        }
        // Crisp directional arrow tips at both poles
        ctx.fillStyle = '#ffffff';
        [-1, 1].forEach(dir => {
          ctx.beginPath();
          ctx.moveTo(dir * s * 0.46, 0);
          ctx.lineTo(dir * s * 0.31, -s * 0.09);
          ctx.lineTo(dir * s * 0.31, s * 0.09);
          ctx.closePath();
          ctx.fill();
        });
        ctx.restore();
      }

      _drawWrappedCandy(ctx, s, colorIdx) {
        const pal = CANDY_COLORS[colorIdx];
        const cx = s * 0.5;
        const cy = s * 0.5;

        // 1. Radiant Crystal Terrarium Octagon Housing
        ctx.save();
        ctx.shadowColor = pal.glow;
        ctx.shadowBlur = s * 0.14;
        const r = s * 0.43;
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
          const a = (i / 8) * Math.PI * 2 + Math.PI / 8;
          const vx = cx + Math.cos(a) * r;
          const vy = cy + Math.sin(a) * r;
          if (i === 0) ctx.moveTo(vx, vy); else ctx.lineTo(vx, vy);
        }
        ctx.closePath();

        const wrapGrad = ctx.createLinearGradient(s * 0.1, s * 0.1, s * 0.9, s * 0.9);
        wrapGrad.addColorStop(0, 'rgba(255, 255, 255, 0.72)');
        wrapGrad.addColorStop(0.35, pal.glow + '66');
        wrapGrad.addColorStop(0.7, pal.main + '99');
        wrapGrad.addColorStop(1, 'rgba(255, 255, 255, 0.80)');
        ctx.fillStyle = wrapGrad;
        ctx.fill();
        ctx.lineWidth = s * 0.032;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();
        ctx.restore();

        // 2. 3D Glowing Flower Encased Inside Crystal Dome
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(0.76, 0.76);
        ctx.translate(-cx, -cy);
        this._drawBaseCandyWithStripes(ctx, s, colorIdx, SPECIAL.NONE);
        ctx.restore();

        // 3. Faceted Crystal Reflection Flare
        ctx.save();
        const sheen = ctx.createLinearGradient(s * 0.15, s * 0.12, s * 0.82, s * 0.84);
        sheen.addColorStop(0, 'rgba(255, 255, 255, 0.55)');
        sheen.addColorStop(0.35, 'rgba(255, 255, 255, 0.05)');
        sheen.addColorStop(0.55, 'rgba(255, 255, 255, 0.42)');
        sheen.addColorStop(0.75, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = sheen;
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
          const a = (i / 8) * Math.PI * 2 + Math.PI / 8;
          const vx = cx + Math.cos(a) * (r * 0.94);
          const vy = cy + Math.sin(a) * (r * 0.94);
          if (i === 0) ctx.moveTo(vx, vy); else ctx.lineTo(vx, vy);
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      _drawColorBomb(ctx, s) {
        const cx = s * 0.5;
        const cy = s * 0.5;
        const r = s * 0.40;
        const prismCols = ['#ff2b55', '#ff8811', '#ffe100', '#22eb58', '#0ea5e9', '#6366f1', '#c026d3', '#f472b6'];

        // 1. Cosmic Obsidian-Violet Crystal Core Aura
        ctx.save();
        ctx.shadowColor = '#f472b6';
        ctx.shadowBlur = s * 0.14;
        ctx.beginPath();
        ctx.arc(cx, cy, r * 0.86, 0, Math.PI * 2);
        const coreBg = ctx.createRadialGradient(cx, cy, s * 0.04, cx, cy, r * 0.9);
        coreBg.addColorStop(0, '#ffffff');
        coreBg.addColorStop(0.45, '#581c87');
        coreBg.addColorStop(1, '#1e0b36');
        ctx.fillStyle = coreBg;
        ctx.fill();
        ctx.restore();

        // 2. 8 Radiant Rainbow Lotus Petals
        for (let i = 0; i < 8; i++) {
          const ang = (i / 8) * Math.PI * 2 - Math.PI / 2;
          const col = prismCols[i];
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(ang);
          ctx.shadowColor = col;
          ctx.shadowBlur = s * 0.08;
          ctx.beginPath();
          ctx.moveTo(s * 0.06, 0);
          ctx.bezierCurveTo(s * 0.16, -s * 0.16, s * 0.36, -s * 0.13, s * 0.43, 0);
          ctx.bezierCurveTo(s * 0.36, s * 0.13, s * 0.16, s * 0.16, s * 0.06, 0);
          ctx.closePath();
          const pg = ctx.createRadialGradient(s * 0.16, 0, s * 0.02, s * 0.25, 0, s * 0.26);
          pg.addColorStop(0, '#ffffff');
          pg.addColorStop(0.45, col);
          pg.addColorStop(1, '#1e0936');
          ctx.fillStyle = pg;
          ctx.fill();
          ctx.strokeStyle = 'rgba(255,255,255,0.86)';
          ctx.lineWidth = s * 0.014;
          ctx.stroke();
          ctx.restore();
        }

        // 3. Dazzling Starlight Diamond Nucleus
        ctx.save();
        ctx.translate(cx, cy);
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#fde047';
        ctx.shadowBlur = s * 0.12;
        ctx.beginPath();
        for (let i = 0; i < 16; i++) {
          const rad = i % 2 === 0 ? s * 0.16 : s * 0.07;
          const a = (i / 16) * Math.PI * 2;
          if (i === 0) ctx.moveTo(Math.cos(a) * rad, Math.sin(a) * rad);
          else ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
    }

    /* ==========================================================================
       4. PROCEDURAL INFINITE LEVEL DESIGNER (12 BOARD MODELS, JELLY, LOCKS & GOALS)
       ========================================================================== */
    const SHAPE_NAMES = [
      'Chuẩn 8×8', 'Cắt 4 Góc', 'Kim Cương', 'Chữ H', 'Chia Đôi', 'Trái Tim',
      'Chữ Thập', 'Đấu Trường', 'Ziczac', 'Bốn Đảo', 'Cổng Vườn', 'Cánh Bướm'
    ];

    class LevelDesigner {
      static generate(levelNum) {
        let seed = (levelNum * 2654435761) >>> 0;
        const rand = () => {
          seed = (seed * 1664525 + 1013904223) >>> 0;
          return seed / 4294967296;
        };

        // 12 varied board masks rotating endlessly so every stage has a fresh model
        const shapeIndex = levelNum === 1 ? 0 : (levelNum - 1) % 12;
        const shapeName = SHAPE_NAMES[shapeIndex] || 'Vườn Hoa';
        const mask = this._createBoardMask(shapeIndex);

        const activeCells = [];
        for (let r = 0; r < GRID_SIZE; r++) {
          for (let c = 0; c < GRID_SIZE; c++) {
            if (mask[r][c]) activeCells.push({ r, c });
          }
        }

        const numColors = (levelNum <= 2 || levelNum % 4 === 0) ? 5 : 6;
        const jelly = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(0));
        const locks = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(false));

        const goalCycle = (levelNum - 1) % 6;
        const goals = [];
        let moves = 22;
        let star1 = 2800 + levelNum * 420;

        if (goalCycle === 0) {
          // Clear all Dew-Jelly (1-layer & 2-layer)
          const jellyCount = Math.min(activeCells.length - 4, 14 + Math.floor(levelNum * 1.8));
          const doubleRatio = levelNum === 1 ? 0 : Math.min(0.68, 0.22 + levelNum * 0.04);
          const placed = this._pickSymmetricCells(mask, jellyCount, rand);
          let totalJelly = 0;
          for (const cell of placed) {
            jelly[cell.r][cell.c] = rand() < doubleRatio ? 2 : 1;
            totalJelly++;
          }
          if (levelNum >= 5) {
            const extraLocks = this._pickSymmetricCells(mask, Math.min(8, 2 + Math.floor(levelNum / 3)), rand, true);
            for (const lc of extraLocks) locks[lc.r][lc.c] = true;
          }
          goals.push({ type: 'jelly', target: totalJelly, current: 0 });
          moves = Math.max(19, 25 - Math.floor(levelNum / 12));
        } else if (goalCycle === 1) {
          // Collect 2 target 3D Flower species + optional cages
          const c1 = Math.floor(rand() * numColors);
          let c2 = Math.floor(rand() * numColors);
          if (c2 === c1) c2 = (c1 + 1) % numColors;
          const amount = Math.min(50, 18 + Math.floor(levelNum * 1.6));
          goals.push({ type: 'color', color: c1, target: amount, current: 0 });
          goals.push({ type: 'color', color: c2, target: amount, current: 0 });
          if (levelNum >= 4) {
            const lockCells = this._pickSymmetricCells(mask, Math.min(8, 4 + Math.floor(levelNum / 4)), rand, true);
            for (const lc of lockCells) locks[lc.r][lc.c] = true;
          }
          moves = Math.max(20, 25 - Math.floor(levelNum / 12));
        } else if (goalCycle === 2) {
          // Break Vine-Locked Flower Cages (+ optional Dew-Jelly)
          const lockCount = Math.min(18, 6 + Math.floor(levelNum * 0.85));
          const lockCells = this._pickSymmetricCells(mask, lockCount, rand, true);
          for (const lc of lockCells) locks[lc.r][lc.c] = true;
          if (levelNum >= 7) {
            const jCells = this._pickSymmetricCells(mask, Math.min(14, 6 + Math.floor(levelNum / 2)), rand);
            for (const jc of jCells) jelly[jc.r][jc.c] = 1;
            goals.push({ type: 'jelly', target: jCells.length, current: 0 });
          }
          goals.push({ type: 'locks', target: lockCells.length, current: 0 });
          moves = Math.max(20, 26 - Math.floor(levelNum / 14));
        } else if (goalCycle === 3) {
          // Create Striped & Crystal Wrapped specials
          const stripedTarget = Math.min(10, 3 + Math.floor(levelNum / 3));
          const wrappedTarget = Math.min(5, 1 + Math.floor(levelNum / 5));
          goals.push({ type: 'striped', target: stripedTarget, current: 0 });
          goals.push({ type: 'wrapped', target: wrappedTarget, current: 0 });
          moves = Math.max(21, 27 - Math.floor(levelNum / 14));
        } else if (goalCycle === 4) {
          // Forge 2x2 Fairy Flower-Butterflies + collect favorite flower
          const fishTarget = Math.min(6, 2 + Math.floor(levelNum / 4));
          const favCol = Math.floor(rand() * numColors);
          goals.push({ type: 'fish', color: favCol, target: fishTarget, current: 0 });
          goals.push({ type: 'color', color: favCol, target: Math.min(36, 16 + levelNum), current: 0 });
          const jCells = this._pickSymmetricCells(mask, Math.min(12, 4 + Math.floor(levelNum / 2)), rand);
          for (const jc of jCells) jelly[jc.r][jc.c] = 1;
          moves = Math.max(20, 26 - Math.floor(levelNum / 12));
        } else {
          // Reach Target Score + Dew-Jelly garden
          const scoreGoal = 3800 + levelNum * 650;
          star1 = scoreGoal;
          goals.push({ type: 'score', target: scoreGoal, current: 0 });
          const jCells = this._pickSymmetricCells(mask, Math.min(18, 8 + levelNum), rand);
          for (const jc of jCells) jelly[jc.r][jc.c] = rand() < 0.45 ? 2 : 1;
          moves = Math.max(19, 24 - Math.floor(levelNum / 12));
        }

        const starThresholds = [
          star1,
          Math.round(star1 * 1.55),
          Math.round(star1 * 2.25)
        ];

        return {
          level: levelNum,
          shapeIndex,
          shapeName,
          mask,
          jelly,
          locks,
          numColors,
          moves,
          goals,
          starThresholds
        };
      }

      static _createBoardMask(shapeIndex) {
        const m = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(true));
        const off = (coords) => { for (const [r, c] of coords) m[r][c] = false; };
        switch (shapeIndex % 12) {
          case 0: break; // Full 8x8
          case 1: off([[0,0],[0,1],[1,0],[0,6],[0,7],[1,7],[6,0],[7,0],[7,1],[6,7],[7,6],[7,7]]); break; // Cut corners
          case 2:
            for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) if (Math.abs(r - 3.5) + Math.abs(c - 3.5) > 5.2) m[r][c] = false;
            break; // Diamond
          case 3: off([[0,3],[0,4],[1,3],[1,4],[6,3],[6,4],[7,3],[7,4]]); break; // H-shape
          case 4: off([[3,2],[3,3],[3,4],[3,5],[4,2],[4,3],[4,4],[4,5]]); break; // Split island
          case 5: off([[0,0],[0,3],[0,4],[0,7],[6,0],[7,0],[7,1],[7,2],[6,7],[7,5],[7,6],[7,7]]); break; // Heart bloom
          case 6: off([[0,0],[0,1],[1,0],[1,1],[0,6],[0,7],[1,6],[1,7],[6,0],[6,1],[7,0],[7,1],[6,6],[6,7],[7,6],[7,7]]); break; // Plus cross
          case 7: off([[3,3],[3,4],[4,3],[4,4]]); break; // Hollow Ring Arena
          case 8: off([[0,6],[0,7],[1,7],[6,0],[7,0],[7,1],[3,3],[4,4]]); break; // Diagonal Staircase
          case 9: off([[0,3],[0,4],[3,0],[4,0],[3,7],[4,7],[7,3],[7,4]]); break; // Four Flower Isles
          case 10: off([[4,3],[4,4],[5,3],[5,4],[6,3],[6,4],[7,3],[7,4]]); break; // Garden Archway
          case 11: off([[0,0],[1,0],[2,0],[5,0],[6,0],[7,0],[0,7],[1,7],[2,7],[5,7],[6,7],[7,7],[3,3],[3,4]]); break; // Butterfly Matrix
        }
        return m;
      }

      static _pickSymmetricCells(mask, count, rand, avoidTopRow = false) {
        const candidates = [];
        for (let r = avoidTopRow ? 1 : 0; r < GRID_SIZE; r++) {
          for (let c = 0; c < GRID_SIZE / 2; c++) {
            if (mask[r][c]) candidates.push({ r, c });
          }
        }
        for (let i = candidates.length - 1; i > 0; i--) {
          const j = Math.floor(rand() * (i + 1));
          [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
        }
        const result = [];
        const used = new Set();
        for (const cand of candidates) {
          if (result.length >= count) break;
          const mirrorC = GRID_SIZE - 1 - cand.c;
          const k1 = `${cand.r},${cand.c}`;
          const k2 = `${cand.r},${mirrorC}`;
          if (!used.has(k1)) {
            used.add(k1);
            result.push({ r: cand.r, c: cand.c });
          }
          if (result.length < count && mask[cand.r][mirrorC] && !used.has(k2)) {
            used.add(k2);
            result.push({ r: cand.r, c: mirrorC });
          }
        }
        return result;
      }
    }

    /* ==========================================================================
       5. ANIMATED CARTOON CHARACTER AVATAR (BLINK, SMILE, CHEER & NERVOUS)
       ========================================================================== */
    class MascotAvatar {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.mood = 'happy';
        this.moodTimer = 0;
        this.blinkTimer = 2.4;
        this.isBlinking = false;
        this.time = 0;
      }

      setCheer(duration = 1.6) {
        this.mood = 'cheer';
        this.moodTimer = Math.max(this.moodTimer, duration);
      }

      setWin() {
        this.mood = 'win';
        this.moodTimer = 999;
      }

      update(dt, lowMoves) {
        this.time += dt;
        if (this.moodTimer > 0 && this.mood !== 'win') {
          this.moodTimer -= dt;
          if (this.moodTimer <= 0) {
            this.mood = lowMoves ? 'worried' : 'happy';
          }
        } else if (this.mood !== 'win') {
          this.mood = lowMoves ? 'worried' : 'happy';
        }

        this.blinkTimer -= dt;
        if (this.blinkTimer <= 0) {
          this.isBlinking = !this.isBlinking;
          this.blinkTimer = this.isBlinking ? 0.13 : 2.1 + Math.random() * 2.5;
        }
        this.render();
      }

      render() {
        const ctx = this.ctx;
        const w = this.canvas.width;
        const h = this.canvas.height;
        ctx.clearRect(0, 0, w, h);

        const bounce = (this.mood === 'cheer' || this.mood === 'win')
          ? Math.abs(Math.sin(this.time * 12)) * -9
          : Math.sin(this.time * 3.2) * 2.5;

        ctx.save();
        ctx.translate(w * 0.5, h * 0.58 + bounce);

        // Candy Bear Ears
        const drawEar = (ex, ey) => {
          ctx.beginPath();
          ctx.arc(ex, ey, 16, 0, Math.PI * 2);
          ctx.fillStyle = '#ff9bd0';
          ctx.fill();
          ctx.lineWidth = 3;
          ctx.strokeStyle = '#d1438a';
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(ex, ey, 8, 0, Math.PI * 2);
          ctx.fillStyle = '#ffe3f2';
          ctx.fill();
        };
        drawEar(-30, -34);
        drawEar(30, -34);

        // Marshmallow Head
        const headG = ctx.createRadialGradient(-12, -16, 6, 0, 0, 48);
        headG.addColorStop(0, '#ffffff');
        headG.addColorStop(0.55, '#ffe8f4');
        headG.addColorStop(1, '#ffb8dc');
        ctx.beginPath();
        ctx.ellipse(0, 0, 42, 38, 0, 0, Math.PI * 2);
        ctx.fillStyle = headG;
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#d1438a';
        ctx.stroke();

        // Tiny Golden Candy Crown
        ctx.beginPath();
        ctx.moveTo(-14, -36);
        ctx.lineTo(-10, -49);
        ctx.lineTo(0, -41);
        ctx.lineTo(10, -49);
        ctx.lineTo(14, -36);
        ctx.closePath();
        ctx.fillStyle = '#ffd52e';
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = '#c47200';
        ctx.stroke();

        // Rosy Cheeks
        ctx.fillStyle = 'rgba(255, 95, 155, 0.48)';
        ctx.beginPath(); ctx.ellipse(-22, 8, 9, 5.5, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(22, 8, 9, 5.5, 0, 0, Math.PI * 2); ctx.fill();

        if (this.mood === 'cheer' || this.mood === 'win') {
          ctx.strokeStyle = '#471535';
          ctx.lineWidth = 4.5;
          ctx.lineCap = 'round';
          ctx.beginPath(); ctx.arc(-15, -4, 8, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
          ctx.beginPath(); ctx.arc(15, -4, 8, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();

          ctx.beginPath();
          ctx.arc(0, 8, 13, 0, Math.PI);
          ctx.closePath();
          ctx.fillStyle = '#d91c5c';
          ctx.fill();
          ctx.beginPath();
          ctx.ellipse(0, 16, 7, 4, 0, 0, Math.PI * 2);
          ctx.fillStyle = '#ff7da8';
          ctx.fill();

          ctx.fillStyle = '#ffe133';
          const sp = Math.sin(this.time * 14) * 3;
          ctx.beginPath(); ctx.arc(-34, -14 + sp, 4.5, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(35, -12 - sp, 4.5, 0, Math.PI * 2); ctx.fill();
        } else if (this.mood === 'worried') {
          [-15, 15].forEach(ex => {
            ctx.beginPath();
            ctx.arc(ex, -4, 7.5, 0, Math.PI * 2);
            ctx.fillStyle = '#3b102d';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(ex - 2.5, -6.5, 2.5, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
          });

          ctx.strokeStyle = '#782252';
          ctx.lineWidth = 3.2;
          ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(-24, -13); ctx.lineTo(-9, -18); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(24, -13); ctx.lineTo(9, -18); ctx.stroke();

          ctx.beginPath();
          ctx.arc(0, 17, 7, Math.PI * 1.15, Math.PI * 1.85);
          ctx.strokeStyle = '#5e1740';
          ctx.lineWidth = 3.5;
          ctx.stroke();

          const dropY = -14 + ((this.time * 18) % 14);
          ctx.beginPath();
          ctx.moveTo(29, dropY - 7);
          ctx.quadraticCurveTo(35, dropY + 2, 29, dropY + 5);
          ctx.quadraticCurveTo(23, dropY + 2, 29, dropY - 7);
          ctx.fillStyle = '#4ad2ff';
          ctx.fill();
        } else {
          if (this.isBlinking) {
            ctx.strokeStyle = '#471535';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(-21, -4); ctx.lineTo(-9, -4); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(9, -4); ctx.lineTo(21, -4); ctx.stroke();
          } else {
            [-15, 15].forEach(ex => {
              ctx.beginPath();
              ctx.arc(ex, -4, 7.2, 0, Math.PI * 2);
              ctx.fillStyle = '#3b102d';
              ctx.fill();
              ctx.beginPath();
              ctx.arc(ex - 2.2, -6.5, 2.6, 0, Math.PI * 2);
              ctx.fillStyle = '#ffffff';
              ctx.fill();
              ctx.beginPath();
              ctx.arc(ex + 2.2, -1.5, 1.3, 0, Math.PI * 2);
              ctx.fillStyle = '#ffffff';
              ctx.fill();
            });
          }

          ctx.strokeStyle = '#5e1740';
          ctx.lineWidth = 3.6;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.arc(0, 7, 9, 0.15 * Math.PI, 0.85 * Math.PI);
          ctx.stroke();
        }

        ctx.restore();
      }
    }

    /* ==========================================================================
       6. ANIMATED MULTI-LAYER PASTEL WAVY BACKGROUND
       ========================================================================== */
    class PastelBackground {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.time = 0;
        this.bokeh = Array.from({ length: 16 }, () => ({
          x: Math.random(),
          y: Math.random(),
          r: 18 + Math.random() * 44,
          speed: 0.012 + Math.random() * 0.02,
          phase: Math.random() * Math.PI * 2,
          color: [
            'rgba(255,255,255,0.24)',
            'rgba(255,232,150,0.24)',
            'rgba(255,165,220,0.26)',
            'rgba(155,230,255,0.25)'
          ][Math.floor(Math.random() * 4)]
        }));
      }

      resize() {
        const rect = this.canvas.parentElement.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        this.canvas.width = Math.max(1, Math.floor(rect.width * dpr));
        this.canvas.height = Math.max(1, Math.floor(rect.height * dpr));
      }

      render(dt) {
        this.time += dt;
        const ctx = this.ctx;
        const w = this.canvas.width;
        const h = this.canvas.height;
        const t = this.time;

        // Multi-stop pastel sky gradient (cyan -> pink -> peach -> butter yellow)
        const base = ctx.createLinearGradient(0, 0, w * 0.4, h);
        base.addColorStop(0, '#9ee0ff');
        base.addColorStop(0.32, '#ffd6ec');
        base.addColorStop(0.68, '#ffe3b5');
        base.addColorStop(1, '#fff5a6');
        ctx.fillStyle = base;
        ctx.fillRect(0, 0, w, h);

        // Layered wavy candy landscape hills
        const ribbons = [
          { yBase: 0.22, amp: 0.058, freq: 2.2, speed: 0.55, color: 'rgba(255, 172, 218, 0.48)' },
          { yBase: 0.46, amp: 0.068, freq: 1.8, speed: -0.45, color: 'rgba(255, 205, 155, 0.46)' },
          { yBase: 0.68, amp: 0.062, freq: 2.5, speed: 0.38, color: 'rgba(150, 224, 255, 0.45)' },
          { yBase: 0.84, amp: 0.054, freq: 2.0, speed: -0.5, color: 'rgba(255, 148, 204, 0.44)' }
        ];

        for (const rb of ribbons) {
          ctx.beginPath();
          ctx.moveTo(0, h);
          const steps = 20;
          for (let i = 0; i <= steps; i++) {
            const nx = i / steps;
            const px = nx * w;
            const py = h * (
              rb.yBase +
              Math.sin(nx * Math.PI * rb.freq + t * rb.speed) * rb.amp +
              Math.cos(nx * Math.PI * 1.2 - t * rb.speed * 0.7) * (rb.amp * 0.45)
            );
            ctx.lineTo(px, py);
          }
          ctx.lineTo(w, h);
          ctx.closePath();
          ctx.fillStyle = rb.color;
          ctx.fill();
        }

        // Floating pastel bokeh orbs
        for (const b of this.bokeh) {
          b.y -= b.speed * dt;
          if (b.y < -0.12) {
            b.y = 1.12;
            b.x = Math.random();
          }
          const bx = (b.x + Math.sin(t * 0.8 + b.phase) * 0.04) * w;
          const by = b.y * h;
          ctx.beginPath();
          ctx.arc(bx, by, b.r, 0, Math.PI * 2);
          ctx.fillStyle = b.color;
          ctx.fill();
        }
      }
    }

    /* ==========================================================================
       7. MAIN SUGAR POP DELUXE GAME ENGINE
       ========================================================================== */
    class SugarPopGame {
      constructor() {
        this.bgCanvas = document.getElementById('bg-canvas');
        this.canvas = document.getElementById('game-canvas');
        this.ctx = this.canvas.getContext('2d');
        this.mascotCanvas = document.getElementById('mascot-canvas');

        this.boardOffsetX = 0;
        this.boardOffsetY = 0;
        this.dpr = Math.min(window.devicePixelRatio || 1, 2);

        this.currentLevelNum = 1;
        this.boosters = { hammer: 3, switch: 3, brush: 3 };
        this.activeBooster = null;
        this.paused = false;

        this.levelData = null;
        this.grid = [];
        this.state = STATES.IDLE;
        this.score = 0;
        this.movesLeft = 20;
        this.earnedStars = 0;
        this.cascadeCombo = 0;

        this.swapA = null;
        this.swapB = null;
        this.swapProgress = 0;
        this.lastSwipeDir = 'h';
        this.lastSwappedCells = [];

        this.selectedCell = null;
        this.pointerDownCell = null;
        this.pointerStartX = 0;
        this.pointerStartY = 0;
        this.isDragging = false;

        this.idleTimer = 0;
        this.hintPair = null;
        this.shuffleTimer = 0;
        this.shuffleSwapped = false;

        // Visual FX pools
        this.particles = [];
        this.shockwaves = [];
        this.lasers = [];
        this.lightnings = [];
        this.floatingTexts = [];
        this.giantOverlays = [];
        this.levitatingBombs = [];
        this.flyingFish = [];
        this.specialQueue = [];
        this.screenShake = 0;
        this.time = 0;
        this.candyIdCounter = 1;

        this.progress = this._loadProgress();
        this._bindUI();
        this._bindInput();
        this._handleResize();
        window.addEventListener('resize', () => this._handleResize());

        this.loadLevel(this.progress.current || 1);

        this.lastFrameTime = performance.now();
        if (!__candyDestroyed) requestAnimationFrame((t) => this._loop(t));
      }

      _loadProgress() {
        try {
          const raw = JSON.parse(localStorage.getItem('sugarpop_v2_progress') || '{}');
          return {
            current: Math.max(1, parseInt(raw.current || '1', 10) || 1),
            maxUnlocked: Math.max(12, parseInt(raw.maxUnlocked || '12', 10) || 12),
            stars: raw.stars && typeof raw.stars === 'object' ? raw.stars : {}
          };
        } catch (e) {
          return { current: 1, maxUnlocked: 12, stars: {} };
        }
      }

      _persistProgress() {
        try {
          localStorage.setItem('sugarpop_v2_progress', JSON.stringify(this.progress));
        } catch (e) {}
      }

      _openLevelsModal() {
        const grid = document.getElementById('candy-lv-grid');
        const modal = document.getElementById('candy-levels-modal');
        if (!grid || !modal) return;
        grid.innerHTML = '';
        const maxShow = Math.max(20, this.progress.maxUnlocked + 4);
        for (let lv = 1; lv <= maxShow; lv++) {
          const unlocked = lv <= this.progress.maxUnlocked;
          const st = this.progress.stars[String(lv)] || 0;
          const sName = SHAPE_NAMES[lv === 1 ? 0 : (lv - 1) % 12];
          const btn = document.createElement('button');
          btn.className = 'candy-lv-btn' + (lv === this.currentLevelNum ? ' active-lv' : '') + (!unlocked ? ' locked-lv' : '');
          const starStr = unlocked ? ('★'.repeat(st) + '☆'.repeat(3 - st)) : '🔒';
          btn.innerHTML = `<span>Màn ${lv}</span><span class="candy-lv-stars">${starStr}</span><span class="candy-lv-shape">${sName}</span>`;
          if (unlocked) {
            btn.addEventListener('click', () => {
              this.sound.unlock();
              modal.classList.remove('open');
              document.getElementById('win-modal').classList.remove('open');
              document.getElementById('lose-modal').classList.remove('open');
              document.getElementById('pause-modal').classList.remove('open');
              this.paused = false;
              this.loadLevel(lv);
            });
          }
          grid.appendChild(btn);
        }
        this.paused = true;
        modal.classList.add('open');
      }

      /* ------------------------------------------------------------------------
         UI & POINTER / TOUCH INPUT HANDLING
         ------------------------------------------------------------------------ */
      _bindUI() {
        const soundBtn = document.getElementById('sound-btn');
        soundBtn.addEventListener('click', () => {
          const muted = this.sound.toggleMute();
          const w = soundBtn.querySelector('.csnd-w'), m = soundBtn.querySelector('.csnd-m');
          if (w) w.classList.toggle('hidden', muted);
          if (m) m.classList.toggle('hidden', !muted);
          soundBtn.classList.toggle('muted', muted);
        });

        const pauseModal = document.getElementById('pause-modal');
        const levelsModal = document.getElementById('candy-levels-modal');
        const setPaused = (p) => {
          this.paused = p;
          if (p) {
            document.getElementById('pause-level-label').textContent = `Level ${this.currentLevelNum} • ${this.levelData ? this.levelData.shapeName : ''}`;
            document.getElementById('pause-score').textContent = this.score.toLocaleString('vi-VN');
            pauseModal.classList.add('open');
          } else {
            pauseModal.classList.remove('open');
          }
        };
        document.getElementById('level-label').addEventListener('click', () => this._openLevelsModal());
        document.getElementById('levels-close-btn').addEventListener('click', () => {
          levelsModal.classList.remove('open');
          if (!pauseModal.classList.contains('open') && !document.getElementById('win-modal').classList.contains('open') && !document.getElementById('lose-modal').classList.contains('open')) {
            this.paused = false;
          }
        });
        document.getElementById('pause-btn').addEventListener('click', () => setPaused(true));
        document.getElementById('resume-btn').addEventListener('click', () => setPaused(false));
        document.getElementById('pause-retry-btn').addEventListener('click', () => {
          setPaused(false);
          this.loadLevel(this.currentLevelNum);
        });
        document.getElementById('pause-levels-btn').addEventListener('click', () => {
          pauseModal.classList.remove('open');
          this._openLevelsModal();
        });
        document.getElementById('pause-menu-btn').addEventListener('click', () => {
          setPaused(false);
          showMenu();
        });

        document.querySelectorAll('.booster-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            this.sound.unlock();
            if (this.state !== STATES.IDLE) return;
            const type = btn.dataset.booster;
            if (this.boosters[type] <= 0) {
              this.sound.playInvalidSwap();
              return;
            }
            if (this.activeBooster === type) {
              this._setActiveBooster(null);
            } else {
              this._setActiveBooster(type);
              this.sound.playSwap();
            }
          });
        });

        document.getElementById('next-level-btn').addEventListener('click', () => {
          this.sound.unlock();
          this.sound.playBooster();
          document.getElementById('win-modal').classList.remove('open');
          this.loadLevel(this.currentLevelNum + 1);
        });
        document.getElementById('win-replay-btn').addEventListener('click', () => {
          this.sound.unlock();
          document.getElementById('win-modal').classList.remove('open');
          this.loadLevel(this.currentLevelNum);
        });
        document.getElementById('win-levels-btn').addEventListener('click', () => {
          document.getElementById('win-modal').classList.remove('open');
          this._openLevelsModal();
        });
        document.getElementById('win-menu-btn').addEventListener('click', () => {
          document.getElementById('win-modal').classList.remove('open');
          showMenu();
        });

        document.getElementById('retry-level-btn').addEventListener('click', () => {
          this.sound.unlock();
          this.sound.playSwap();
          document.getElementById('lose-modal').classList.remove('open');
          this.loadLevel(this.currentLevelNum);
        });
        document.getElementById('lose-levels-btn').addEventListener('click', () => {
          document.getElementById('lose-modal').classList.remove('open');
          this._openLevelsModal();
        });
        document.getElementById('lose-menu-btn').addEventListener('click', () => {
          document.getElementById('lose-modal').classList.remove('open');
          showMenu();
        });
      }

      _setActiveBooster(type) {
        this.activeBooster = type;
        this.selectedCell = null;
        document.querySelectorAll('.booster-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.booster === type);
        });
        const banner = document.getElementById('booster-banner');
        const messages = {
          hammer: '🔨 Chọn 1 ô bất kỳ để đập vỡ không tốn lượt!',
          switch: '🔄 Kéo đổi 2 viên kẹo liền kề bất kỳ!',
          brush:  '🖌️ Chọn 1 viên kẹo thường để biến thành Kẹo Sọc!'
        };
        if (type) {
          banner.textContent = messages[type];
          banner.classList.add('visible');
        } else {
          banner.classList.remove('visible');
        }
      }

      _bindInput() {
        const getCellFromEvent = (e) => {
          const rect = this.canvas.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          const c = Math.floor((x - this.boardOffsetX) / this.tileSize);
          const r = Math.floor((y - this.boardOffsetY) / this.tileSize);
          if (r >= 0 && r < GRID_SIZE && c >= 0 && c < GRID_SIZE && this.grid[r][c].active) {
            return { r, c, x, y };
          }
          return null;
        };

        this.canvas.addEventListener('pointerdown', (e) => {
          this.sound.unlock();
          if (this.state !== STATES.IDLE) return;
          const hit = getCellFromEvent(e);
          if (!hit) return;

          this.idleTimer = 0;
          this.hintPair = null;

          if (this.activeBooster === 'hammer') {
            this._useHammer(hit.r, hit.c);
            return;
          }
          if (this.activeBooster === 'brush') {
            this._useStripedBrush(hit.r, hit.c);
            return;
          }

          const cell = this.grid[hit.r][hit.c];
          if (!cell.candy || cell.locked) {
            this.sound.playInvalidSwap();
            return;
          }

          this.pointerDownCell = { r: hit.r, c: hit.c };
          this.pointerStartX = hit.x;
          this.pointerStartY = hit.y;
          this.isDragging = true;

          // Click-click adjacent swap support
          if (this.selectedCell) {
            const dr = Math.abs(this.selectedCell.r - hit.r);
            const dc = Math.abs(this.selectedCell.c - hit.c);
            if (dr + dc === 1) {
              const prev = this.grid[this.selectedCell.r][this.selectedCell.c];
              if (prev.candy && !prev.locked) {
                this._initiateSwap(this.selectedCell, { r: hit.r, c: hit.c });
                this.selectedCell = null;
                this.isDragging = false;
                return;
              }
            } else if (dr === 0 && dc === 0) {
              this.selectedCell = null;
              return;
            }
          }
          this.selectedCell = { r: hit.r, c: hit.c };
        });

        this.canvas.addEventListener('pointermove', (e) => {
          if (!this.isDragging || !this.pointerDownCell || this.state !== STATES.IDLE) return;
          const rect = this.canvas.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          const dx = x - this.pointerStartX;
          const dy = y - this.pointerStartY;
          const threshold = this.tileSize * 0.28;

          if (Math.hypot(dx, dy) >= threshold) {
            let tr = this.pointerDownCell.r;
            let tc = this.pointerDownCell.c;
            if (Math.abs(dx) > Math.abs(dy)) {
              tc += dx > 0 ? 1 : -1;
            } else {
              tr += dy > 0 ? 1 : -1;
            }
            this.isDragging = false;
            this.selectedCell = null;

            if (tr >= 0 && tr < GRID_SIZE && tc >= 0 && tc < GRID_SIZE) {
              const neighbor = this.grid[tr][tc];
              if (neighbor.active && neighbor.candy && !neighbor.locked) {
                this._initiateSwap(this.pointerDownCell, { r: tr, c: tc });
              } else {
                this.sound.playInvalidSwap();
              }
            }
            this.pointerDownCell = null;
          }
        });

        const endPointer = () => {
          this.isDragging = false;
          this.pointerDownCell = null;
        };
        window.addEventListener('pointerup', endPointer);
        window.addEventListener('pointercancel', endPointer);
      }

      _handleResize() {
        this.background.resize();
        const container = document.getElementById('board-container');
        const rect = container.getBoundingClientRect();
        this.dpr = Math.min(window.devicePixelRatio || 1, 2);

        const cssW = Math.max(100, rect.width);
        const cssH = Math.max(100, rect.height);
        this.canvas.width = Math.floor(cssW * this.dpr);
        this.canvas.height = Math.floor(cssH * this.dpr);

        const boardSide = Math.min(cssW - 8, cssH - 8);
        this.tileSize = Math.floor(boardSide / GRID_SIZE);
        const totalBoardPx = this.tileSize * GRID_SIZE;
        this.boardOffsetX = Math.floor((cssW - totalBoardPx) * 0.5);
        this.boardOffsetY = Math.floor((cssH - totalBoardPx) * 0.5);

        if (this.grid.length === GRID_SIZE) {
          for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE; c++) {
              const candy = this.grid[r][c].candy;
              if (candy && this.state === STATES.IDLE) {
                candy.x = this._colToX(c);
                candy.y = this._rowToY(r);
              }
            }
          }
        }
      }

      _colToX(c) { return this.boardOffsetX + (c + 0.5) * this.tileSize; }
      _rowToY(r) { return this.boardOffsetY + (r + 0.5) * this.tileSize; }

      /* ------------------------------------------------------------------------
         LEVEL LOADING & BOARD SETUP
         ------------------------------------------------------------------------ */
      loadLevel(levelNum) {
        this.currentLevelNum = levelNum;
        if (this.progress) {
          this.progress.current = levelNum;
          this.progress.maxUnlocked = Math.max(this.progress.maxUnlocked || 12, levelNum);
          this._persistProgress();
        }
        // Automatically refresh all 3 bottom boosters on every level start / replay
        this.boosters = { hammer: 3, switch: 3, brush: 3 };
        this.levelData = LevelDesigner.generate(levelNum);
        this.score = 0;
        this.earnedStars = 0;
        this.movesLeft = this.levelData.moves;
        this.cascadeCombo = 0;
        this.state = STATES.IDLE;
        this.idleTimer = 0;
        this.hintPair = null;
        this.selectedCell = null;
        this._setActiveBooster(null);

        this.particles = [];
        this.shockwaves = [];
        this.lasers = [];
        this.lightnings = [];
        this.floatingTexts = [];
        this.giantOverlays = [];
        this.levitatingBombs = [];
        this.flyingFish = [];
        this.specialQueue = [];
        this.screenShake = 0;
        this.mascot.mood = 'happy';
        this.mascot.moodTimer = 0;

        this.grid = [];
        for (let r = 0; r < GRID_SIZE; r++) {
          const row = [];
          for (let c = 0; c < GRID_SIZE; c++) {
            const active = this.levelData.mask[r][c];
            row.push({
              r, c,
              active,
              jelly: active ? this.levelData.jelly[r][c] : 0,
              locked: active ? this.levelData.locks[r][c] : false,
              candy: null
            });
          }
          this.grid.push(row);
        }

        // Fill initial candies with zero auto-matches
        for (let r = 0; r < GRID_SIZE; r++) {
          for (let c = 0; c < GRID_SIZE; c++) {
            if (!this.grid[r][c].active) continue;
            const forbidden = new Set();
            if (c >= 2 && this._sameColorAt(r, c - 1, r, c - 2)) {
              forbidden.add(this.grid[r][c - 1].candy.color);
            }
            if (r >= 2 && this._sameColorAt(r - 1, c, r - 2, c)) {
              forbidden.add(this.grid[r - 1][c].candy.color);
            }
            const allowed = [];
            for (let col = 0; col < this.levelData.numColors; col++) {
              if (!forbidden.has(col)) allowed.push(col);
            }
            const color = allowed[Math.floor(Math.random() * allowed.length)];
            const candy = this._createCandy(color, SPECIAL.NONE, r, c);
            candy.y = this._rowToY(r) - this.tileSize * (2.5 + (GRID_SIZE - r) * 0.25);
            candy.vy = 180;
            this.grid[r][c].candy = candy;
          }
        }

        if (this._findValidMoves().length === 0) {
          this._forceShuffleCandies();
        }

        this.state = STATES.FALLING;
        this._updateHUD();
        this._renderTargetBox();
      }

      _createCandy(color, special, r, c) {
        return {
          id: this.candyIdCounter++,
          color,
          special,
          x: this._colToX(c),
          y: this._rowToY(r),
          vy: 0,
          scale: 1,
          scaleX: 1,
          scaleY: 1,
          bounceOffset: 0,
          bounceVel: 0,
          wrappedWave2: null,
          isFalling: false
        };
      }

      _sameColorAt(r1, c1, r2, c2) {
        const a = this.grid[r1]?.[c1]?.candy;
        const b = this.grid[r2]?.[c2]?.candy;
        return a && b && a.color >= 0 && a.color === b.color;
      }

      /* ------------------------------------------------------------------------
         BOOSTERS: LOLLIPOP HAMMER & STRIPED BRUSH
         ------------------------------------------------------------------------ */
      _useHammer(r, c) {
        const cell = this.grid[r][c];
        if (!cell.active || (!cell.candy && cell.jelly <= 0)) {
          this.sound.playInvalidSwap();
          return;
        }
        this.boosters.hammer--;
        this._setActiveBooster(null);
        this.sound.playExplosion(false);
        this.screenShake = Math.max(this.screenShake, 8);

        const cx = this._colToX(c);
        const cy = this._rowToY(r);
        this.shockwaves.push({
          x: cx, y: cy, radius: 6, maxRadius: this.tileSize * 1.45,
          color: '#ff52a8', alpha: 1, lineWidth: 5
        });

        this.cascadeCombo = 0;
        const triggeredSpecials = [];
        this._damageCell(r, c, true, triggeredSpecials);
        this._processTriggeredSpecials(triggeredSpecials);
        this._updateHUD();

        if (this.specialQueue.length > 0) {
          this.state = STATES.SPECIAL_ANIM;
        } else {
          this.state = STATES.FALLING;
          this._applyGravityAndSpawn();
        }
      }

      _useStripedBrush(r, c) {
        const cell = this.grid[r][c];
        if (!cell.active || !cell.candy || cell.locked || cell.candy.special !== SPECIAL.NONE) {
          this.sound.playInvalidSwap();
          return;
        }
        this.boosters.brush--;
        this._setActiveBooster(null);
        this.sound.playBooster();

        cell.candy.special = Math.random() < 0.5 ? SPECIAL.STRIPED_H : SPECIAL.STRIPED_V;
        cell.candy.scale = 1.48;
        this._recordGoalProgress('striped', 1);

        const cx = this._colToX(c);
        const cy = this._rowToY(r);
        this.shockwaves.push({
          x: cx, y: cy, radius: 4, maxRadius: this.tileSize * 1.25,
          color: '#ffffff', alpha: 1, lineWidth: 4
        });
        this._spawnBurstParticles(cx, cy, CANDY_COLORS[cell.candy.color].glow, 14);
        this._updateHUD();
      }

      /* ------------------------------------------------------------------------
         SWAP VALIDATION & ALL 6 SPECIAL + SPECIAL COMBOS
         ------------------------------------------------------------------------ */
      _initiateSwap(a, b) {
        this.swapA = { r: a.r, c: a.c };
        this.swapB = { r: b.r, c: b.c };
        this.swapProgress = 0;
        this.lastSwipeDir = a.r === b.r ? 'h' : 'v';
        this.lastSwappedCells = [this.swapA, this.swapB];
        this.state = STATES.SWAPPING;
        this.sound.playSwap();
      }

      _completeSwap() {
        const cellA = this.grid[this.swapA.r][this.swapA.c];
        const cellB = this.grid[this.swapB.r][this.swapB.c];

        // Swap candy objects
        const temp = cellA.candy;
        cellA.candy = cellB.candy;
        cellB.candy = temp;

        if (cellA.candy) { cellA.candy.x = this._colToX(cellA.c); cellA.candy.y = this._rowToY(cellA.r); }
        if (cellB.candy) { cellB.candy.x = this._colToX(cellB.c); cellB.candy.y = this._rowToY(cellB.r); }

        const cA = cellA.candy;
        const cB = cellB.candy;
        const isFreeSwitch = this.activeBooster === 'switch';

        const isSpecA = cA && cA.special !== SPECIAL.NONE;
        const isSpecB = cB && cB.special !== SPECIAL.NONE;
        const hasBomb = (cA && cA.special === SPECIAL.BOMB) || (cB && cB.special === SPECIAL.BOMB);
        const bothSpecial = isSpecA && isSpecB;
        const matches = this._findMatches();

        if (!bothSpecial && !hasBomb && matches.length === 0 && !isFreeSwitch) {
          // Invalid move -> bounce back!
          const t = cellA.candy;
          cellA.candy = cellB.candy;
          cellB.candy = t;
          this.swapProgress = 0;
          this.state = STATES.SWAP_BACK;
          this.sound.playInvalidSwap();
          return;
        }

        if (isFreeSwitch) {
          this.boosters.switch--;
          this._setActiveBooster(null);
          this.sound.playBooster();
        } else {
          this.movesLeft = Math.max(0, this.movesLeft - 1);
        }

        this.cascadeCombo = 0;
        this._updateHUD();

        if (bothSpecial) {
          this._executeSpecialCombo(cellA, cellB);
          return;
        }
        if (hasBomb) {
          const bombCell = cA.special === SPECIAL.BOMB ? cellA : cellB;
          const otherCell = bombCell === cellA ? cellB : cellA;
          this._executeColorBombWithColor(bombCell, otherCell.candy.color);
          return;
        }
        if (matches.length === 0) {
          this.state = STATES.IDLE;
          return;
        }

        this.state = STATES.MATCHING;
      }

      _executeSpecialCombo(cellA, cellB) {
        const sA = cellA.candy.special;
        const sB = cellB.candy.special;
        const isStriped = (s) => s === SPECIAL.STRIPED_H || s === SPECIAL.STRIPED_V;
        const isWrapped = (s) => s === SPECIAL.WRAPPED;
        const isFish = (s) => s === SPECIAL.FISH;
        const isBomb = (s) => s === SPECIAL.BOMB;

        const targetCell = cellB;
        const cx = this._colToX(targetCell.c);
        const cy = this._rowToY(targetCell.r);

        this.mascot.setCheer(2.0);
        this.cascadeCombo = Math.max(this.cascadeCombo, 2);

        // COMBO 6: Color Bomb + Color Bomb -> 100% Board Clear + 1 layer off all obstacles!
        if (isBomb(sA) && isBomb(sB)) {
          this._addScore(2500);
          this._spawnPraiseText(5);
          cellA.candy = null;
          cellB.candy = null;
          this.levitatingBombs.push({ x: cx, y: cy, life: 0.34, maxLife: 0.34 });
          this.sound.playExplosion(true);
          this.sound.playLightning();
          this.screenShake = 18;

          ['#ff3377', '#ffe61a', '#26d9ff', '#a626ff', '#ffffff'].forEach((col, i) => {
            this.shockwaves.push({
              x: cx, y: cy, radius: 10 + i * 8, maxRadius: this.tileSize * 9,
              color: col, alpha: 1, lineWidth: 10 - i * 1.3
            });
          });

          this.specialQueue.push({
            delay: 0.28,
            fn: () => {
              for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                  if (this.grid[r][c].active) {
                    this._damageCell(r, c, true, null, true);
                  }
                }
              }
            }
          });
          this.state = STATES.SPECIAL_ANIM;
          return;
        }

        // COMBO 4 & 5: Color Bomb + Striped OR Color Bomb + Wrapped
        if (isBomb(sA) || isBomb(sB)) {
          const bombCell = isBomb(sA) ? cellA : cellB;
          const otherCell = bombCell === cellA ? cellB : cellA;
          const targetColor = otherCell.candy.color;
          const transformTo = isStriped(otherCell.candy.special) ? 'striped' : (isFish(otherCell.candy.special) ? 'fish' : 'wrapped');

          this._addScore(1500);
          this._spawnPraiseText(4);
          this.sound.playLightning();

          const bx = this._colToX(bombCell.c);
          const by = this._rowToY(bombCell.r);
          this.levitatingBombs.push({ x: bx, y: by, life: 0.42, maxLife: 0.42 });

          bombCell.candy = null;
          if (bombCell.jelly > 0) this._damageJelly(bombCell.r, bombCell.c);

          const targets = [];
          for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE; c++) {
              const cell = this.grid[r][c];
              if (cell.active && cell.candy && cell.candy.color === targetColor) {
                targets.push(cell);
              }
            }
          }

          for (const tc of targets) {
            this.lightnings.push({
              x1: bx, y1: by,
              x2: this._colToX(tc.c), y2: this._rowToY(tc.r),
              color: CANDY_COLORS[targetColor].glow,
              life: 0.42, maxLife: 0.42
            });
            if (tc.locked) {
              // Break lock so it can participate cleanly
              this._damageCell(tc.r, tc.c, true, null);
            }
            if (tc.candy) {
              if (transformTo === 'striped') {
                tc.candy.special = Math.random() < 0.5 ? SPECIAL.STRIPED_H : SPECIAL.STRIPED_V;
                this._recordGoalProgress('striped', 1);
              } else if (transformTo === 'fish') {
                tc.candy.special = SPECIAL.FISH;
                this._recordGoalProgress('fish', 1);
              } else {
                tc.candy.special = SPECIAL.WRAPPED;
                this._recordGoalProgress('wrapped', 1);
              }
              tc.candy.scale = 1.45;
            }
          }

          targets.forEach((tc, idx) => {
            this.specialQueue.push({
              delay: idx === 0 ? 0.36 : 0.11,
              fn: () => {
                if (tc.candy && tc.candy.special !== SPECIAL.NONE) {
                  const chain = [];
                  this._triggerSpecialCandy(tc.r, tc.c, chain);
                  this._processTriggeredSpecials(chain);
                }
              }
            });
          });

          this.state = STATES.SPECIAL_ANIM;
          return;
        }

        // COMBO: Fish + Fish -> 3 Jelly Fish Swarm!
        if (isFish(sA) && isFish(sB)) {
          this._addScore(650);
          this._spawnPraiseText(3);
          const colA = cellA.candy.color >= 0 ? cellA.candy.color : 0;
          const colB = cellB.candy.color >= 0 ? cellB.candy.color : colA;
          cellA.candy = null;
          cellB.candy = null;
          if (cellA.jelly > 0) this._damageJelly(cellA.r, cellA.c);
          if (cellB.jelly > 0) this._damageJelly(cellB.r, cellB.c);

          const used = new Set();
          this._launchFish(targetCell.r, targetCell.c, colA, null, used);
          this._launchFish(targetCell.r, targetCell.c, colB, null, used);
          this._launchFish(targetCell.r, targetCell.c, colA, null, used);
          this.state = STATES.SPECIAL_ANIM;
          return;
        }

        // COMBO: Fish + Striped OR Fish + Wrapped -> Super Fish delivers Special to target!
        if ((isFish(sA) || isFish(sB)) && (isStriped(sA) || isStriped(sB) || isWrapped(sA) || isWrapped(sB))) {
          this._addScore(800);
          this._spawnPraiseText(3);
          const fishColor = isFish(sA) ? cellA.candy.color : cellB.candy.color;
          const payload = (isWrapped(sA) || isWrapped(sB)) ? 'wrapped' : 'striped';
          cellA.candy = null;
          cellB.candy = null;
          if (cellA.jelly > 0) this._damageJelly(cellA.r, cellA.c);
          if (cellB.jelly > 0) this._damageJelly(cellB.r, cellB.c);

          this._launchFish(targetCell.r, targetCell.c, fishColor >= 0 ? fishColor : 0, payload);
          this.state = STATES.SPECIAL_ANIM;
          return;
        }

        // COMBO 1: Striped + Striped -> Cross Laser (1 Full Row + 1 Full Column)
        if (isStriped(sA) && isStriped(sB)) {
          this._addScore(600);
          this._spawnPraiseText(2);
          cellA.candy = null;
          cellB.candy = null;
          if (cellA.jelly > 0) this._damageJelly(cellA.r, cellA.c);
          if (cellB.jelly > 0) this._damageJelly(cellB.r, cellB.c);

          const chain = [];
          this._fireLaserRow(targetCell.r, '#ffffff', chain);
          this._fireLaserCol(targetCell.c, '#ffffff', chain);
          this._processTriggeredSpecials(chain);
          this.state = this.specialQueue.length > 0 ? STATES.SPECIAL_ANIM : STATES.FALLING;
          if (this.state === STATES.FALLING) this._applyGravityAndSpawn();
          return;
        }

        // COMBO 2: Striped + Wrapped -> Giant 3x3 Candy + 3 Full Rows & 3 Full Columns!
        if ((isStriped(sA) && isWrapped(sB)) || (isWrapped(sA) && isStriped(sB))) {
          const color = cellB.candy.color >= 0 ? cellB.candy.color : cellA.candy.color;
          this._addScore(1200);
          this._spawnPraiseText(3);
          cellA.candy = null;
          cellB.candy = null;
          if (cellA.jelly > 0) this._damageJelly(cellA.r, cellA.c);
          if (cellB.jelly > 0) this._damageJelly(cellB.r, cellB.c);
          this.sound.playSpecialCreate();

          this.giantOverlays.push({ x: cx, y: cy, color, life: 0.38, maxLife: 0.38 });

          this.specialQueue.push({
            delay: 0.36,
            fn: () => {
              this.screenShake = 14;
              const chain = [];
              const glow = CANDY_COLORS[color].glow;
              for (let d = -1; d <= 1; d++) {
                if (targetCell.r + d >= 0 && targetCell.r + d < GRID_SIZE) {
                  this._fireLaserRow(targetCell.r + d, glow, chain);
                }
                if (targetCell.c + d >= 0 && targetCell.c + d < GRID_SIZE) {
                  this._fireLaserCol(targetCell.c + d, glow, chain);
                }
              }
              this._processTriggeredSpecials(chain);
            }
          });
          this.state = STATES.SPECIAL_ANIM;
          return;
        }

        // COMBO 3: Wrapped + Wrapped -> Super 5x5 Explosion TWICE!
        if (isWrapped(sA) && isWrapped(sB)) {
          const color = cellB.candy.color;
          this._addScore(1400);
          this._spawnPraiseText(4);
          cellA.candy = null;
          if (cellA.jelly > 0) this._damageJelly(cellA.r, cellA.c);

          this.sound.playExplosion(true);
          this.screenShake = 16;
          this.shockwaves.push({
            x: cx, y: cy, radius: 10, maxRadius: this.tileSize * 3.5,
            color: '#ffe040', alpha: 1, lineWidth: 9
          });

          const chain = [];
          for (let dr = -2; dr <= 2; dr++) {
            for (let dc = -2; dc <= 2; dc++) {
              const nr = targetCell.r + dr;
              const nc = targetCell.c + dc;
              if (nr === targetCell.r && nc === targetCell.c) continue;
              if (nr >= 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE && this.grid[nr][nc].active) {
                this._damageCell(nr, nc, true, chain);
              }
            }
          }

          if (targetCell.candy) {
            targetCell.candy.special = SPECIAL.WRAPPED;
            targetCell.candy.color = color;
            targetCell.candy.wrappedWave2 = '5x5';
            targetCell.candy.scale = 1.32;
          }
          if (targetCell.jelly > 0) this._damageJelly(targetCell.r, targetCell.c);

          this._processTriggeredSpecials(chain);
          this.state = this.specialQueue.length > 0 ? STATES.SPECIAL_ANIM : STATES.FALLING;
          if (this.state === STATES.FALLING) this._applyGravityAndSpawn();
        }
      }

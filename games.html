  }

  /* ==================== 5. 2048 VƯỜN HOA 3D (HOA TIẾN HÓA PHÁT SÁNG • 60FPS) ==================== */
  function start2048() {
    hdrTitle.textContent = "2048 Vườn Hoa";
    var cv = makeCanvas(1), ctx = cv.ctx, W = cv.w, pad = 10, cell = (W - pad*2)/4;
    var MAP = {
      2:{bg:"#1e3a34",bd:"#94a3b8",sp:7}, 4:{bg:"#0c4a6e",bd:"#38bdf8",sp:4},
      8:{bg:"#065f46",bd:"#34d399",sp:5}, 16:{bg:"#831843",bd:"#f472b6",sp:2},
      32:{bg:"#581c87",bd:"#c084fc",sp:3}, 64:{bg:"#9a3412",bd:"#fb923c",sp:6},
      128:{bg:"#8f0a34",bd:"#fb7185",sp:0}, 256:{bg:"#92400e",bd:"#fbbf24",sp:1},
      512:{bg:"#312e81",bd:"#818cf8",sp:8}, 1024:{bg:"#701a75",bd:"#f472b6",sp:9},
      2048:{bg:"#b45309",bd:"#fde047",sp:1}
    };
    var g = [], sc = 0, won2048 = false, over = false, clock = 0, lastT = performance.now();

    function spawn() {
      var emp=[]; for(var r=0;r<4;r++) for(var c=0;c<4;c++) if(!g[r][c]) emp.push([r,c]);
      if(!emp.length) return;
      var p=emp[(Math.random()*emp.length)|0]; g[p[0]][p[1]]={v:Math.random()<0.9?2:4, s:0.25};
    }
    function canMove2048() {
      for (var r=0;r<4;r++) for (var c=0;c<4;c++) {
        if (!g[r][c]) return true;
        if (c+1<4 && g[r][c+1] && g[r][c].v===g[r][c+1].v) return true;
        if (r+1<4 && g[r+1][c] && g[r][c].v===g[r+1][c].v) return true;
      }
      return false;
    }
    function reset() {
      hideResultModal();
      g = Array.from({length:4}, function(){ return [null,null,null,null]; });
      sc = 0; won2048 = false; over = false; spawn(); spawn(); hudSt.textContent = "Điểm: 0 • Vuốt hoặc phím mũi tên";
    }
    function slide(line) {
      var a = line.filter(Boolean).map(function(x){return x.v;}), add = 0;
      for (var i=0;i<a.length-1;i++) if(a[i]===a[i+1]) { a[i]*=2; add+=a[i]; a.splice(i+1,1); }
      while (a.length<4) a.push(0);
      return {a:a, add:add};
    }
    function move(dir) {
      if (over) return;
      var ch = false, add = 0, hit2048 = false;
      for (var i=0;i<4;i++) {
        var line = [];
        for (var j=0;j<4;j++) line.push(dir===0?g[j][i]:(dir===1?g[i][3-j]:(dir===2?g[3-j][i]:g[i][j])));
        var res = slide(line); add += res.add;
        for (var k=0;k<4;k++) {
          var nv = res.a[k], r = dir===0?k:(dir===1?i:(dir===2?3-k:i)), c = dir===0?i:(dir===1?3-k:(dir===2?i:k));
          var old = g[r][c] ? g[r][c].v : 0;
          if (old !== nv) ch = true;
          if (nv >= 2048) hit2048 = true;
          g[r][c] = nv ? {v:nv, s: nv>old?1.24:1} : null;
        }
      }
      if (!ch) return;
      sc += add; spawn(); sfx(add?540:320, 0.07); if(add) vib(10);
      hudSt.textContent = "Điểm: " + sc;
      if (hit2048 && !won2048) {
        won2048 = true; sfx(760, 0.2, "triangle");
        showResultModal({
          win: true, title: "Chạm mốc Sen Vàng 2048! 🌸", desc: "Điểm: " + sc + ". Tiếp tục ghép hoa vô tận nhé!",
          nextLabel: "▶ Chơi tiếp (Vô tận)", onNext: function(){}, onRetry: reset
        });
      } else if (!canMove2048()) {
        over = true; sfx(210, 0.22, "sawtooth");
        hudSt.textContent = "Hết nước đi! Điểm: " + sc;
        showResultModal({ win: false, title: "Hết nước đi!", desc: "Tổng điểm: " + sc, onRetry: reset });
      }
    }

    var sx=0, sy=0;
    cv.c.addEventListener("pointerdown", function(e){ sx=e.clientX; sy=e.clientY; });
    cv.c.addEventListener("pointerup", function(e){
      var dx=e.clientX-sx, dy=e.clientY-sy;
      if (Math.max(Math.abs(dx),Math.abs(dy)) < 22) return;
      if (Math.abs(dx)>Math.abs(dy)) move(dx>0?1:3); else move(dy>0?2:0);
    });
    activeKeyFn = function(e) {
      var k = e.key;
      if (k==="ArrowUp"||k==="w"||k==="W") { e.preventDefault(); move(0); }
      else if (k==="ArrowRight"||k==="d"||k==="D") { e.preventDefault(); move(1); }
      else if (k==="ArrowDown"||k==="s"||k==="S") { e.preventDefault(); move(2); }
      else if (k==="ArrowLeft"||k==="a"||k==="A") { e.preventDefault(); move(3); }
    };
    document.addEventListener("keydown", activeKeyFn);

    function loop(now) {
      var dt = Math.min(0.05, Math.max(0, ((now || performance.now()) - lastT) / 1000)); lastT = now || performance.now();
      clock += dt;
      ctx.clearRect(0, 0, W, W);
      var bg = ctx.createLinearGradient(0, 0, W, W); bg.addColorStop(0, "#0b1e1b"); bg.addColorStop(1, "#132924");
      ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(0, 0, W, W, 18); ctx.fill();
      for (var r=0;r<4;r++) for (var c=0;c<4;c++) {
        var x=pad+c*cell+4, y=pad+r*cell+4, sz=cell-8;
        ctx.fillStyle = "rgba(255,255,255,.06)"; ctx.beginPath(); ctx.roundRect(x, y, sz, sz, 12); ctx.fill();
        var t = g[r][c];
        if (t) {
          t.s += (1 - t.s) * Math.min(1, dt * 14);
          var st = MAP[t.v] || MAP[2048];
          ctx.save(); ctx.translate(x+sz/2, y+sz/2); ctx.scale(t.s, t.s);
          ctx.fillStyle = st.bg; ctx.beginPath(); ctx.roundRect(-sz/2, -sz/2, sz, sz, 12); ctx.fill();
          ctx.strokeStyle = st.bd; ctx.lineWidth = 2; ctx.stroke();
          ctx.globalAlpha = 0.85;
          drawFlowerOn(ctx, st.sp, 0, -sz*0.14, sz*0.52, Math.sin(clock*1.5 + r + c)*0.08, 1);
          ctx.globalAlpha = 1;
          ctx.fillStyle = "#ffffff";
          ctx.font = "900 " + (t.v>=1024 ? 17 : 21) + "px sans-serif";
          ctx.textAlign = "center"; ctx.textBaseline = "middle";
          ctx.shadowColor = "rgba(0,0,0,0.7)"; ctx.shadowBlur = 4;
          ctx.fillText(String(t.v), 0, sz*0.26);
          ctx.restore();
        }
      }
      activeRaf = requestAnimationFrame(loop);
    }
    hudBt.innerHTML = ""; hudBt.appendChild(mkBtn("🔄 Ván mới", "btn-pill pri", reset));
    reset(); activeRaf = requestAnimationFrame(loop);
  }

  /* ==================== 6. CỜ CARO HOA 3D (3x3 / 11x11 / VÔ HẠN • 60FPS) ==================== */
  function startCaro() {
    var MODES = ["11x11", "3x3", "inf"];
    var modeIdx = 0, vsBot = true, turn = 1, over = false, winLine = null, clock = 0, lastT = performance.now();
    var cv = makeCanvas(1), ctx = cv.ctx, W = cv.w;
    var map = {}, anim = {}, lastKey = null, camX = 0, camY = 0, dragCam = null;

    function curMode() { return MODES[modeIdx]; }
    function gridSize() { return curMode() === "3x3" ? 3 : 11; }
    function winCount() { return curMode() === "3x3" ? 3 : 5; }
    function cellPx() { return curMode() === "3x3" ? (W - 24)/3 : (W - 24)/11; }
    function key(r, c) { return r + "," + c; }

    function reset() {
      map = {}; anim = {}; lastKey = null; turn = 1; over = false; winLine = null;
      camX = 0; camY = 0;
      var label = curMode() === "3x3" ? "3×3" : (curMode() === "11x11" ? "11×11" : "Vô hạn");
      hdrTitle.textContent = "Caro Hoa 3D " + label;
      hudSt.textContent = (vsBot ? "🤖 vs Máy" : "👥 2 Người") + " • Lượt Hồng 🌹";
    }

    function inBounds(r, c) {
      if (curMode() === "inf") return true;
      var n = gridSize(); return r >= 0 && c >= 0 && r < n && c < n;
    }

    function findWinFrom(r, c, p) {
      var need = winCount(), dirs = [[1,0],[0,1],[1,1],[1,-1]];
      for (var d=0;d<4;d++) {
        var dr = dirs[d][0], dc = dirs[d][1], pts = [[r,c]];
        for (var k=1;k<need;k++) { if (map[key(r+dr*k, c+dc*k)]===p) pts.push([r+dr*k, c+dc*k]); else break; }
        for (var k2=1;k2<need;k2++) { if (map[key(r-dr*k2, c-dc*k2)]===p) pts.unshift([r-dr*k2, c-dc*k2]); else break; }
        if (pts.length >= need) return { a: pts[0], b: pts[pts.length - 1] };
      }
      return null;
    }

    function isBoardFull() {
      if (curMode() === "inf") return false;
      var n = gridSize();
      return Object.keys(map).length >= n * n;
    }

    function scoreCell(r, c, p) {
      var need = winCount(), dirs = [[1,0],[0,1],[1,1],[1,-1]], tot = 0;
      for (var d=0;d<4;d++) {
        var dr=dirs[d][0], dc=dirs[d][1], cnt=1, op=0;
        for (var s=-1;s<=1;s+=2) for (var k=1;k<need;k++) {
          var nr=r+dr*k*s, nc=c+dc*k*s;
          if (!inBounds(nr, nc)) break;
          var v = map[key(nr, nc)] || 0;
          if (v===p) cnt++; else { if(v===0) op++; break; }
        }
        if (cnt>=need) tot+=100000;
        else if (cnt===need-1 && op===2) tot+=15000;
        else if (cnt===need-1 && op===1) tot+=3600;
        else if (cnt===need-2 && op===2) tot+=1400;
        else tot += cnt*14 + op*4;
      }
      return tot;
    }

    function botMove() {
      var cands = {};
      if (curMode() === "inf") {
        var keys = Object.keys(map);
        if (!keys.length) cands["0,0"] = [0, 0];
        else keys.forEach(function(k){
          var p = k.split(","); var rr=+p[0], cc=+p[1];
          for (var dr=-2;dr<=2;dr++) for (var dc=-2;dc<=2;dc++) {
            var nk = key(rr+dr, cc+dc);
            if (!map[nk]) cands[nk] = [rr+dr, cc+dc];
          }
        });
      } else {
        var n = gridSize();
        for (var r=0;r<n;r++) for (var c=0;c<n;c++) if (!map[key(r,c)]) cands[key(r,c)] = [r,c];
      }
      var best = null, bv = -1;
      Object.keys(cands).forEach(function(k){
        var pt = cands[k], r = pt[0], c = pt[1];
        var centerBias = curMode()==="3x3" ? ((r===1&&c===1)?5:0) : (10 - Math.abs(r-5) - Math.abs(c-5))*0.2;
        var v = scoreCell(r,c,2)*1.15 + scoreCell(r,c,1) + centerBias;
        if (v > bv) { bv = v; best = pt; }
      });
      if (!best) return;
      place(best[0], best[1], 2, true);
    }

    function place(r, c, p, isBot) {
      var k = key(r, c);
      map[k] = p; anim[k] = 0.15; lastKey = k;
      sfx(isBot ? 340 : 460, 0.06); if (!isBot) vib(8);
      var w = findWinFrom(r, c, p);
      if (w) {
        over = true; winLine = w; sfx(720, 0.18, "triangle");
        var msg = vsBot ? (p===1 ? "Bạn thắng! 🎉" : "Máy (O) thắng!") : ((p===1 ? "X" : "O") + " thắng! 🎉");
        hudSt.textContent = msg;
        setTimeout(function(){
          showResultModal({
            win: !vsBot || p===1,
            title: msg,
            desc: "Chế độ: " + curMode(),
            nextLabel: "▶ Ván mới",
            onNext: reset,
            onRetry: reset
          });
        }, 480);
        return;
      }
      if (isBoardFull()) {
        over = true; hudSt.textContent = "Hòa nhau!";
        setTimeout(function(){
          showResultModal({ win: true, title: "Hòa nhau!", desc: "Bàn cờ đã kín.", nextLabel: "▶ Ván mới", onNext: reset, onRetry: reset });
        }, 350);
        return;
      }
      if (vsBot) {
        if (p === 1) { hudSt.textContent = "Máy đang suy nghĩ..."; setTimeout(botMove, 180); }
        else hudSt.textContent = "🤖 vs Máy • Lượt Hồng 🌹";
      } else {
        turn = turn === 1 ? 2 : 1;
        hudSt.textContent = "👥 2 Người • Lượt " + (turn===1 ? "Hồng 🌹" : "Lưu Ly 💠");
      }
    }

    cv.c.addEventListener("pointerdown", function(e){
      var rect = cv.c.getBoundingClientRect();
      dragCam = { sx:e.clientX, sy:e.clientY, cx:camX, cy:camY, lx:e.clientX-rect.left, ly:e.clientY-rect.top, moved:false };
    });
    cv.c.addEventListener("pointermove", function(e){
      if (!dragCam || curMode() !== "inf") return;
      var dx = e.clientX - dragCam.sx, dy = e.clientY - dragCam.sy;
      if (Math.hypot(dx, dy) > 8) {
        dragCam.moved = true;
        camX = dragCam.cx - dx; camY = dragCam.cy - dy;
      }
    });
    cv.c.addEventListener("pointerup", function(e){
      if (!dragCam) return;
      var wasMoved = dragCam.moved, lx = dragCam.lx, ly = dragCam.ly;
      dragCam = null;
      if (wasMoved || over || (vsBot && turn !== 1)) return;
      var cell = cellPx(), r, c;
      if (curMode() === "inf") {
        c = Math.floor((lx - W/2 + camX) / cell);
        r = Math.floor((ly - W/2 + camY) / cell);
      } else {
        c = Math.floor((lx - 12) / cell);
        r = Math.floor((ly - 12) / cell);
      }
      if (!inBounds(r, c) || map[key(r, c)]) return;
      place(r, c, turn, false);
    });

    function toScreen(r, c) {
      var cell = cellPx();
      if (curMode() === "inf") return { x: W/2 + c*cell - camX, y: W/2 + r*cell - camY, cell: cell };
      return { x: 12 + c*cell, y: 12 + r*cell, cell: cell };
    }

    function loop(now) {
      var dt = Math.min(0.05, Math.max(0, ((now || performance.now()) - lastT) / 1000)); lastT = now || performance.now();
      clock += dt;
      ctx.clearRect(0, 0, W, W);
      var bg = ctx.createLinearGradient(0, 0, W, W);
      bg.addColorStop(0, "#0b1e1b"); bg.addColorStop(1, "#122a24");
      ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(0, 0, W, W, 18); ctx.fill();

      var cell = cellPx();
      ctx.strokeStyle = "rgba(110,231,183,.18)"; ctx.lineWidth = 1;
      if (curMode() === "inf") {
        var cMin = Math.floor((camX - W/2)/cell) - 1, cMax = Math.ceil((camX + W/2)/cell) + 1;
        var rMin = Math.floor((camY - W/2)/cell) - 1, rMax = Math.ceil((camY + W/2)/cell) + 1;
        for (var c=cMin;c<=cMax;c++) {
          var sx = W/2 + c*cell - camX;
          ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, W); ctx.stroke();
        }
        for (var r=rMin;r<=rMax;r++) {
          var sy = W/2 + r*cell - camY;
          ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(W, sy); ctx.stroke();
        }
        var o = toScreen(0, 0);
        ctx.fillStyle = "rgba(255,77,141,.45)";
        ctx.beginPath(); ctx.arc(o.x + cell/2, o.y + cell/2, 3.5, 0, Math.PI*2); ctx.fill();
      } else {
        var n = gridSize();
        for (var i=0;i<=n;i++) {
          var p = 12 + i*cell;
          ctx.beginPath(); ctx.moveTo(12, p); ctx.lineTo(W-12, p); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(p, 12); ctx.lineTo(p, W-12); ctx.stroke();
        }

        });

      Object.keys(map).forEach(function(k){
        var v = map[k], parts = k.split(","), r = +parts[0], c = +parts[1];
        anim[k] = (anim[k] || 1) + (1 - (anim[k] || 1)) * 0.28;
        var sc = toScreen(r, c), cx = sc.x + cell/2, cy = sc.y + cell/2;

        if (k === lastKey) {
          ctx.fillStyle = "rgba(251,191,36,.16)";
          ctx.beginPath(); ctx.roundRect(sc.x+2, sc.y+2, cell-4, cell-4, 6); ctx.fill();
        }
        drawFlowerOn(ctx, v === 1 ? 0 : 4, cx, cy, cell * 0.82, Math.sin(clock*1.5 + r + c)*0.08, anim[k]);
      });

      if (winLine) {

        ctx.save();
        ctx.shadowColor = "#fde047"; ctx.shadowBlur = 14;
        ctx.strokeStyle = "#fde047"; ctx.lineWidth = 4.5; ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(sa.x + cell/2, sa.y + cell/2); ctx.lineTo(sb.x + cell/2, sb.y + cell/2); ctx.stroke();
        ctx.restore();
      }
      activeRaf = requestAnimationFrame(loop);
    }

    hudBt.innerHTML = "";
    var sizeBtn = mkBtn("📐 11×11", "btn-pill", function(){
      modeIdx = (modeIdx + 1) % MODES.length;
      setBtnLabel(sizeBtn, curMode()==="3x3" ? "📐 3×3" : (curMode()==="11x11" ? "📐 11×11" : "♾️ Vô hạn"));
      reset();
    });
    var mb = mkBtn("🤖 vs Máy", "btn-pill vio", function(){
      vsBot = !vsBot; setBtnLabel(mb, vsBot ? "🤖 vs Máy" : "👥 2 Người"); reset();
    });
    var centerBtn = mkBtn("🎯", "btn-ico", function(){ camX = 0; camY = 0; });
    hudBt.appendChild(sizeBtn); hudBt.appendChild(mb); hudBt.appendChild(centerBtn); hudBt.appendChild(mkBtn("🔄", "btn-ico", reset));
    reset(); loop();
  }

  /* ==================== 7. ONET VƯỜN HOA 3D (HOA PHÁT SÁNG • VÔ HẠN MÀN) ==================== */
  function startOnet() {

    var cv = makeCanvas(1.22), ctx = cv.ctx, W = cv.w, H = cv.h, DPR = cv.c.width / W;

      { sp:8, bg:"#1e1b4b", bd:"#818cf8" }, { sp:9, bg:"#701a75", bd:"#e879f9" },
      { sp:0, bg:"#0f172a", bd:"#fda4af", ring:true }, { sp:1, bg:"#14532d", bd:"#fde047", ring:true },
      { sp:2, bg:"#3b0764", bd:"#fbcfe8", ring:true }, { sp:4, bg:"#164e63", bd:"#7dd3fc", ring:true },
      { sp:5, bg:"#064e3b", bd:"#6ee7b7", ring:true }, { sp:6, bg:"#7c2d12", bd:"#fdba74", ring:true },
      { sp:3, bg:"#312e81", bd:"#d8b4fe", ring:true }, { sp:7, bg:"#334155", bd:"#fde68a", ring:true }
    ];
    var SHIFT_NAMES = ["Tĩnh", "Trượt Xuống ↓", "Trượt Lên ↑", "Trượt Trái ←", "Trượt Phải →", "Dồn Tâm ⇅", "Xoay Trọng Lực ⟳"];
    var level = 1, maxLv = 1;
    try {
      level = Math.max(1, parseInt(localStorage.getItem("off_onet_level") || "1", 10) || 1);
      maxLv = Math.max(level, parseInt(localStorage.getItem("off_onet_max") || String(level), 10) || level);
    } catch (e) {}
    var cols = 6, rows = 6, grid = [], tileSc = [], sel = null, hintPair = null, pathFx = [], particles = [];
    var score = 0, ended = false, lastT = performance.now(), oClock = 0;
    var timeLeft = 90, timeMax = 90, hintsLeft = 3, shufflesLeft = 3, matchCount = 0;

    function saveLv() {
      maxLv = Math.max(maxLv, level);
      try {
        localStorage.setItem("off_onet_level", String(level));
        localStorage.setItem("off_onet_max", String(maxLv));
      } catch (e) {}
    }
    function shiftMode() {

      var q = [];

        var cur = q.shift();

    function applyGravity() {
      var mode = shiftMode();

        for (c=0;c<cols;c++) {
          col = []; for (r=rows-1;r>=0;r--) if (grid[r][c]>=0) col.push(grid[r][c]);
          for (r=rows-1;r>=0;r--) grid[r][c] = col.length ? col.shift() : -1;
        }
      } else if (mode === 2) { // Up
        for (c=0;c<cols;c++) {
          col = []; for (r=0;r<rows;r++) if (grid[r][c]>=0) col.push(grid[r][c]);
          for (r=0;r<rows;r++) grid[r][c] = col.length ? col.shift() : -1;
        }
      } else if (mode === 3) { // Left
        for (r=0;r<rows;r++) {
          row = []; for (c=0;c<cols;c++) if (grid[r][c]>=0) row.push(grid[r][c]);
          for (c=0;c<cols;c++) grid[r][c] = row.length ? row.shift() : -1;
        }
      } else if (mode === 4) { // Right
        for (r=0;r<rows;r++) {
          row = []; for (c=cols-1;c>=0;c--) if (grid[r][c]>=0) row.push(grid[r][c]);
          for (c=cols-1;c>=0;c--) grid[r][c] = row.length ? row.shift() : -1;
        }
      } else if (mode === 5) { // Center pull vertically
        var mid = rows >> 1;

          for (r=mid-1;r>=0;r--) if (grid[r][c]>=0) top.push(grid[r][c]);
          for (r=mid;r<rows;r++) if (grid[r][c]>=0) bot.push(grid[r][c]);
          for (r=mid-1;r>=0;r--) grid[r][c] = top.length ? top.shift() : -1;

    function findAnyPair() {

    }
    function updHud() {

    function init() {

      hintsLeft = 3; shufflesLeft = 3; matchCount = 0;
      var total = rows * cols, pool = [];
      for (var i=0;i<total/2;i++) { var v = i % d.k; pool.push(v, v); }
      for (var j=pool.length-1;j>0;j--) { var k=(Math.random()*(j+1))|0, t=pool[j]; pool[j]=pool[k]; pool[k]=t; }
      grid = []; tileSc = []; var p = 0;
      for (var r=0;r<rows;r++) { var row = [], sr = []; for (var c=0;c<cols;c++) { row.push(pool[p++]); sr.push(0.15 - (r+c)*0.025); } grid.push(row); tileSc.push(sr); }

    cv.c.addEventListener("pointerdown", function(e){
      if (ended || isGamePaused) return;
      var rect = cv.c.getBoundingClientRect(), x = (e.clientX - rect.left)*(W/rect.width), y = (e.clientY - rect.top)*(H/rect.height);
      var b = cellBox(), c = Math.floor((x - b.ox) / b.sz), r = Math.floor((y - b.oy) / b.sz);

              nextLabel: "⏭ Màn " + level, onNext: init,

            });

    });

        var ic = ICONS[i], c = document.createElement("canvas");

        b.fillStyle = ic.bg; b.beginPath(); b.roundRect(x, y, s, s, rad); b.fill();
        b.fillStyle = "rgba(255,255,255,.14)"; b.beginPath(); b.roundRect(x + 2, y + 2, s - 4, s*0.42, [rad-2, rad-2, 4, 4]); b.fill();
        b.strokeStyle = ic.bd; b.lineWidth = 1.5; b.beginPath(); b.roundRect(x, y, s, s, rad); b.stroke();

    function loop(now) {
      var dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000)); lastT = now;
      if (!isGamePaused && !ended) {
        oClock += dt;
        timeLeft = Math.max(0, timeLeft - dt);
        if (timeLeft <= 0) {
          ended = true; sfx(180, 0.28, "sawtooth");
          showResultModal({
            win: false, title: "Hết thời gian!", desc: "Màn " + level + " • Điểm đạt được: " + score,
            retryLabel: "🔄 Chơi lại màn " + level, onRetry: init
          });
        }
      }
      ctx.clearRect(0, 0, W, H);
      var bg = ctx.createLinearGradient(0, 0, W, H);

        var pt = particles[k]; pt.x += pt.vx*dt*60; pt.y += pt.vy*dt*60; pt.life -= dt*2.4;
        if (pt.life <= 0) { particles.splice(k,1); continue; }

    }

    init(); activeRaf = requestAnimationFrame(loop);
  }

  /* ==================== 8. LỐI THOÁT VƯỜN HOA (RUSH HOUR 3D • VÔ HẠN MÀN) ==================== */
  function startRush() {

    var cv = makeCanvas(1.02), ctx = cv.ctx, W = cv.w, H = cv.h;
    var level = 1;
    try { level = Math.max(1, parseInt(localStorage.getItem("off_rush_level") || "1", 10) || 1); } catch (e) {}
    var N = 6, cars = [], moves = 0, drag = null, ended = false, winSlide = 0, lastT = performance.now();

    function saveLv() { try { localStorage.setItem("off_rush_level", String(level)); } catch (e) {} }

    var CAR_STYLES = [
      { body:"#ef4444", roof:"#fca5a5", cab:"#b91c1c", kind:"target" }, // 0: Target Red Car
      { body:"#2563eb", roof:"#93c5fd", cab:"#1e40af", kind:"sedan" },
      { body:"#f59e0b", roof:"#fde68a", cab:"#b45309", kind:"sedan" },
      { body:"#22c55e", roof:"#bbf7d0", cab:"#15803d", kind:"truck" },
      { body:"#f8fafc", roof:"#cbd5e1", cab:"#0f172a", kind:"police" },
      { body:"#e11d48", roof:"#fda4af", cab:"#9f1239", kind:"sedan" },
      { body:"#0ea5e9", roof:"#bae6fd", cab:"#0369a1", kind:"truck" },
      { body:"#a855f7", roof:"#e9d5ff", cab:"#6b21a8", kind:"sedan" },
      { body:"#f97316", roof:"#fed7aa", cab:"#c2410c", kind:"truck" }
    ];

    // BFS solver to guarantee every generated puzzle is solvable and nontrivial
    function solveMinMoves(list) {
      var target = list[0];
      function encode(pos) { return pos.join(","); }
      var initPos = list.map(function(c){ return c.dir === "h" ? c.c : c.r; });
      var q = [{ pos: initPos, d: 0 }], seen = {};
      seen[encode(initPos)] = 1;
      var nodes = 0;
      while (q.length && ++nodes < 6000) {
        var cur = q.shift(), pos = cur.pos;
        if (pos[0] === 4) return cur.d + 1;
        var g = [0,0,0,0,0,0].map(function(){ return [-1,-1,-1,-1,-1,-1]; });
        for (var i=0;i<list.length;i++) {
          var ci = list[i], rr = ci.dir==="h" ? ci.r : pos[i], cc = ci.dir==="h" ? pos[i] : ci.c;
          for (var k=0;k<ci.len;k++) g[ci.dir==="h"?rr:rr+k][ci.dir==="h"?cc+k:cc] = i;
        }

            if (g[r1][c1] !== -1) break;

    function genPuzzle(lv) {

      var minD = Math.min(14, 4 + Math.floor(lv * 0.8));

        var g = Array.from({length:N}, function(){ return new Array(N).fill(-1); });
        var c0x = (Math.random()*2)|0; var list = [{ id:0, r:2, c:c0x, dc:c0x, dr:2, len:2, dir:"h", st:0 }];
        g[2][list[0].c] = 0; g[2][list[0].c+1] = 0;

          var c = dir==="v" ? ((Math.random()*N)|0) : ((Math.random()*(N-len+1))|0);
          if (dir==="h" && r===2) continue; // don't block row 2 with horizontal cars

          for (var k=0;k<len;k++) if (g[dir==="h"?r:r+k][dir==="h"?c+k:c] !== -1) { ok = false; break; }
          if (!ok) continue;

          list.push({ id:id, r:r, c:c, dc:c, dr:r, len:len, dir:dir, st: 1 + ((id-1) % (CAR_STYLES.length-1)) });
        }

        {id:3,r:1,c:3,dc:3,dr:1,len:2,dir:"v",st:2},{id:4,r:3,c:0,dc:0,dr:3,len:3,dir:"h",st:6},{id:5,r:3,c:3,dc:3,dr:3,len:2,dir:"h",st:4},
        {id:6,r:4,c:2,dc:2,dr:4,len:2,dir:"v",st:5},{id:7,r:1,c:5,dc:5,dr:1,len:3,dir:"v",st:8}

    }

    function boardMetrics() {
      var border = 26, inner = W - border*2, cell = inner / N;

    }

    function boundsFor(idx) {
      var g = Array.from({length:N}, function(){ return new Array(N).fill(-1); });
      for (var i=0;i<cars.length;i++) {
        if (i === idx) continue;
        var cr = cars[i];

      }
      var c0 = cars[idx], p = c0.dir==="h" ? c0.c : c0.r, mn = p, mx = p;
      while (mn > 0 && g[c0.dir==="h"?c0.r:mn-1][c0.dir==="h"?mn-1:c0.c] === -1) mn--;
      while (mx + c0.len < N && g[c0.dir==="h"?c0.r:mx+c0.len][c0.dir==="h"?mx+c0.len:c0.c] === -1) mx++;
      if (idx === 0 && mx + c0.len === N) mx = N; // can slide out exit gate!
      return { min: mn, max: mx };
    }

    function init() {
      hideResultModal();
      cars = genPuzzle(level);
      moves = 0; drag = null; ended = false; winSlide = 0;
      hudSt.textContent = "Màn " + level + " (Vô tận) • Lượt: 0";
    }

    cv.c.addEventListener("pointerdown", function(e){
      if (ended) return;
      var rect = cv.c.getBoundingClientRect(), x = (e.clientX - rect.left)*(W/rect.width), y = (e.clientY - rect.top)*(H/rect.height);
      var m = boardMetrics(), col = Math.floor((x - m.border)/m.cell), row = Math.floor((y - m.border)/m.cell);
      for (var i=0;i<cars.length;i++) {
        var cr = cars[i];
        var hit = cr.dir==="h" ? (row===cr.r && col>=cr.c && col<cr.c+cr.len) : (col===cr.c && row>=cr.r && row<cr.r+cr.len);
        if (hit) {
          drag = { idx: i, sx: x, sy: y, base: cr.dir==="h"?cr.c:cr.r, cur: cr.dir==="h"?cr.c:cr.r, bnd: boundsFor(i) };

    });
    cv.c.addEventListener("pointermove", function(e){

      var rect = cv.c.getBoundingClientRect(), x = (e.clientX - rect.left)*(W/rect.width), y = (e.clientY - rect.top)*(H/rect.height);
      var m = boardMetrics(), cr = cars[drag.idx];
      var delta = (cr.dir==="h" ? (x - drag.sx) : (y - drag.sy)) / m.cell;
      drag.cur = Math.max(drag.bnd.min, Math.min(drag.bnd.max, drag.base + delta));
    });
    function endDrag() {
      if (!drag || ended) return;

      snapped = Math.max(drag.bnd.min, Math.min(drag.bnd.max, snapped));
      if (snapped !== drag.base) { moves++; sfx(480, 0.05); vib(8); }
      if (cr.dir === "h") cr.c = snapped; else cr.r = snapped;
      var isWin = drag.idx === 0 && cr.c >= N - 2;
      drag = null;
      hudSt.textContent = "Màn " + level + " (Vô tận) • Lượt: " + moves;
      if (isWin) {
        ended = true; winSlide = 1; sfx(820, 0.22, "triangle"); vib(25);

          showResultModal({
            win: true, title: "Thoát kẹt xe màn " + done + "!", desc: "Hoàn thành sau " + moves + " lượt.",

    function drawVehicle(cr, x, y, w, h) {
      var st = CAR_STYLES[cr.st];
      ctx.save();

      var pad = 3.5, bx = x+pad, by = y+pad, bw = w-pad*2, bh = h-pad*2;
      var cg = ctx.createLinearGradient(bx, by, bx+bw, by+bh);
      cg.addColorStop(0, st.roof); cg.addColorStop(0.5, st.body); cg.addColorStop(1, st.cab);
      ctx.fillStyle = cg; ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 10); ctx.fill();
      ctx.strokeStyle = cr.id === 0 ? "#fde047" : "rgba(255,255,255,0.65)";
      ctx.lineWidth = cr.id === 0 ? 2.2 : 1.4; ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,.24)";
      ctx.beginPath(); ctx.roundRect(bx+3, by+3, bw-6, Math.min(bh*0.38, 16), 6); ctx.fill();

      // 3D Glowing Flower Emblem(s) on carriage
      var spIdx = cr.id === 0 ? 0 : (1 + (cr.st % 8));
      var flSz = Math.min(bw, bh) * 0.72;
      if (cr.dir === "h") {
        drawFlowerOn(ctx, spIdx, bx + bw*0.35, by + bh*0.5, flSz, 0, 1);
        if (cr.id === 0) {
          ctx.fillStyle = "#fff"; ctx.font = "900 14px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
          ctx.fillText("➜", bx + bw*0.76, by + bh*0.5 + 0.5);

        }

        drawFlowerOn(ctx, spIdx, bx + bw*0.5, by + bh*0.36, flSz, 0, 1);
        if (cr.len >= 3) drawFlowerOn(ctx, spIdx, bx + bw*0.5, by + bh*0.72, flSz*0.85, 0.3, 1);
      }
      ctx.restore();
    }

    function loop(now) {
      var dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000)); lastT = now;
      ctx.clearRect(0, 0, W, H);
      var m = boardMetrics();

      // Lush 3D Enchanted Hedge Frame + Blossoming Garden Border
      var fg = ctx.createLinearGradient(0, 0, 0, H); fg.addColorStop(0, "#15803d"); fg.addColorStop(1, "#064e3b");
      ctx.fillStyle = fg; ctx.beginPath(); ctx.roundRect(0, 0, W, H, 22); ctx.fill();
      for (var fi=0; fi<6; fi++) {
        drawFlowerOn(ctx, fi%6, 16 + fi*((W-32)/5), 13, 16, fi*0.4, 1);
        drawFlowerOn(ctx, (fi+2)%6, 16 + fi*((W-32)/5), H - 13, 16, fi*0.4, 1);
      }

      // Mossy stone courtyard + glowing garden gate on row 2 right!
      ctx.fillStyle = "#0b1f1c"; ctx.beginPath(); ctx.roundRect(m.border-4, m.border-4, m.inner+8, m.inner+8, 14); ctx.fill();
      ctx.fillStyle = "#164e3f"; ctx.fillRect(m.border + m.inner, m.border + 2*m.cell, m.border + 4, m.cell);
      for (var r=0;r<N;r++) for (var c=0;c<N;c++) {
        ctx.fillStyle = "rgba(255,255,255,.07)";
        ctx.beginPath(); ctx.roundRect(m.border + c*m.cell + 3, m.border + r*m.cell + 3, m.cell - 6, m.cell - 6, 8); ctx.fill();
      }
      for (var i=0;i<cars.length;i++) {
        var cr = cars[i];
        var tc = (drag && drag.idx===i && cr.dir==="h") ? drag.cur : cr.c;
        var tr = (drag && drag.idx===i && cr.dir==="v") ? drag.cur : cr.r;
        if (cr.dc == null) { cr.dc = cr.c; cr.dr = cr.r; }
        cr.dc += (tc - cr.dc) * Math.min(1, dt*18); cr.dr += (tr - cr.dr) * Math.min(1, dt*18);
        var cc = cr.dc, rr = cr.dr;
        if (i === 0 && ended) { winSlide += dt*5; cc += winSlide; }
        var x = m.border + cc*m.cell, y = m.border + rr*m.cell;
        var w = (cr.dir==="h" ? cr.len : 1)*m.cell, h = (cr.dir==="v" ? cr.len : 1)*m.cell;
        drawVehicle(cr, x, y, w, h);
      }
      activeRaf = requestAnimationFrame(loop);
    }

    hudBt.innerHTML = ""; hudBt.appendChild(mkBtn("🔄 Chơi lại", "btn-pill pri", init));
    init(); activeRaf = requestAnimationFrame(loop);
  }
  /* ==================== 9. FLOWER MERGE THẢ HOA (SUIKA VẬT LÝ 60FPS) ==================== */
  function startFlowerMerge() {
    hdrTitle.textContent = "Flower Merge • Thả Hoa 3D";
    var cv = makeCanvas(1.28), ctx = cv.ctx, W = cv.w, H = cv.h, DPR = cv.c.width / W;
    var sc = W / 360;
    var TIERS = [
      { name:"Lưu Ly Nhỏ",  sp:4, r:12, pts:2,    bg:"#0284c7", rim:"#bae6fd" },
      { name:"Anh Đào",     sp:2, r:16, pts:4,    bg:"#db2777", rim:"#fbcfe8" },
      { name:"Bách Hợp",    sp:6, r:21, pts:8,    bg:"#ea580c", rim:"#fed7aa" },
      { name:"Cẩm Tú",      sp:8, r:26, pts:16,   bg:"#4f46e5", rim:"#c7d2fe" },
      { name:"Sen Ngọc",    sp:5, r:32, pts:32,   bg:"#059669", rim:"#a7f3d0" },
      { name:"Phong Lan",   sp:3, r:38, pts:64,   bg:"#9333ea", rim:"#e9d5ff" },
      { name:"Hướng Dương", sp:1, r:45, pts:128,  bg:"#d97706", rim:"#fde68a" },
      { name:"Hồng Nhung",  sp:0, r:53, pts:256,  bg:"#e11d48", rim:"#fecdd3" },
      { name:"Bạch Trà",    sp:7, r:62, pts:512,  bg:"#64748b", rim:"#f8fafc" },
      { name:"Sen Hoàng Gia",sp:9,r:72, pts:1024, bg:"#b45309", rim:"#fef08a" }
    ];
    var box = { x: 14*sc, y: 86*sc, w: W - 28*sc, h: H - 100*sc };
    var dangerY = box.y + 42*sc;
    var best = 0;
    try { best = Math.max(0, parseInt(localStorage.getItem("off_merge_best") || "0", 10) || 0); } catch (e) {}

    var orbSp = [];
    function ensureOrbs() {
      if (orbSp.length) return;
      for (var i = 0; i < TIERS.length; i++) {
        var t = TIERS[i], r = t.r * sc, pad = 6, sz = (r + pad) * 2;
        var c = document.createElement("canvas");
        c.width = Math.ceil(sz * DPR); c.height = Math.ceil(sz * DPR);
        var b = c.getContext("2d"); b.setTransform(DPR, 0, 0, DPR, 0, 0);
        var cx = sz * 0.5, cy = sz * 0.5;
        b.save();
        b.shadowColor = t.rim; b.shadowBlur = Math.max(5, r * 0.25);
        var bg = b.createRadialGradient(cx - r*0.32, cy - r*0.32, r*0.08, cx, cy, r);
        bg.addColorStop(0, "rgba(255,255,255,0.85)");
        bg.addColorStop(0.45, t.rim + "bb");
        bg.addColorStop(0.85, t.bg + "dd");
        bg.addColorStop(1, "#0f172a");
        b.fillStyle = bg; b.beginPath(); b.arc(cx, cy, r, 0, Math.PI*2); b.fill();
        b.restore();
        drawFlowerOn(b, t.sp, cx, cy, r * 1.65, 0, 1);
        var gloss = b.createRadialGradient(cx - r*0.35, cy - r*0.35, r*0.05, cx - r*0.2, cy - r*0.2, r*0.75);
        gloss.addColorStop(0, "rgba(255,255,255,0.58)");
        gloss.addColorStop(0.5, "rgba(255,255,255,0.08)");
        gloss.addColorStop(1, "rgba(255,255,255,0)");
        b.fillStyle = gloss; b.beginPath(); b.arc(cx, cy, r * 0.94, 0, Math.PI*2); b.fill();
        b.strokeStyle = "rgba(255,255,255,0.72)"; b.lineWidth = Math.max(1.2, r * 0.06);
        b.beginPath(); b.arc(cx, cy, r - 0.8, 0, Math.PI*2); b.stroke();
        orbSp.push({ c: c, sz: sz, r: r });
      }
    }

    var balls = [], curTier = 0, nextTier = 1, aimX = W * 0.5, dropCd = 0, score = 0;
    var overTimer = 0, ended = false, particles = [], rings = [], popups = [], lastT = performance.now(), clock = 0;

    function randDropTier() { return (Math.random() * 5) | 0; }
    function saveBest() {
      if (score > best) {
        best = score;
        try { localStorage.setItem("off_merge_best", String(best)); } catch (e) {}
      }
    }
    function updHud() {
      hudSt.textContent = "Điểm: " + score + " • Kỷ lục: " + best;
    }
    function init() {
      hideResultModal();
      ensureOrbs();
      balls = []; particles = []; rings = []; popups = [];
      score = 0; dropCd = 0; overTimer = 0; ended = false;
      curTier = randDropTier(); nextTier = randDropTier();
      aimX = box.x + box.w * 0.5;
      updHud();
    }
    function clampAim(x) {
      var r = TIERS[curTier].r * sc;
      return Math.max(box.x + r + 3, Math.min(box.x + box.w - r - 3, x));
    }
    function spawnMergeFx(x, y, col, r, txt) {
      rings.push({ x: x, y: y, r: r * 0.5, maxR: r * 2.1, col: col, life: 1 });
      for (var i = 0; i < 14; i++) {
        var a = (i / 14) * Math.PI * 2 + Math.random() * 0.3, sp = (1.8 + Math.random() * 3.5) * sc;
        particles.push({ x: x, y: y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, col: col, r: (2.8 + Math.random()*2.5)*sc, life: 1 });
      }
      if (txt) popups.push({ x: x, y: y - 8*sc, txt: txt, col: col, life: 1 });
    }
    function dropCurrent() {
      if (ended || isGamePaused || dropCd > 0) return;
      var r = TIERS[curTier].r * sc;
      var x = clampAim(aimX);
      balls.push({
        tier: curTier, r: r, x: x, y: box.y + Math.max(16*sc, r * 0.6),
        vx: (Math.random() - 0.5) * 14 * sc, vy: 40 * sc,
        rot: 0, sc: 0.72, age: 0, merged: false
      });
      sfx(440 - curTier * 24, 0.08, "sine"); vib(6);
      curTier = nextTier;
      nextTier = randDropTier();
      aimX = clampAim(aimX);
      dropCd = 0.42;
    }

    var dragging = false;
    function ptrPos(e) {
      var rect = cv.c.getBoundingClientRect();
      return (e.clientX - rect.left) * (W / rect.width);
    }
    cv.c.addEventListener("pointerdown", function(e){
      if (ended || isGamePaused) return;
      dragging = true;
      aimX = clampAim(ptrPos(e));
    });
    cv.c.addEventListener("pointermove", function(e){
      if (ended || isGamePaused) return;
      if (dragging || e.pointerType === "mouse") aimX = clampAim(ptrPos(e));
    });
    window.addEventListener("pointerup", function(){
      if (!dragging) return;
      dragging = false;
      dropCurrent();
    });
    activeKeyFn = function(e) {
      if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") { e.preventDefault(); aimX = clampAim(aimX - 18*sc); }
      else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") { e.preventDefault(); aimX = clampAim(aimX + 18*sc); }
      else if (e.key === " " || e.key === "ArrowDown" || e.key === "Enter") { e.preventDefault(); dropCurrent(); }
    };
    document.addEventListener("keydown", activeKeyFn);

    function stepPhysics(dt) {
      if (dropCd > 0) dropCd = Math.max(0, dropCd - dt);
      var sub = 3, sdt = dt / sub, grav = 1120 * sc, rest = 0.22;
      for (var s = 0; s < sub; s++) {
        for (var i = 0; i < balls.length; i++) {
          var b = balls[i];
          if (b.merged) continue;
          b.age += sdt;
          b.sc = Math.min(1, b.sc + (1 - b.sc) * Math.min(1, sdt * 14));
          b.vy += grav * sdt;
          b.vx *= Math.pow(0.96, sdt * 60);
          b.x += b.vx * sdt;
          b.y += b.vy * sdt;
          b.rot += (b.vx / Math.max(8, b.r)) * sdt;

          if (b.x - b.r < box.x) { b.x = box.x + b.r; b.vx = Math.abs(b.vx) * rest; }
          if (b.x + b.r > box.x + box.w) { b.x = box.x + box.w - b.r; b.vx = -Math.abs(b.vx) * rest; }
          if (b.y + b.r > box.y + box.h) { b.y = box.y + box.h - b.r; if (b.vy > 0) b.vy = -b.vy * rest; b.vx *= 0.96; }
        }

        for (var it = 0; it < 3; it++) {
          for (var aIdx = 0; aIdx < balls.length; aIdx++) {
            var a = balls[aIdx];
            if (a.merged) continue;
            for (var bIdx = aIdx + 1; bIdx < balls.length; bIdx++) {
              var b2 = balls[bIdx];
              if (b2.merged) continue;
              var dx = b2.x - a.x, dy = b2.y - a.y;
              var minD = a.r + b2.r, distSq = dx * dx + dy * dy;
              if (distSq >= minD * minD) continue;

              if (a.tier === b2.tier) {
                a.merged = true; b2.merged = true;
                var mx = (a.x + b2.x) * 0.5, my = (a.y + b2.y) * 0.5;
                if (a.tier < TIERS.length - 1) {
                  var nt = a.tier + 1, nr = TIERS[nt].r * sc;
                  balls.push({
                    tier: nt, r: nr,
                    x: Math.max(box.x + nr, Math.min(box.x + box.w - nr, mx)),
                    y: Math.min(box.y + box.h - nr, my),
                    vx: (a.vx + b2.vx) * 0.35, vy: Math.min(-60*sc, (a.vy + b2.vy) * 0.3),
                    rot: 0, sc: 1.34, age: 0.4, merged: false
                  });
                  var addP = TIERS[nt].pts;
                  score += addP;
                  sfx(340 * Math.pow(1.12, nt), 0.14, "triangle"); vib(12);
                  spawnMergeFx(mx, my, TIERS[nt].rim, nr, "+" + addP);
                } else {

                  spawnMergeFx(mx, my, "#fde047", a.r * 1.4, "+2048 🌸");
                }
                saveBest(); updHud();
                continue;
              }

              var d = Math.sqrt(distSq) || 0.001;
              var nx = dx / d, ny = dy / d, ov = minD - d;
              var m1 = a.r * a.r, m2 = b2.r * b2.r, invSum = 1 / (m1 + m2);

                b2.vx += (j / m2) * nx; b2.vy += (j / m2) * ny;
              }
            }
          }
        }
      }
      balls = balls.filter(function(b){ return !b.merged; });

      var overflow = false;
      for (var k = 0; k < balls.length; k++) {
        if (balls[k].age > 1.25 && balls[k].y - balls[k].r < dangerY) { overflow = true; break; }
      }
      if (overflow) {
        overTimer += dt;
        if (overTimer >= 2.2 && !ended) {
          ended = true; saveBest(); sfx(170, 0.3, "sawtooth"); vib(30);
          showResultModal({
            win: false, title: "Bình hoa đã tràn!", desc: "Điểm: " + score + " • Kỷ lục: " + best,
            retryLabel: "🔄 Thả lại ngay", onRetry: init
          });
        }
      } else {
        overTimer = Math.max(0, overTimer - dt * 1.6);
      }
    }

    function loop(now) {
      var dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000)); lastT = now;
      if (!isGamePaused && !ended) {
        clock += dt;
        stepPhysics(dt);
      }
      ctx.clearRect(0, 0, W, H);
      var bg = ctx.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, "#14352d"); bg.addColorStop(0.55, "#0d2420"); bg.addColorStop(1, "#081718");
      ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(0, 0, W, H, 18); ctx.fill();

      ctx.fillStyle = "rgba(255,255,255,0.08)";
      ctx.beginPath(); ctx.roundRect(10*sc, 8*sc, W - 20*sc, 44*sc, 12*sc); ctx.fill();
      for (var ei = 0; ei < TIERS.length; ei++) {

        }
      }
      ctx.fillStyle = "#e2e8f0"; ctx.font = "800 " + (10*sc) + "px sans-serif"; ctx.textAlign = "right";
      ctx.fillText("Tiếp:", W - 46*sc, 28*sc);

      ctx.save();
      ctx.fillStyle = "rgba(255,255,255,0.05)";
      ctx.beginPath(); ctx.roundRect(box.x, box.y, box.w, box.h, [4, 4, 20*sc, 20*sc]); ctx.fill();
      ctx.strokeStyle = "rgba(167,243,208,0.45)"; ctx.lineWidth = 2.5*sc; ctx.stroke();

      // Danger line (pulses bright coral when warning active)
      ctx.save();
      ctx.setLineDash([7*sc, 6*sc]);
      ctx.strokeStyle = overTimer > 0.2 ? ("rgba(251,113,133," + (0.55 + 0.45*Math.sin(clock*14)) + ")") : "rgba(255,255,255,0.22)";
      ctx.lineWidth = overTimer > 0.2 ? 2.5*sc : 1.5*sc;
      ctx.beginPath(); ctx.moveTo(box.x + 6*sc, dangerY); ctx.lineTo(box.x + box.w - 6*sc, dangerY); ctx.stroke();
      ctx.restore();

      // Aim drop guide & floating preview orb
      if (!ended && dropCd <= 0.1) {
        var gx = clampAim(aimX), gy = box.y - 4*sc;
        ctx.save();
        ctx.strokeStyle = "rgba(255,255,255,0.20)"; ctx.setLineDash([4*sc, 5*sc]); ctx.lineWidth = 1.5*sc;
        ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx, box.y + box.h); ctx.stroke();
        ctx.restore();
        var curSp = orbSp[curTier];
        ctx.save(); ctx.globalAlpha = dropCd > 0 ? 0.55 : 0.96;
        ctx.drawImage(curSp.c, gx - curSp.sz*0.5, gy - curSp.sz*0.5, curSp.sz, curSp.sz);
        ctx.restore();
      }

      // Active flower spheres inside glass vase
      ctx.save();
      ctx.beginPath(); ctx.roundRect(box.x, box.y - 24*sc, box.w, box.h + 24*sc, [4, 4, 20*sc, 20*sc]); ctx.clip();
      for (var i = 0; i < balls.length; i++) {
        var b = balls[i], sp = orbSp[b.tier];
        ctx.save();
        ctx.translate(b.x, b.y);
        if (b.rot) ctx.rotate(b.rot);
        if (b.sc !== 1) ctx.scale(b.sc, b.sc);
        ctx.drawImage(sp.c, -sp.sz*0.5, -sp.sz*0.5, sp.sz, sp.sz);
        ctx.restore();
      }
      ctx.restore();

      for (var rIdx = rings.length - 1; rIdx >= 0; rIdx--) {
        var rg = rings[rIdx]; rg.life -= dt * 3.0;
        if (rg.life <= 0) { rings.splice(rIdx, 1); continue; }
        ctx.save(); ctx.globalAlpha = rg.life;
        ctx.strokeStyle = rg.col; ctx.lineWidth = 3*sc*rg.life;
        ctx.beginPath(); ctx.arc(rg.x, rg.y, rg.r + (rg.maxR - rg.r)*(1 - rg.life), 0, Math.PI*2); ctx.stroke();
        ctx.restore();
      }
      for (var pIdx = particles.length - 1; pIdx >= 0; pIdx--) {
        var pt = particles[pIdx]; pt.x += pt.vx*dt*60; pt.y += pt.vy*dt*60; pt.life -= dt*2.3;
        if (pt.life <= 0) { particles.splice(pIdx, 1); continue; }
        ctx.globalAlpha = pt.life; ctx.fillStyle = pt.col;
        ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1;
      }
      for (var tx = popups.length - 1; tx >= 0; tx--) {
        var pp = popups[tx]; pp.y -= 28*sc*dt; pp.life -= dt*1.5;
        if (pp.life <= 0) { popups.splice(tx, 1); continue; }
        ctx.save(); ctx.globalAlpha = Math.min(1, pp.life * 1.4);
        ctx.fillStyle = pp.col; ctx.font = "900 " + (15*sc) + "px sans-serif"; ctx.textAlign = "center";
        ctx.shadowColor = "rgba(0,0,0,0.75)"; ctx.shadowBlur = 4;
        ctx.fillText(pp.txt, pp.x, pp.y); ctx.restore();
      }
      ctx.restore();
      activeRaf = requestAnimationFrame(loop);
    }

    hudBt.innerHTML = "";
    hudBt.appendChild(mkBtn("🔄 Chơi lại", "btn-pill pri", init));
    init(); activeRaf = requestAnimationFrame(loop);
  }

  /* ==================== 10. BLOCK FILL VƯỜN HOA (MỘT NÉT LIÊN HOÀN • VÔ TẬN) ==================== */
  function startBlockFill() {
    hdrTitle.textContent = "Block Fill • Vườn Hoa 3D";
    var cv = makeCanvas(1.06), ctx = cv.ctx, W = cv.w, H = cv.h;
    var level = 1;
    try { level = Math.max(1, parseInt(localStorage.getItem("off_blockfill_level") || "1", 10) || 1); } catch (e) {}
    var N = 5, grid = [], solPath = [], path = [], pathSet = {}, totalWalk = 0;
    var showHint = 0, ended = false, particles = [], lastT = performance.now(), clock = 0;

    function saveLv() { try { localStorage.setItem("off_blockfill_level", String(level)); } catch (e) {} }
    function genPuzzle(lv) {
      N = lv <= 2 ? 5 : (lv <= 5 ? 6 : (lv <= 9 ? 7 : 8));
      var targetPct = lv === 1 ? 0.68 : (lv <= 4 ? 0.78 : 0.84);
      var want = Math.max(12, Math.floor(N * N * targetPct));
      var bestWalk = [];
      for (var attempt = 0; attempt < 28; attempt++) {
        var vis = Array.from({length:N}, function(){ return new Array(N).fill(false); });
        var curWalk = [];
        var sr = (Math.random() * N) | 0, sc = (Math.random() * N) | 0;
        function dfs(r, c) {
          vis[r][c] = true; curWalk.push([r, c]);
          if (curWalk.length > bestWalk.length) bestWalk = curWalk.slice();
          if (bestWalk.length >= want) return true;
          var dirs = [[-1,0],[1,0],[0,-1],[0,1]];
          // Warnsdorff degree heuristic + randomness for clean single-stroke shapes
          var cands = [];
          for (var i = 0; i < 4; i++) {
            var nr = r + dirs[i][0], nc = c + dirs[i][1];
            if (nr >= 0 && nc >= 0 && nr < N && nc < N && !vis[nr][nc]) {
              var deg = 0;
              for (var j = 0; j < 4; j++) {
                var ar = nr + dirs[j][0], ac = nc + dirs[j][1];
                if (ar >= 0 && ac >= 0 && ar < N && ac < N && !vis[ar][ac]) deg++;
              }
              cands.push({ r: nr, c: nc, d: deg + Math.random() * 1.4 });
            }
          }
          cands.sort(function(a, b){ return a.d - b.d; });
          for (var k = 0; k < cands.length; k++) {
            if (dfs(cands[k].r, cands[k].c)) return true;
          }
          vis[r][c] = false; curWalk.pop();
          return false;
        }
        dfs(sr, sc);
        if (bestWalk.length >= want) break;
      }
      grid = Array.from({length:N}, function(){ return new Array(N).fill(1); }); // 1 = hedge rock obstacle
      bestWalk.forEach(function(pt){ grid[pt[0]][pt[1]] = 0; }); // 0 = walkable moss soil
      solPath = bestWalk; totalWalk = bestWalk.length;
    }

    function cellBox() {
      var pad = 16, sz = (W - pad * 2) / N, oy = (H - N * sz) * 0.5;
      return { sz: sz, ox: pad, oy: oy };
    }
    function rebuildSet() {
      pathSet = {};
      for (var i = 0; i < path.length; i++) pathSet[path[i][0] + "," + path[i][1]] = i;
    }
    function updHud() {
      hudSt.textContent = "Màn " + level + " (" + N + "×" + N + ") • Đã trồng: " + path.length + "/" + totalWalk;
    }
    function init() {
      hideResultModal();
      genPuzzle(level);
      path = [[solPath[0][0], solPath[0][1]]];
      rebuildSet(); showHint = 0; ended = false; particles = [];
      updHud();
    }
    function tryStep(nr, nc) {
      if (ended || isGamePaused) return false;
      if (nr < 0 || nc < 0 || nr >= N || nc >= N || grid[nr][nc] === 1) return false;
      var k = nr + "," + nc, tip = path[path.length - 1];
      if (pathSet[k] !== undefined) {
        if (path.length >= 2 && pathSet[k] === path.length - 2) {
          path.pop(); rebuildSet(); sfx(320, 0.04); updHud();
          return true;
        }
        return false;
      }
      if (Math.abs(nr - tip[0]) + Math.abs(nc - tip[1]) !== 1) return false;
      path.push([nr, nc]); rebuildSet();
      var b = cellBox();
      var cx = b.ox + (nc + 0.5)*b.sz, cy = b.oy + (nr + 0.5)*b.sz;
      for (var i = 0; i < 6; i++) {
        var a = Math.random()*Math.PI*2, sp = 1 + Math.random()*2;
        particles.push({ x: cx, y: cy, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, col: "#4ade80", life: 1 });
      }
      sfx(420 + (path.length % 10) * 32, 0.05, "triangle"); vib(5);
      updHud();
      if (path.length === totalWalk) {
        ended = true; sfx(860, 0.24, "triangle"); vib(25);
        var done = level; level++; saveLv();
        setTimeout(function(){
          showResultModal({
            win: true, title: "Nở hoa kín đường màn " + done + "!", desc: "Xuất sắc 100%! Khu vườn " + level + " đã mở.",
            nextLabel: "🌿 Màn " + level, onNext: init,
            retryLabel: "🔄 Chơi lại màn " + done, onRetry: function(){ level = done; saveLv(); init(); }
          });
        }, 360);
      }
      return true;
    }

    var dragging = false;
    function cellFromEvt(e) {
      var rect = cv.c.getBoundingClientRect();
      var x = (e.clientX - rect.left)*(W/rect.width), y = (e.clientY - rect.top)*(H/rect.height);
      var b = cellBox();
      return { r: Math.floor((y - b.oy)/b.sz), c: Math.floor((x - b.ox)/b.sz) };
    }
    cv.c.addEventListener("pointerdown", function(e){
      if (ended || isGamePaused) return;
      dragging = true;
      var hit = cellFromEvt(e), k = hit.r + "," + hit.c;
      if (pathSet[k] !== undefined && pathSet[k] < path.length - 1) {
        path = path.slice(0, pathSet[k] + 1); rebuildSet(); sfx(300, 0.05); updHud();
      } else {
        tryStep(hit.r, hit.c);
      }
    });
    cv.c.addEventListener("pointermove", function(e){
      if (!dragging || ended || isGamePaused) return;
      var hit = cellFromEvt(e);
      tryStep(hit.r, hit.c);
    });
    window.addEventListener("pointerup", function(){ dragging = false; });
    activeKeyFn = function(e) {
      var tip = path[path.length - 1];
      if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") { e.preventDefault(); tryStep(tip[0]-1, tip[1]); }
      else if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") { e.preventDefault(); tryStep(tip[0]+1, tip[1]); }
      else if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") { e.preventDefault(); tryStep(tip[0], tip[1]-1); }
      else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") { e.preventDefault(); tryStep(tip[0], tip[1]+1); }
    };
    document.addEventListener("keydown", activeKeyFn);

    function loop(now) {
      var dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000)); lastT = now;
      if (!isGamePaused) clock += dt;
      if (showHint > 0 && !isGamePaused) showHint = Math.max(0, showHint - dt);

      ctx.clearRect(0, 0, W, H);
      var bg = ctx.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, "#153d32"); bg.addColorStop(1, "#081b1a");
      ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(0, 0, W, H, 18); ctx.fill();

      var b = cellBox(), sz = b.sz;
      for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) {
        var x = b.ox + c * sz + 2.5, y = b.oy + r * sz + 2.5, s = sz - 5;
        if (grid[r][c] === 1) {
          var wg = ctx.createLinearGradient(x, y, x, y + s);
          wg.addColorStop(0, "#334155"); wg.addColorStop(1, "#0f172a");
          ctx.fillStyle = wg; ctx.beginPath(); ctx.roundRect(x, y, s, s, 9); ctx.fill();
          ctx.strokeStyle = "rgba(134,239,172,0.22)"; ctx.lineWidth = 1.2; ctx.stroke();
        } else {
          ctx.fillStyle = "rgba(255,255,255,0.08)";
          ctx.beginPath(); ctx.roundRect(x, y, s, s, 9); ctx.fill();
          ctx.strokeStyle = "rgba(255,255,255,0.14)"; ctx.lineWidth = 1; ctx.stroke();
        }
      }

      // Draw glowing connected vine path
      if (path.length > 0) {
        ctx.save();
        ctx.strokeStyle = "#4ade80"; ctx.shadowColor = "#22c55e"; ctx.shadowBlur = 12;
        ctx.lineWidth = sz * 0.28; ctx.lineCap = "round"; ctx.lineJoin = "round";
        ctx.beginPath();
        path.forEach(function(pt, i){
          var px = b.ox + (pt[1] + 0.5)*sz, py = b.oy + (pt[0] + 0.5)*sz;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        });
        ctx.stroke();
        ctx.restore();

        for (var i = 0; i < path.length; i++) {
          var pr = path[i][0], pc = path[i][1];
          var px = b.ox + pc * sz + 3.5, py = b.oy + pr * sz + 3.5, s2 = sz - 7;
          var fg = ctx.createLinearGradient(px, py, px + s2, py + s2);
          fg.addColorStop(0, i === path.length - 1 ? "#fef08a" : "#34d399");
          fg.addColorStop(1, i === path.length - 1 ? "#f59e0b" : "#059669");
          ctx.fillStyle = fg; ctx.beginPath(); ctx.roundRect(px, py, s2, s2, 9); ctx.fill();
          drawFlowerOn(ctx, (i + level) % 6, px + s2*0.5, py + s2*0.5, s2 * 0.72, i === path.length - 1 ? clock*2 : 0, 1);
        }
      }

      if (showHint > 0) {
        ctx.save(); ctx.globalAlpha = Math.min(1, showHint);
        ctx.strokeStyle = "#fde047"; ctx.lineWidth = 3; ctx.setLineDash([5, 4]); ctx.beginPath();
        solPath.forEach(function(pt, idx){
          var px = b.ox + (pt[1] + 0.5)*sz, py = b.oy + (pt[0] + 0.5)*sz;
          if (!idx) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        });
        ctx.stroke(); ctx.restore();
      }

      for (var k = particles.length - 1; k >= 0; k--) {
        var pt = particles[k]; pt.x += pt.vx*dt*60; pt.y += pt.vy*dt*60; pt.life -= dt*2.4;
        if (pt.life <= 0) { particles.splice(k, 1); continue; }
        ctx.globalAlpha = pt.life; ctx.fillStyle = pt.col; ctx.beginPath(); ctx.arc(pt.x, pt.y, 3, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1;
      }
      activeRaf = requestAnimationFrame(loop);
    }

    hudBt.innerHTML = "";
    hudBt.appendChild(mkBtn("↩ Lùi", "btn-pill", function(){ if (!ended && path.length > 1) { path.pop(); rebuildSet(); sfx(300, 0.05); updHud(); } }));
    hudBt.appendChild(mkBtn("💡 Gợi ý", "btn-pill vio", function(){ if (!ended) { showHint = 3.0; sfx(580, 0.08); } }));
    hudBt.appendChild(mkBtn("🔄", "btn-ico", init));
    init(); activeRaf = requestAnimationFrame(loop);
  }

  /* ==================== 11. TAP MATCH HOA 3D (iOS 3-TILE TRIPLE MATCH) ==================== */
  function startTapMatch() {
    hdrTitle.textContent = "Tap Match • Ghép 3 Hoa";
    var cv = makeCanvas(1.26), ctx = cv.ctx, W = cv.w, H = cv.h, DPR = cv.c.width / W;
    var level = 1;
    try { level = Math.max(1, parseInt(localStorage.getItem("off_tapmatch_level") || "1", 10) || 1); } catch (e) {}

    var tiles = [], tray = [], flying = [], particles = [], history = [];
    var tw = 46, th = 50, dockY = H - 82, dockPad = 14, slotW = (W - dockPad * 2) / 7;
    var hintsLeft = 3, shufflesLeft = 3, undosLeft = 3, score = 0, ended = false, lastT = performance.now(), clock = 0;

    function saveLv() { try { localStorage.setItem("off_tapmatch_level", String(level)); } catch (e) {} }
    function shuffle(a) { for (var i=a.length-1;i>0;i--) { var j=(Math.random()*(i+1))|0, t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

    function buildLevel(lv) {
      tiles = []; tray = []; flying = []; particles = []; history = [];
      hintsLeft = 3; shufflesLeft = 3; undosLeft = 3; ended = false;
      var areaW = W - 36, areaH = dockY - 30;
      tw = Math.min(54, Math.floor(areaW / 6.8));
      th = Math.round(tw * 1.08);

      var layers = lv === 1 ? 3 : (lv <= 3 ? 4 : (lv <= 6 ? 5 : 6));
      var numSpecies = Math.min(10, 4 + Math.floor(lv * 1.2));
      var pos = [];
      for (var z = 0; z < layers; z++) {
        var cols = z % 2 === 0 ? 5 : 4;
        var rows = z % 2 === 0 ? 5 : 4;
        var ox = (W - cols * tw) * 0.5;
        var oy = 16 + (areaH - rows * th) * 0.5 - z * 3;
        for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) {
          if (lv === 1 && z === 2 && (r + c) % 2 === 1) continue;
          if (lv > 1 && ((r === 0 || r === rows - 1) && (c === 0 || c === cols - 1)) && (z % 2 === 0)) continue;
          pos.push({ x: ox + c * tw, y: oy + r * th, z: z });
        }
      }
      // Trim to exact multiple of 3 for 100% triple solvability
      while (pos.length % 3 !== 0) pos.pop();
      var pool = [], triples = pos.length / 3;
      for (var t = 0; t < triples; t++) {
        var sp = t % numSpecies;
        pool.push(sp, sp, sp);
      }
      shuffle(pool);
      for (var i = 0; i < pos.length; i++) {
        tiles.push({ id: i + 1, x: pos[i].x, y: pos[i].y, z: pos[i].z, sp: pool[i], onBoard: true, scale: 1 });
      }
      updHud();
    }

    function isCovered(tile) {
      if (!tile.onBoard) return true;
      for (var i = 0; i < tiles.length; i++) {
        var o = tiles[i];
        if (!o.onBoard || o.z <= tile.z) continue;
        if (Math.abs(o.x - tile.x) < tw * 0.85 && Math.abs(o.y - tile.y) < th * 0.85) return true;
      }
      return false;
    }

    function slotTarget(idx) {
      return { x: dockPad + idx * slotW + (slotW - tw*0.86)*0.5, y: dockY + 11 };
    }

    function insertIntoTray(tile) {
      var insertIdx = tray.length;
      for (var i = tray.length - 1; i >= 0; i--) {
        if (tray[i].sp === tile.sp) { insertIdx = i + 1; break; }
      }
      tray.splice(insertIdx, 0, tile);
      checkTriples();
    }

    function checkTriples() {
      var counts = {};
      tray.forEach(function(t){ counts[t.sp] = (counts[t.sp] || 0) + 1; });
      var matchedSp = -1;
      Object.keys(counts).forEach(function(k){ if (counts[k] >= 3) matchedSp = parseInt(k, 10); });
      if (matchedSp >= 0) {
        var removed = [];
        tray = tray.filter(function(t, idx){
          if (t.sp === matchedSp && removed.length < 3) {
            var p = slotTarget(idx);
            for (var k = 0; k < 8; k++) {
              var a = Math.random()*Math.PI*2, sp = 1.5 + Math.random()*2.8;
              particles.push({ x: p.x + tw*0.43, y: p.y + th*0.43, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, col: "#fde047", life: 1 });
            }
            removed.push(t);
            return false;
          }
          return true;
        });
        history = history.filter(function(h){ return removed.indexOf(h) < 0; });
        score += 30 + level * 5;
        sfx(780, 0.14, "triangle"); vib(14);
        updHud();
      } else if (tray.length >= 7 && flying.length === 0 && !ended) {
        ended = true; sfx(180, 0.28, "sawtooth"); vib(30);
        showResultModal({
          win: false, title: "Khay 7 ô đã đầy!", desc: "Màn " + level + " • Điểm: " + score,
          retryLabel: "🔄 Thử lại màn " + level, onRetry: init
        });
        return;
      }
      var remBoard = tiles.some(function(t){ return t.onBoard; });
      if (!remBoard && tray.length === 0 && flying.length === 0 && !ended) {
        ended = true; sfx(880, 0.24, "triangle"); vib(28);
        var done = level; level++; saveLv();
        setTimeout(function(){
          showResultModal({
            win: true, title: "Thu hoạch hết màn " + done + "!", desc: "Điểm: " + score + " • Màn " + level + " với nhiều tầng hoa hơn!",
            nextLabel: "🎴 Màn " + level, onNext: init,
            retryLabel: "🔄 Chơi lại màn " + done, onRetry: function(){ level = done; saveLv(); init(); }
          });
        }, 380);
      }
    }

    function pickTile(tile) {
      if (ended || isGamePaused || tray.length + flying.length >= 7) return;
      if (isCovered(tile)) { sfx(210, 0.05); return; }
      tile.onBoard = false;
      history.push(tile);
      sfx(520, 0.06); vib(6);
      var dstIdx = tray.length + flying.length;
      for (var i = tray.length - 1; i >= 0; i--) { if (tray[i].sp === tile.sp) { dstIdx = i + 1; break; } }
      var dst = slotTarget(Math.min(6, dstIdx));
      flying.push({ tile: tile, x0: tile.x, y0: tile.y, x1: dst.x, y1: dst.y, t: 0 });
    }

    function updHud() {
      var left = tiles.filter(function(t){ return t.onBoard; }).length;
      hudSt.textContent = "Màn " + level + " • Còn " + left + " thẻ • Điểm: " + score;
      renderBtns();
    }
    function renderBtns() {
      hudBt.innerHTML = "";
      hudBt.appendChild(mkBtn("↩ " + undosLeft, "btn-pill", function(){
        if (ended || undosLeft <= 0 || !history.length || flying.length) { sfx(180, 0.06, "sawtooth"); return; }
        var last = history.pop();
        var idx = tray.indexOf(last);
        if (idx >= 0) { tray.splice(idx, 1); last.onBoard = true; undosLeft--; sfx(380, 0.06); updHud(); }
      }));
      hudBt.appendChild(mkBtn("💡 " + hintsLeft, "btn-pill vio", function(){
        if (ended || hintsLeft <= 0) { sfx(180, 0.06, "sawtooth"); return; }
        var free = tiles.filter(function(t){ return !isCovered(t); });
        if (!free.length) return;
        var target = null;
        if (tray.length) {
          for (var i = 0; i < free.length; i++) {
            if (tray.some(function(tr){ return tr.sp === free[i].sp; })) { target = free[i]; break; }
          }
        }
        target = target || free[0];
        hintsLeft--; pickTile(target); updHud();
      }));
      hudBt.appendChild(mkBtn("🔀 " + shufflesLeft, "btn-pill", function(){
        if (ended || shufflesLeft <= 0) { sfx(180, 0.06, "sawtooth"); return; }
        var rem = tiles.filter(function(t){ return t.onBoard; });
        var vals = rem.map(function(t){ return t.sp; });
        shuffle(vals);
        rem.forEach(function(t, i){ t.sp = vals[i]; });
        shufflesLeft--; sfx(500, 0.08); renderBtns();
      }));
      hudBt.appendChild(mkBtn("🔄", "btn-ico", init));
    }
    function init() { hideResultModal(); buildLevel(level); }

    cv.c.addEventListener("pointerdown", function(e){
      if (ended || isGamePaused) return;
      var rect = cv.c.getBoundingClientRect();
      var x = (e.clientX - rect.left)*(W/rect.width), y = (e.clientY - rect.top)*(H/rect.height);
      var sorted = tiles.filter(function(t){ return t.onBoard; }).sort(function(a, b){ return b.z - a.z || b.id - a.id; });
      for (var i = 0; i < sorted.length; i++) {
        var t = sorted[i];
        if (x >= t.x && x <= t.x + tw && y >= t.y && y <= t.y + th) {
          pickTile(t);
          return;
        }
      }
    });

    function drawTileCard(t, x, y, w, h, covered, glowAlpha) {
      ctx.save();
      ctx.fillStyle = "rgba(0,0,0,0.36)";
      ctx.beginPath(); ctx.roundRect(x + 1, y + 4, w, h, 9); ctx.fill();
      var cg = ctx.createLinearGradient(x, y, x, y + h);
      cg.addColorStop(0, covered ? "#64748b" : "#fffcf5");
      cg.addColorStop(1, covered ? "#475569" : "#e2e8f0");
      ctx.fillStyle = cg;
      ctx.beginPath(); ctx.roundRect(x, y, w, h - 2, 9); ctx.fill();
      ctx.strokeStyle = covered ? "rgba(148,163,184,0.45)" : "#ffffff";
      ctx.lineWidth = 1.6; ctx.stroke();
      if (glowAlpha) {
        ctx.strokeStyle = "rgba(253,224,71," + glowAlpha + ")"; ctx.lineWidth = 2.4; ctx.stroke();
      }
      ctx.globalAlpha = covered ? 0.42 : 1;
      drawFlowerOn(ctx, t.sp, x + w * 0.5, y + (h - 2) * 0.5, Math.min(w, h) * 0.76, 0, 1);
      ctx.restore();
    }

    function loop(now) {
      var dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000)); lastT = now;
      if (!isGamePaused) clock += dt;

      for (var fi = flying.length - 1; fi >= 0; fi--) {
        var fl = flying[fi];
        fl.t = Math.min(1, fl.t + dt * 5.2);
        if (fl.t >= 1) {
          flying.splice(fi, 1);
          insertIntoTray(fl.tile);
        }
      }

      ctx.clearRect(0, 0, W, H);
      var bg = ctx.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, "#1d3b32"); bg.addColorStop(0.55, "#112925"); bg.addColorStop(1, "#0b1a1e");
      ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(0, 0, W, H, 18); ctx.fill();

      var drawOrder = tiles.filter(function(t){ return t.onBoard; }).sort(function(a, b){ return a.z - b.z || a.id - b.id; });
      for (var i = 0; i < drawOrder.length; i++) {
        var t = drawOrder[i];
        drawTileCard(t, t.x, t.y, tw, th, isCovered(t), 0);
      }

      // Bottom 7-Slot Crystal Tray Dock
      ctx.fillStyle = "rgba(15,23,42,0.72)";
      ctx.beginPath(); ctx.roundRect(dockPad - 6, dockY, W - dockPad * 2 + 12, th + 18, 16); ctx.fill();
      ctx.strokeStyle = tray.length >= 6 ? "#fb7185" : "rgba(167,243,208,0.42)";
      ctx.lineWidth = 2; ctx.stroke();
      for (var s = 0; s < 7; s++) {
        var sl = slotTarget(s);
        ctx.fillStyle = "rgba(255,255,255,0.08)";
        ctx.beginPath(); ctx.roundRect(sl.x, sl.y, tw*0.86, th*0.86, 8); ctx.fill();
      }
      for (var ti = 0; ti < tray.length; ti++) {
        var sl2 = slotTarget(ti);
        drawTileCard(tray[ti], sl2.x, sl2.y, tw * 0.86, th * 0.86, false, 0);
      }
      for (var fj = 0; fj < flying.length; fj++) {
        var fl2 = flying[fj], e = 1 - Math.pow(1 - fl2.t, 3);
        var fx = fl2.x0 + (fl2.x1 - fl2.x0) * e;
        var fy = fl2.y0 + (fl2.y1 - fl2.y0) * e - Math.sin(e * Math.PI) * 28;
        var fw = tw * (1 - 0.14 * e), fh = th * (1 - 0.14 * e);
        drawTileCard(fl2.tile, fx, fy, fw, fh, false, 0.8);
      }
      for (var k = particles.length - 1; k >= 0; k--) {
        var pt = particles[k]; pt.x += pt.vx*dt*60; pt.y += pt.vy*dt*60; pt.life -= dt*2.4;
        if (pt.life <= 0) { particles.splice(k, 1); continue; }
        ctx.globalAlpha = pt.life; ctx.fillStyle = pt.col; ctx.beginPath(); ctx.arc(pt.x, pt.y, 3.2, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1;
      }
      activeRaf = requestAnimationFrame(loop);
    }

    init(); activeRaf = requestAnimationFrame(loop);
  }

  var GAMES = {
    flow:startFlow, sort:startSort, candy:startCandy, blocks:startBlocks, g2048:start2048,
    caro:startCaro, onet:startOnet, rush:startRush, merge:startFlowerMerge,
    blockfill:startBlockFill, tapmatch:startTapMatch
  };

  window.handleAppBack = function () {
    var lvModal = document.getElementById("candy-levels-modal");
    if (lvModal && lvModal.classList.contains("open")) {
      lvModal.classList.remove("open");
      if (window.sugarPopGame && !document.getElementById("pause-modal").classList.contains("open")) window.sugarPopGame.paused = false;
      return true;
    }
    var pModal = document.getElementById("pause-modal");
    if (pModal && pModal.classList.contains("open")) {
      pModal.classList.remove("open");
      if (window.sugarPopGame) window.sugarPopGame.paused = false;
      return true;
    }
    if (!pauseGlobalModal.classList.contains("hidden")) { hideGlobalPause(); return true; }
    if (!resModal.classList.contains("hidden")) { hideResultModal(); return true; }
    if (!exitModal.classList.contains("hidden")) {
      var m = exitMode;
      hideExitModal();
      if (m === "game") { showMenu(); return true; }
      stopRaf();
      return false;
    }
    if (!viewGame.classList.contains("hidden")) {
      openExitModal("game");
      return true;
    }
    openExitModal("menu");
    return true;
  };
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape") {
      if (window.handleAppBack()) e.preventDefault();
    }
  });
  if (!window.AndroidBridge && window.history && window.history.pushState) {
    window.history.pushState({ gamesGuard: 1 }, "");
    window.addEventListener("popstate", function(){
      if (window.handleAppBack()) {
        window.history.pushState({ gamesGuard: 1 }, "");
      }
    });
  }
})();
</script>
</body>

<style>
/* Lucian UX/UI Prompt #001, #002, #006, #007, #050 · MIT License (c) 2026 Seokwoooo · https://lucianlabs.dev/uxui-prompt/ */
  :root{
    --ux-page:#0c1b18;--ux-surface:#132722;--ux-surface-2:#19322b;--ux-surface-3:#224239;
    --ux-ink:#f6fbf8;--ux-ink-2:rgba(246,251,248,.76);--ux-ink-3:rgba(246,251,248,.52);

    --ux-shadow:rgba(4,14,12,.45);--ux-shadow-strong:rgba(2,8,7,.72);
    --ux-grad:linear-gradient(125deg,#ff4d8d 0%,#c084fc 52%,#34d399 100%);
    --ux-ease:cubic-bezier(.2,.8,.2,1);--ux-spring:cubic-bezier(.34,1.45,.64,1);

    --grad:linear-gradient(135deg,#ff6b9d 0%,#ff3b6f 50%,#c084fc 100%);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:"Pretendard Variable",Pretendard,'Roboto',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,77,141,.22) 0%, transparent 45%),
      radial-gradient(circle at 85% 18%, rgba(52,211,153,.20) 0%, transparent 42%),
      radial-gradient(circle at 50% 90%, rgba(167,139,250,.18) 0%, transparent 50%),
      linear-gradient(160deg,#081512 0%,#102620 50%,#141529 100%);
    color:var(--ink);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;
    position:relative;
  }
  .hidden{display:none!important}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  }

  /* AMBIENT GARDEN BLOBS (Lucian #001 inspired) */
  .garden-ambience{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .garden-ambience i{position:absolute;border-radius:50%;filter:blur(48px);opacity:.38;animation:ambDrift 14s ease-in-out infinite alternate}
  .garden-ambience i:nth-child(1){width:240px;height:240px;left:-40px;top:6%;background:#ff4d8d}
  .garden-ambience i:nth-child(2){width:260px;height:260px;right:-60px;top:24%;background:#34d399;animation-delay:-5s}
  .garden-ambience i:nth-child(3){width:220px;height:220px;left:35%;bottom:-40px;background:#a78bfa;animation-delay:-9s}
  @keyframes ambDrift{from{transform:translate3d(-12px,-8px,0) scale(1)}to{transform:translate3d(16px,12px,0) scale(1.14)}}

  /* LUCIANLAB #001 LIQUID GLASS + #002 MAGNETIC + #006 INK RIPPLE BUTTONS */
  button{
    border:0;font-family:inherit;cursor:pointer;position:relative;overflow:hidden;isolation:isolate;
    transition:transform .46s var(--ux-spring),translate .55s var(--ux-spring),box-shadow .38s var(--ux-ease),background .28s var(--ux-ease),border-color .28s var(--ux-ease),opacity .2s;
  }
  button::after{
    content:"";position:absolute;top:-45%;bottom:-45%;left:0;width:38%;pointer-events:none;z-index:2;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.46) 50%,transparent);
    transform:translateX(-165%) skewX(-13deg);transition:transform .95s var(--ux-ease);
  }
  button:hover::after{transform:translateX(325%) skewX(-13deg)}
  button:hover{transform:translateY(-1.5px)}
  button:active{transform:scale(1.03,.92)!important}
  button:focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}
  .ux-ink{
    position:absolute;z-index:1;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;
    background:rgba(255,255,255,.42);pointer-events:none;
    animation:uxInk .65s var(--ux-ease) forwards;
  }
  @keyframes uxInk{from{transform:scale(0);opacity:.85}to{transform:scale(var(--s,12));opacity:0}}

  /* Liquid glass crystal upper meniscus (Lucian #001 u001-btn::before) */
  .btn-pill::before,.btn-ico::before,.btn-3d::before,.btn-3d-light::before{
    content:"";position:absolute;left:10%;right:10%;top:2px;height:44%;border-radius:999px;pointer-events:none;z-index:1;

  }
  .btn-pill>*,.btn-ico>*,.btn-3d>*,.btn-3d-light>*{position:relative;z-index:3}

    background:radial-gradient(140px 80px at var(--mx,50%) var(--my,10%),rgba(255,255,255,.32),transparent 70%),linear-gradient(135deg,#ff5e99 0%,#ff2e6e 48%,#a855f7 100%);
    box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),inset 0 -10px 18px -10px rgba(100,10,50,.55),0 12px 26px -6px rgba(255,59,111,.46);

    -webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);

    width:34px;height:34px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;
    color:#f0fdf9;
    background:radial-gradient(80px 56px at var(--mx,50%) var(--my,10%),rgba(255,255,255,.25),transparent 72%),linear-gradient(155deg,rgba(220,252,231,.20),rgba(52,211,153,.10) 55%,rgba(6,78,59,.36));
    -webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);
    box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),inset 0 -8px 14px -8px rgba(4,24,18,.68),inset 0 0 0 1px rgba(167,243,208,.28),0 8px 18px -8px rgba(0,0,0,.58);

  #app-hdr .btn-pill{height:38px;padding:0 15px;font-size:12.5px}
  #app-hdr .btn-ico{width:38px;height:38px}
  #btn-pause{
    color:#fef3c7;
    background:radial-gradient(80px 56px at var(--mx,50%) var(--my,10%),rgba(255,255,255,.28),transparent 72%),linear-gradient(150deg,rgba(251,191,36,.32),rgba(245,158,11,.16) 55%,rgba(120,53,15,.38));

  /* HEADER */
  header#app-hdr{
    position:relative;z-index:10;
    display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;
    background:rgba(11,26,22,.82);-webkit-backdrop-filter:blur(22px) saturate(180%);
    backdrop-filter:blur(22px) saturate(180%);border-bottom:1px solid rgba(167,243,208,.16);flex-shrink:0;
    box-shadow:0 8px 24px rgba(0,0,0,.28);

  .htitle{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
  .hbtns{display:flex;gap:8px;align-items:center}

  main#app-main{position:relative;z-index:2;flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;align-items:center}

  /* MENU CARDS WITH LUCIAN #050 SPOTLIGHT-TILT GLARE */
  .menu-wrap{width:100%;max-width:460px;display:grid;grid-template-columns:1fr 1fr;gap:12px;animation:fadeUp .35s var(--ux-ease);perspective:900px}
  .gcard{
    background:linear-gradient(155deg,rgba(255,255,255,.14),rgba(255,255,255,.05));
    -webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);
    border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:15px 13px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.26),0 10px 26px rgba(0,0,0,.28);
    display:flex;flex-direction:column;gap:6px;text-align:left;
    transform-style:preserve-3d;
    transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
    transition:transform .5s var(--ux-spring),box-shadow .35s var(--ux-ease),border-color .3s var(--ux-ease);
    will-change:transform;
  }
  .gcard::before{
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;
    background:radial-gradient(180px 140px at var(--mx,50%) var(--my,50%),rgba(255,255,255,.22),transparent 70%);
    transition:opacity .3s var(--ux-ease);
  }
  .gcard:hover::before{opacity:1}
  .gcard:hover{border-color:rgba(134,239,172,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 16px 34px rgba(0,0,0,.4),0 0 22px rgba(52,211,153,.18)}
  .gcard .ico{
    width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;
    font-size:23px;margin-bottom:2px;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 6px 14px rgba(0,0,0,.22);
    transform:translateZ(10px);

  .gcard .name{font-size:14px;font-weight:800;color:#ffffff}
  .gcard .desc{font-size:11.5px;color:var(--muted);line-height:1.4}
  .gcard .tag{align-self:flex-start;margin-top:auto;padding:3px 9px;font-size:10px;font-weight:700;border-radius:999px;background:rgba(255,77,141,.18);color:#fda4af;border:1px solid rgba(255,77,141,.28)}

  /* GAME SHELL */
  .game-wrap{width:100%;max-width:460px;display:flex;flex-direction:column;gap:10px;align-items:center;animation:fadeUp .3s var(--ux-ease)}
  .hud{
    width:100%;
    background:linear-gradient(160deg,rgba(22,52,44,.84),rgba(11,28,24,.90));
    -webkit-backdrop-filter:blur(20px) saturate(175%);backdrop-filter:blur(20px) saturate(175%);
    border:1px solid rgba(167,243,208,.22);border-radius:20px;padding:10px 12px;
    display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;
    box-shadow:inset 0 1.5px 0 rgba(255,255,255,.22),0 10px 26px rgba(0,0,0,.32);
  }
  .hud-st{font-size:13px;font-weight:800;color:#ecfdf5;text-shadow:0 1px 2px rgba(0,0,0,.4)}
  .hud-bt{display:flex;gap:7px;flex-wrap:wrap;align-items:center}

    border:1px solid rgba(167,243,208,.18);border-radius:22px;padding:10px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 14px 36px rgba(0,0,0,.34);
    display:flex;flex-direction:column;align-items:center;gap:10px;

  canvas.gcanvas{max-width:100%;display:block;border-radius:16px;touch-action:none}
    @media(min-width:640px){
      .menu-wrap{max-width:920px;grid-template-columns:repeat(3,1fr);gap:16px}

  .game-wrap.candy-full .hud{display:none}
  .game-wrap.candy-full .board{flex:1;padding:0;border:none;border-radius:0;background:transparent;box-shadow:none;height:100%}
  
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes popIn{from{opacity:0;transform:scale(.86) translateY(14px)}to{opacity:1;transform:scale(1) translateY(0)}}
  @keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .res-ov{
    position:fixed;inset:0;z-index:200;background:rgba(6,16,14,.68);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);

    /* ==========================================================================
       1. CANDY SAGA RESPONSIVE PC & MOBILE SHELL (SCOPED TO #candy-root)
       ========================================================================== */
    #candy-root {
      --font-main: 'Fredoka', 'Nunito', 'Arial Rounded MT Bold', 'Segoe UI', system-ui, -apple-system, sans-serif;
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 25%, #5b1d69 0%, #2b1042 55%, #160a26 100%);
      font-family: var(--font-main);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    :where(#candy-root) * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    #candy-root #game-shell {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #ffd9ec;
    }

    @media (min-width: 601px) {
      #candy-root {
        padding: 10px 16px;
      }
      #candy-root #game-shell {
        width: min(640px, 95vw);
        height: min(940px, 100%);
        border-radius: 26px;
        box-shadow:
          0 26px 65px rgba(0, 0, 0, 0.6),
          0 0 0 3px rgba(255, 255, 255, 0.25);
      }
    }

    /* Full-bleed Animated Pastel Candy Landscape Canvas */
    #bg-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* ==========================================================================
       2. TOP GLOSSY CANDY HUD
       ========================================================================== */
    #top-hud {
      position: relative;
      z-index: 10;
      margin: 8px 8px 4px 8px;
      padding: 8px 10px 9px 10px;
      border-radius: 22px;
      background: linear-gradient(180deg, #ff7ec2 0%, #ef2b88 48%, #ba1160 100%);
      border: 2.5px solid rgba(255, 255, 255, 0.78);
      box-shadow:
        0 6px 0 rgba(122, 8, 60, 0.88),
        0 10px 22px rgba(72, 0, 36, 0.36),
        inset 0 3px 6px rgba(255, 255, 255, 0.68);
      display: grid;
      grid-template-columns: 76px 1fr 70px;
      gap: 8px;
      align-items: center;
    }

    #top-hud::before {
      content: '';
      position: absolute;
      top: 3px;
      left: 16px;
      right: 16px;
      height: 13px;
      border-radius: 99px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.56), rgba(255, 255, 255, 0));
      pointer-events: none;
    }

    /* Left: Level Pill & Moves Counter Orb */
    .hud-left {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .level-pill {
      font-size: 11px;
      font-weight: 800;
      color: #fff9cc;
      background: rgba(94, 8, 52, 0.64);
      padding: 2px 9px;
      border-radius: 99px;
      border: 1.5px solid rgba(255, 255, 255, 0.5);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    .moves-orb {
      width: 60px;
      height: 52px;
      border-radius: 16px;
      background: radial-gradient(circle at 32% 24%, #ffffff 0%, #ffe6f4 35%, #ff99cc 100%);
      border: 2.5px solid #ffffff;
      box-shadow:
        inset 0 -4px 6px rgba(180, 20, 90, 0.35),
        0 4px 8px rgba(0, 0, 0, 0.28);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1;
      transition: transform 0.2s ease;
    }

    .moves-orb.low-moves {
      background: radial-gradient(circle at 35% 25%, #fff6b8 0%, #ff6542 46%, #c70022 100%);
      animation: dangerPulse 0.72s ease-in-out infinite;
    }

    @keyframes dangerPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.09); }
    }

    .moves-label {
      font-size: 9px;
      font-weight: 800;
      color: #9e0b50;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .moves-orb.low-moves .moves-label {
      color: #fff7cc;
    }

    #moves-count {
      font-size: 25px;
      font-weight: 900;
      color: #b80054;
      text-shadow: 0 1.5px 0 rgba(255, 255, 255, 0.9);
    }

    .moves-orb.low-moves #moves-count {
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(100, 0, 0, 0.75);
    }

    /* Center: Score Progress + 3 Stars + Target Box */
    .hud-center {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .score-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .progress-wrap {
      position: relative;
      flex: 1;
      height: 15px;
      border-radius: 99px;
      background: rgba(52, 8, 36, 0.68);
      border: 1.8px solid rgba(255, 255, 255, 0.7);
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.52);
      overflow: visible;
    }

    #score-bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 99px;
      background: linear-gradient(90deg, #32e0ff 0%, #44ff9c 55%, #ffe63b 100%);
      box-shadow: 0 0 8px rgba(80, 255, 190, 0.75), inset 0 2px 3px rgba(255, 255, 255, 0.75);
      transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .star-marker {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 20px;
      height: 20px;
      pointer-events: none;
      filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.45));
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .star-marker.earned {
      transform: translate(-50%, -50%) scale(1.24);
    }

    .star-marker svg {
      width: 100%;
      height: 100%;
    }

    #score-text {
      font-size: 11px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 1.5px 2px rgba(70, 0, 35, 0.85);
      min-width: 44px;
      text-align: right;
    }

    #target-box {
      background: linear-gradient(180deg, #274094 0%, #132158 100%);
      border: 2px solid rgba(155, 218, 255, 0.76);
      border-radius: 14px;
      padding: 4px 8px;
      min-height: 44px;
      box-shadow:
        inset 0 3px 8px rgba(0, 0, 20, 0.58),
        0 2px 6px rgba(0, 0, 0, 0.26);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: nowrap;
    }

    .goal-item {
      display: flex;
      align-items: center;
      gap: 4px;
      color: #ffffff;
      font-weight: 900;
      font-size: 15px;
      text-shadow: 0 2px 3px rgba(0, 0, 0, 0.75);
    }

    .goal-icon-canvas {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
    }

    .goal-done-check {
      color: #54ff76;
      font-size: 18px;
      filter: drop-shadow(0 0 6px rgba(84, 255, 118, 0.85));
    }

    /* Right: Animated Mascot Avatar & Audio Button */
    .hud-right {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-frame {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 24%, #fff7db, #ffd4e8 60%, #ff8fc4 100%);
      border: 3px solid #ffffff;
      box-shadow:
        0 4px 10px rgba(70, 0, 35, 0.44),
        inset 0 -4px 8px rgba(180, 40, 110, 0.3);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #mascot-canvas {
      width: 64px;
      height: 64px;
    }

    #sound-btn, #pause-btn {
      position: absolute;
      bottom: -6px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid #ffffff;
      background: linear-gradient(180deg, #4cd7ff 0%, #0d82e0 100%);
      color: #ffffff;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.42);
      transition: transform 0.14s ease;
      z-index: 6;
    }

    #sound-btn { right: -4px; }
    #pause-btn { left: -4px; background: linear-gradient(180deg, #ffd44d 0%, #f5820d 100%); font-size: 11px; }

    #sound-btn:active, #pause-btn:active {
      transform: scale(0.88);
    }

    #sound-btn.muted {
      background: linear-gradient(180deg, #98a2b8 0%, #565f75 100%);
    }

    /* ==========================================================================
       3. ACTIVE BOOSTER TOOLTIP BANNER
       ========================================================================== */
    #booster-banner {
      position: absolute;
      top: 98px;
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      z-index: 20;
      background: linear-gradient(180deg, #ffe44d 0%, #ff9900 100%);
      color: #5c1900;
      font-weight: 900;
      font-size: 12.5px;
      padding: 6px 14px;
      border-radius: 99px;
      border: 2px solid #ffffff;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.38);
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    #booster-banner.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ==========================================================================
       4. MAIN MATCH-3 BOARD CANVAS CONTAINER
       ========================================================================== */
    #board-container {
      position: relative;
      z-index: 5;
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px 4px;
      min-height: 0;
    }

    #game-canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: pointer;
    }

    /* ==========================================================================
       5. BOTTOM GLOSSY BOOSTER DOCK
       ========================================================================== */
    #booster-bar {
      position: relative;
      z-index: 10;
      margin: 4px 10px 10px 10px;
      padding: 8px 12px;
      border-radius: 22px;
      background: linear-gradient(180deg, #ff70bb 0%, #db1f78 55%, #9e0d52 100%);
      border: 2.5px solid rgba(255, 255, 255, 0.76);
      box-shadow:
        0 5px 0 rgba(105, 8, 52, 0.88),
        0 10px 22px rgba(60, 0, 30, 0.36),
        inset 0 3px 5px rgba(255, 255, 255, 0.58);
      display: flex;
      align-items: center;
      justify-content: space-around;
      gap: 12px;
    }

    #candy-root .booster-btn {
      position: relative;
      flex: 1;
      max-width: 132px;
      height: 60px;
      overflow: visible;
      border-radius: 16px;
      border: 2.5px solid #ffffff;
      background: linear-gradient(180deg, #52e5ff 0%, #1996f5 55%, #0c5bc2 100%);
      box-shadow:
        0 4px 0 #073980,
        0 6px 12px rgba(0, 0, 0, 0.32),
        inset 0 2px 4px rgba(255, 255, 255, 0.72);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      transition: transform 0.14s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.14s ease, filter 0.15s ease;
      padding: 4px 6px;
    }
    #candy-root .booster-btn::after {
      display: none;
    }

    .booster-btn:hover {
      transform: translateY(-2px);
    }

    .booster-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #073980, 0 3px 6px rgba(0, 0, 0, 0.25);
    }

    .booster-btn.active {
      background: linear-gradient(180deg, #fff066 0%, #ffaa00 60%, #e06000 100%);
      box-shadow: 0 0 18px rgba(255, 232, 65, 0.96), 0 4px 0 #993900;
      transform: scale(1.06) translateY(-3px);
      animation: boosterGlow 0.85s ease-in-out infinite;
    }

    @keyframes boosterGlow {
      0%, 100% { box-shadow: 0 0 14px rgba(255, 230, 60, 0.9), 0 4px 0 #993900; }
      50% { box-shadow: 0 0 26px rgba(255, 255, 145, 1), 0 4px 0 #993900; }
    }

    .booster-btn.empty {
      filter: grayscale(0.85) brightness(0.75);
      cursor: not-allowed;
    }

    .booster-icon {
      width: 30px;
      height: 30px;
      pointer-events: none;
    }

    .booster-name {
      font-size: 10px;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 1.5px 2px rgba(0, 20, 65, 0.85);
      line-height: 1;
      white-space: nowrap;
    }

    .booster-count {
      position: absolute;
      top: -8px;
      right: -6px;
      min-width: 24px;
      height: 24px;
      padding: 0 5px;
      border-radius: 99px;
      background: linear-gradient(180deg, #ff5487 0%, #c70042 100%);
      border: 2px solid #ffffff;
      color: #ffffff;
      font-size: 12px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.36);
    }

    /* ==========================================================================
       6. WIN & OUT-OF-MOVES MODALS
       ========================================================================== */
    .modal-backdrop {
      position: absolute;
      inset: 0;
      z-index: 50;
      background: rgba(24, 6, 36, 0.68);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s ease;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      width: 100%;
      max-width: 332px;
      border-radius: 28px;
      background: linear-gradient(180deg, #fff6fc 0%, #ffe0f2 100%);
      border: 4px solid #ffffff;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.56), 0 0 0 4px #eb2883;
      padding: 22px 18px 20px 18px;
      text-align: center;
      transform: scale(0.82) translateY(20px);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-backdrop.open .modal-card {
      transform: scale(1) translateY(0);
    }

    .modal-ribbon {
      display: inline-block;
      margin-top: -38px;
      margin-bottom: 10px;
      padding: 8px 26px;
      border-radius: 99px;
      background: linear-gradient(180deg, #ff5ea8 0%, #d4126c 100%);
      border: 3px solid #ffffff;
      color: #ffffff;
      font-size: 21px;
      font-weight: 900;
      text-shadow: 0 2px 4px rgba(100, 0, 45, 0.72);
      box-shadow: 0 6px 14px rgba(150, 0, 70, 0.45);
    }

    .modal-ribbon.lose-ribbon {
      background: linear-gradient(180deg, #7484b5 0%, #3d4873 100%);
      box-shadow: 0 6px 14px rgba(20, 25, 60, 0.45);
    }

    .modal-stars {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 10px 0 14px 0;
    }

    .modal-star {
      width: 52px;
      height: 52px;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.25));
      transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-star:nth-child(2) {
      width: 66px;
      height: 66px;
      margin-top: -12px;
    }

    .modal-score-box {
      background: rgba(255, 255, 255, 0.88);
      border: 2px solid #f7a6d0;
      border-radius: 16px;
      padding: 10px 14px;
      margin-bottom: 14px;
    }

    .modal-score-label {
      font-size: 12px;
      font-weight: 800;
      color: #9e2a66;
      text-transform: uppercase;
    }

    .modal-score-value {
      font-size: 30px;
      font-weight: 900;
      color: #d61570;
      text-shadow: 0 1px 0 #ffffff;
    }

    .modal-subtext {
      font-size: 13px;
      font-weight: 700;
      color: #6b284d;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .modal-btn {
      width: 100%;
      padding: 13px 20px;
      border-radius: 99px;
      border: 3px solid #ffffff;
      background: linear-gradient(180deg, #5cff7f 0%, #19c445 55%, #0a8f2d 100%);
      color: #ffffff;
      font-family: var(--font-main);
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 0.4px;
      text-shadow: 0 2px 3px rgba(0, 80, 20, 0.72);
      box-shadow: 0 5px 0 #07661f, 0 10px 20px rgba(0, 120, 40, 0.35);
      cursor: pointer;
      transition: transform 0.14s ease, box-shadow 0.14s ease;
    }

    .modal-btn:hover {
      transform: translateY(-2px);
    }

    .modal-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #07661f;
    }

    .modal-btn.retry-btn {
      background: linear-gradient(180deg, #ff9a3d 0%, #f05a00 55%, #bd3800 100%);
      box-shadow: 0 5px 0 #852400, 0 10px 20px rgba(180, 60, 0, 0.35);
      text-shadow: 0 2px 3px rgba(110, 30, 0, 0.72);
    }

    .modal-btn.retry-btn:active {
      box-shadow: 0 2px 0 #852400;
    }

    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 9px;
      width: 100%;
    }

    .modal-btn.sec-btn {
      padding: 10px 16px;
      font-size: 15px;
      background: linear-gradient(180deg, #62dbff 0%, #1c8cf0 55%, #0a58b5 100%);
      box-shadow: 0 4px 0 #073b7d, 0 8px 16px rgba(10, 90, 180, 0.28);
      text-shadow: 0 1.5px 2px rgba(0, 35, 90, 0.72);
    }

    .modal-btn.menu-btn {
      padding: 10px 16px;
      font-size: 15px;
      background: linear-gradient(180deg, #ff7eb9 0%, #e0287d 55%, #a30b52 100%);
      box-shadow: 0 4px 0 #700436, 0 8px 16px rgba(160, 10, 80, 0.28);
      text-shadow: 0 1.5px 2px rgba(90, 0, 40, 0.72);
    }

    #candy-root #level-label {
      cursor: pointer;
      transition: transform .16s var(--ux-spring), background .2s;
    }
    #candy-root #level-label:hover {
      transform: scale(1.06);
      background: rgba(130, 14, 72, 0.85);
    }
    #candy-root .booster-count {
      z-index: 4;
      pointer-events: none;
    }
    .candy-lv-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      max-height: 290px;
      overflow-y: auto;
      padding: 6px 2px 10px;
      margin-bottom: 10px;
    }
    .candy-lv-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 8px 4px;
      border-radius: 14px;
      border: 2px solid #fff;
      background: linear-gradient(180deg, #ff8ac6 0%, #e1247c 100%);
      color: #fff;
      font-weight: 900;
      font-size: 14px;
      box-shadow: 0 3px 0 #8a0945;
      cursor: pointer;
    }
    .candy-lv-btn.active-lv {
      background: linear-gradient(180deg, #fde047 0%, #f59e0b 100%);
      color: #451a03;
      box-shadow: 0 3px 0 #92400e;
    }
    .candy-lv-btn.locked-lv {
      background: linear-gradient(180deg, #cbd5e1 0%, #94a3b8 100%);
      color: #475569;
      box-shadow: 0 3px 0 #64748b;
      cursor: not-allowed;
      opacity: .75;
    }
    .candy-lv-stars { font-size: 10px; line-height: 1; letter-spacing: 1px; }
    .candy-lv-shape { font-size: 9px; font-weight: 700; opacity: .92; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>

<body>
  <div class="garden-ambience" aria-hidden="true"><i></i><i></i><i></i></div>

  <!-- HEADER -->
  <header id="app-hdr">
    <div class="brand">
      <span class="pill">🌸 Vườn Hoa 3D</span>
      <span class="htitle" id="hdr-title">Kho Game Vườn Hoa</span>
    </div>
    <div class="hbtns">
      <button class="btn-ico hidden" id="btn-pause" title="Tạm dừng" aria-label="Tạm dừng"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="3.8" height="14" rx="1.6" fill="currentColor" stroke="none"/><rect x="13.7" y="5" width="3.8" height="14" rx="1.6" fill="currentColor" stroke="none"/></svg></button>
      <button class="btn-ico" id="btn-sound" title="Âm thanh" aria-label="Bật hoặc tắt âm thanh"><svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="11 5 6 9 2.5 9 2.5 15 6 15 11 19 11 5" fill="currentColor" stroke="none"/><path class="snd-wave" d="M15.5 8.5a5 5 0 0 1 0 7M18.6 5.8a9 9 0 0 1 0 12.4"/><path class="snd-mute hidden" d="M21 9l-6 6M15 9l6 6"/></svg></button>
      <button class="btn-pill hidden" id="btn-menu" aria-label="Về Menu"><svg class="ux-nudge" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg><span>Menu</span></button>
      <button class="btn-pill pri" id="btn-reload-top" aria-label="Load lại"><svg class="ux-spin" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg><span>Load lại</span></button>
    </div>
  </header>

  <main id="app-main">
    <section class="menu-wrap" id="view-menu">
      <button class="gcard" data-game="flow">
        <div class="ico" style="background:linear-gradient(135deg,#fda4af,#fb7185)">🌺</div>
        <div class="name">Nối Hoa Phát Sáng</div>
        <div class="desc">Kéo nối dây leo phát sáng giữa các cặp hoa 3D phủ kín vườn • Vô hạn màn.</div>
        <span class="tag">Hoa 3D • Vô tận</span>
      </button>
      <button class="gcard" data-game="sort">
        <div class="ico" style="background:linear-gradient(135deg,#c4b5fd,#8b5cf6)">💐</div>
        <div class="name">Xếp Hoa Pha Lê</div>
        <div class="desc">Cắm phân loại các bông hoa 3D phát sáng vào chậu cây cùng loài • 60fps.</div>
        <span class="tag">Hoa 3D • Chậu Cây</span>
      </button>
      <button class="gcard" data-game="candy">
        <div class="ico" style="background:linear-gradient(135deg,#fbcfe8,#f472b6)">🌷</div>
        <div class="name">Sugar Pop Hoa 3D</div>
        <div class="desc">Match-3 hoa 3D phát sáng, 12 mô hình bàn, Bướm Hoa 2×2 &amp; Sen Cầu Vồng.</div>
        <span class="tag">Chủ lực • Nhiều màn</span>
      </button>
      <button class="gcard" data-game="blocks">
        <div class="ico" style="background:linear-gradient(135deg,#a7f3d0,#10b981)">🪷</div>
        <div class="name">Ghép Khối Hoa</div>
        <div class="desc">Đặt cụm hoa 3D phát sáng lên thảm rêu 8×8, đầy hàng là bung nở.</div>
        <span class="tag">Hoa 3D • 60fps</span>
      </button>
      <button class="gcard" data-game="g2048">
        <div class="ico" style="background:linear-gradient(135deg,#fde68a,#f59e0b)">🌻</div>
        <div class="name">2048 Vườn Hoa</div>
        <div class="desc">Gộp hoa tiến hóa từ Bạch Trà tới Sen Vàng 2048 phát sáng lung linh.</div>
        <span class="tag">Tiến hóa • Vô tận</span>
      </button>
      <button class="gcard" data-game="caro">
        <div class="ico" style="background:linear-gradient(135deg,#bae6fd,#38bdf8)">🌹</div>
        <div class="name">Cờ Caro Hoa 3D</div>
        <div class="desc">Đấu trí bằng hoa Hồng &amp; Lưu Ly phát sáng • Chế độ 3×3, 11×11, Vô hạn.</div>
        <span class="tag">1 hoặc 2 Người</span>
      </button>
      <button class="gcard" data-game="onet">
        <div class="ico" style="background:linear-gradient(135deg,#fef08a,#eab308)">🌼</div>
        <div class="name">Onet Vườn Hoa</div>
        <div class="desc">Nối cặp hoa 3D • Trọng lực trượt màn nâng cao • Càng sau càng khó!</div>
        <span class="tag">Trọng lực • Vô tận</span>
      </button>
      <button class="gcard" data-game="rush">
        <div class="ico" style="background:linear-gradient(135deg,#fecdd3,#e11d48)">🏵️</div>
        <div class="name">Lối Thoát Vườn Hoa</div>
        <div class="desc">Trượt khay hoa mở lối đưa Kiệu Hoa Hồng Đỏ ra cổng vườn • Vô hạn màn.</div>
        <span class="tag">Trí tuệ • Vô tận</span>
      </button>
      <button class="gcard" data-game="merge">
        <div class="ico" style="background:linear-gradient(135deg,#fed7aa,#f97316)">🌺</div>
        <div class="name">Flower Merge Thả Hoa</div>
        <div class="desc">Thả và gộp hoa 3D từ Lưu Ly tí hon thành Đại Đóa Sen Vàng khổng lồ!</div>
        <span class="tag">Vật lý • Fruit Merge</span>

      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || "sine"; o.frequency.value = freq;
      g.gain.setValueAtTime(0.075, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (dur || 0.09));
      o.connect(g); g.connect(audioCtx.destination);

  /* LUCIANLAB #006 INK RIPPLE + #050 SPOTLIGHT-TILT FOR ALL BUTTONS & CARDS */

  var _magBtn = null;

  /* SHARED HIGH-DPI 3D GLOWING FLOWER SPRITE ENGINE */
  var FLOWER_SPECIES = [
    { name:"Rose",      main:"#fb3b70", light:"#ffb3c8", dark:"#8f0a34", glow:"#ff5c8a", core:"#fde047", petals:7, kind:"rose" },
    { name:"Sunflower", main:"#f59e0b", light:"#fef08a", dark:"#92400e", glow:"#fbbf24", core:"#5c2d0c", petals:10, kind:"sun" },
    { name:"Sakura",    main:"#f472b6", light:"#fce7f3", dark:"#9d174d", glow:"#f9a8d4", core:"#fff1f2", petals:5, kind:"sakura" },
    { name:"Orchid",    main:"#a855f7", light:"#e9d5ff", dark:"#581c87", glow:"#c084fc", core:"#fef08a", petals:6, kind:"orchid" },
    { name:"ForgetMe",  main:"#0ea5e9", light:"#bae6fd", dark:"#0369a1", glow:"#38bdf8", core:"#fde047", petals:5, kind:"round" },
    { name:"Lotus",     main:"#10b981", light:"#a7f3d0", dark:"#065f46", glow:"#34d399", core:"#fef9c3", petals:8, kind:"lotus" },
    { name:"Lily",      main:"#fb923c", light:"#ffedd5", dark:"#9a3412", glow:"#fdba74", core:"#fef08a", petals:6, kind:"lily" },
    { name:"Camellia",  main:"#e2e8f0", light:"#ffffff", dark:"#64748b", glow:"#f8fafc", core:"#fbbf24", petals:8, kind:"rose" },
    { name:"Iris",      main:"#6366f1", light:"#c7d2fe", dark:"#312e81", glow:"#818cf8", core:"#fef08a", petals:6, kind:"orchid" },
    { name:"Hibiscus",  main:"#ec4899", light:"#fbcfe8", dark:"#831843", glow:"#f472b6", core:"#fde047", petals:5, kind:"round" }
  ];
  var _flowerCache = {};
  function getFlowerSprite(idx, pxSize) {
    var sp = FLOWER_SPECIES[((idx % FLOWER_SPECIES.length) + FLOWER_SPECIES.length) % FLOWER_SPECIES.length];
    var q = Math.max(24, Math.round(pxSize / 4) * 4);
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var key = idx + "_" + q + "_" + dpr;
    if (_flowerCache[key]) return _flowerCache[key];

    var pad = Math.ceil(q * 0.28);
    var tot = q + pad * 2;
    var c = document.createElement("canvas");
    c.width = Math.ceil(tot * dpr); c.height = Math.ceil(tot * dpr);
    var b = c.getContext("2d");
    b.setTransform(dpr, 0, 0, dpr, 0, 0);
    var cx = tot * 0.5, cy = tot * 0.5, R = q * 0.46;

    // 1. Soft bioluminescent aura halo
    var halo = b.createRadialGradient(cx, cy, R * 0.12, cx, cy, R * 1.48);
    halo.addColorStop(0, sp.glow + "cc");
    halo.addColorStop(0.55, sp.glow + "44");
    halo.addColorStop(1, "rgba(0,0,0,0)");
    b.fillStyle = halo;
    b.beginPath(); b.arc(cx, cy, R * 1.48, 0, Math.PI * 2); b.fill();

    // Helper to draw petal shape
    function drawPetal(ang, len, wid, innerShade, isBack) {
      b.save();
      b.translate(cx, cy);
      b.rotate(ang);
      b.shadowColor = isBack ? "rgba(0,0,0,0.4)" : sp.glow;
      b.shadowBlur = isBack ? R * 0.12 : R * 0.22;
      b.beginPath();
      if (sp.kind === "sakura") {
        b.moveTo(0, 0);
        b.bezierCurveTo(len * 0.35, -wid * 0.85, len * 0.92, -wid * 0.65, len, -wid * 0.16);
        b.lineTo(len * 0.86, 0);
        b.lineTo(len, wid * 0.16);
        b.bezierCurveTo(len * 0.92, wid * 0.65, len * 0.35, wid * 0.85, 0, 0);
      } else if (sp.kind === "lotus" || sp.kind === "lily" || sp.kind === "sun") {
        b.moveTo(0, 0);
        b.quadraticCurveTo(len * 0.48, -wid * 0.72, len, 0);
        b.quadraticCurveTo(len * 0.48, wid * 0.72, 0, 0);
      } else {
        b.moveTo(0, 0);
        b.bezierCurveTo(len * 0.3, -wid * 0.95, len * 1.05, -wid * 0.75, len, 0);
        b.bezierCurveTo(len * 1.05, wid * 0.75, len * 0.3, wid * 0.95, 0, 0);
      }
      b.closePath();
      var pg = b.createRadialGradient(len * 0.32, -wid * 0.15, len * 0.05, len * 0.48, 0, len * 0.95);
      pg.addColorStop(0, isBack ? sp.main : sp.light);
      pg.addColorStop(0.55, isBack ? sp.dark : sp.main);
      pg.addColorStop(1, isBack ? "#0a0814" : sp.dark);
      b.fillStyle = pg;
      b.fill();
      b.strokeStyle = isBack ? "rgba(255,255,255,0.18)" : "rgba(255,255,255,0.62)";
      b.lineWidth = Math.max(0.8, R * 0.045);
      b.stroke();

      if (!isBack) {
        b.fillStyle = "rgba(255,255,255,0.34)";
        b.beginPath();
        b.ellipse(len * 0.52, -wid * 0.16, len * 0.22, wid * 0.14, -0.15, 0, Math.PI * 2);
        b.fill();
      }
      b.restore();
    }

    // 2. Back petal ring (depth layer)
    var nP = sp.petals;
    for (var i = 0; i < nP; i++) {
      var a = (i / nP) * Math.PI * 2 + Math.PI / nP;
      drawPetal(a, R * 0.98, R * 0.46, true, true);
    }
    // 3. Front petal ring (luminous sculpted layer)
    for (var j = 0; j < nP; j++) {
      var a2 = (j / nP) * Math.PI * 2 - Math.PI / 2;
      drawPetal(a2, R * 0.88, R * 0.44, false, false);
    }
    // Inner rose spiral petals
    if (sp.kind === "rose") {
      for (var m = 0; m < 4; m++) {
        drawPetal((m / 4) * Math.PI * 2 + 0.4, R * 0.52, R * 0.32, false, false);
      }
    }

    // 4. Glowing 3D Flower Core + Stamen Specular
    var cr = R * (sp.kind === "sun" ? 0.34 : 0.25);
    var cg = b.createRadialGradient(cx - cr * 0.3, cy - cr * 0.3, cr * 0.08, cx, cy, cr);
    cg.addColorStop(0, "#ffffff");
    cg.addColorStop(0.45, sp.core);
    cg.addColorStop(1, sp.dark);
    b.fillStyle = cg;
    b.beginPath(); b.arc(cx, cy, cr, 0, Math.PI * 2); b.fill();
    b.strokeStyle = "rgba(255,255,255,0.75)";
    b.lineWidth = Math.max(0.8, R * 0.04);
    b.stroke();
    b.fillStyle = "rgba(255,255,255,0.9)";
    b.beginPath(); b.ellipse(cx - cr * 0.28, cy - cr * 0.3, cr * 0.28, cr * 0.16, -0.5, 0, Math.PI * 2); b.fill();

    var res = { c: c, tot: tot };
    _flowerCache[key] = res;
    return res;
  }
  function drawFlowerOn(ctx, idx, x, y, size, rot, scale) {
    var spr = getFlowerSprite(idx, size);
    var sc = (scale || 1) * (spr.tot / Math.max(24, Math.round(size / 4) * 4));
    var drawW = size * (spr.tot / Math.max(24, Math.round(size / 4) * 4)) * (scale || 1);
    ctx.save();
    ctx.translate(x, y);
    if (rot) ctx.rotate(rot);
    ctx.drawImage(spr.c, -drawW * 0.5, -drawW * 0.5, drawW, drawW);
    ctx.restore();
  }

  var UX_ICONS = {
    "◀":  "<svg class=\"ux-nudge\" viewBox=\"0 0 24 24\"><path d=\"M15 18l-6-6 6-6\"/></svg>",
    "⏮":  "<svg class=\"ux-nudge\" viewBox=\"0 0 24 24\"><path d=\"M15 18l-6-6 6-6\"/></svg>",

    // Procedural Infinite Orthogonal 100%-cover Flow Puzzle Generator (Backbite Hamiltonian Decomposition)
    function genFlowLevel(lvNum) {
      var n = lvNum <= 10 ? 6 : (lvNum <= 18 ? 7 : 8);
      var wantColors = n === 6 ? 6 : (n === 7 ? 7 : 8);
      var seed = (lvNum * 2654435761) >>> 0;
      function rand() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }

      for (var attempt = 0; attempt < 20; attempt++) {
        var path = [], idxMap = {};
        for (var r = 0; r < n; r++) {
          if (r % 2 === 0) { for (var c = 0; c < n; c++) path.push([r, c]); }
          else { for (var c2 = n - 1; c2 >= 0; c2--) path.push([r, c2]); }
        }
        for (var i = 0; i < path.length; i++) idxMap[path[i][0] + "," + path[i][1]] = i;

        var steps = n * n * 10;
        for (var s = 0; s < steps; s++) {
          var head = rand() < 0.5;
          var pt = head ? path[0] : path[path.length - 1];
          var nbrs = [], dirs = [[-1,0],[1,0],[0,-1],[0,1]];
          for (var d = 0; d < 4; d++) {
            var nr = pt[0] + dirs[d][0], nc = pt[1] + dirs[d][1];
            if (nr >= 0 && nc >= 0 && nr < n && nc < n) {
              var ni = idxMap[nr + "," + nc];
              if (head && ni > 1) nbrs.push(ni);
              else if (!head && ni < path.length - 2) nbrs.push(ni);
            }
          }
          if (!nbrs.length) continue;
          var pick = nbrs[(rand() * nbrs.length) | 0];
          var l = head ? 0 : pick + 1, rr = head ? pick - 1 : path.length - 1;
          while (l < rr) {
            var tmp = path[l]; path[l] = path[rr]; path[rr] = tmp;
            idxMap[path[l][0] + "," + path[l][1]] = l;
            idxMap[path[rr][0] + "," + path[rr][1]] = rr;
            l++; rr--;
          }
        }

        // Slice into wantColors non-adjacent orthogonal segments
        var segs = [], curIdx = 0, total = path.length;
        var ok = true;
        for (var k = 0; k < wantColors; k++) {
          var remSegs = wantColors - k;
          var remCells = total - curIdx;
          if (k === wantColors - 1) {
            var seg = path.slice(curIdx);
            if (seg.length < 3 || Math.abs(seg[0][0]-seg[seg.length-1][0])+Math.abs(seg[0][1]-seg[seg.length-1][1]) <= 1) { ok = false; break; }
            segs.push(seg);
          } else {
            var minL = 4, maxL = Math.min(9, remCells - (remSegs - 1) * 4);
            if (maxL < minL) { ok = false; break; }
            var foundLen = -1;
            var baseLen = minL + ((rand() * (maxL - minL + 1)) | 0);
            for (var off = 0; off <= maxL - minL; off++) {
              var tryL = minL + ((baseLen - minL + off) % (maxL - minL + 1));
              var a = path[curIdx], b = path[curIdx + tryL - 1];
              if (Math.abs(a[0]-b[0]) + Math.abs(a[1]-b[1]) > 1) { foundLen = tryL; break; }
            }
            if (foundLen < 0) { ok = false; break; }
            segs.push(path.slice(curIdx, curIdx + foundLen));
            curIdx += foundLen;
          }
        }
        if (ok && segs.length === wantColors) {
          var sol = {};
          for (var si = 0; si < segs.length; si++) sol[COL_KEYS[si]] = segs[si];
          return { n: n, sol: sol };
        }
      }
      return LEVELS[(lvNum - 1) % LEVELS.length];
    }

    var cv = makeCanvas(1), ctx = cv.ctx, W = cv.w, DPR = cv.c.width / W;
    var lvNum = 1;
    try { lvNum = Math.max(1, parseInt(localStorage.getItem("off_flow_level") || "1", 10) || 1); } catch (e) {}
    var N = 5, cell = W / 5, curSol = {}, paths = {}, endpoints = {}, activeColor = null, pointer = null, particles = [], won = false, clock = 0, lastT = performance.now();

    function saveFlowLv() { try { localStorage.setItem("off_flow_level", String(lvNum)); } catch (e) {} }
    var bgCv = document.createElement("canvas"); bgCv.width = cv.c.width; bgCv.height = cv.c.height;
    function bakeBoardBg() {
      var b = bgCv.getContext("2d"); b.setTransform(DPR, 0, 0, DPR, 0, 0);
      var g = b.createLinearGradient(0, 0, 0, W);
      g.addColorStop(0, "#0b1e1b"); g.addColorStop(0.5, "#112824"); g.addColorStop(1, "#0d1b26");

      for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) {

        b.beginPath(); b.roundRect(c * cell + 2, r * cell + 2, cell - 4, cell - 4, 8); b.fill();
        b.strokeStyle = "rgba(110,231,183,0.12)"; b.lineWidth = 1; b.stroke();
      }
    }

    function loadLevel(num) {
      lvNum = Math.max(1, num);
      saveFlowLv();
      var lv = lvNum <= LEVELS.length ? LEVELS[lvNum - 1] : genFlowLevel(lvNum);
      N = lv.n; cell = W / N; curSol = lv.sol;
      paths = {}; endpoints = {}; activeColor = null; pointer = null; particles = []; won = false;
      Object.keys(curSol).forEach(function(col){
        var s = curSol[col];
        paths[col] = [];
        endpoints[col] = [s[0], s[s.length - 1]];
      });
      bakeBoardBg();
      updateHud();
    }
    function isEndpoint(r, c) {
      var keys = Object.keys(endpoints);
      for (var i=0;i<keys.length;i++) {
        var ep = endpoints[keys[i]];
        if ((ep[0][0]===r&&ep[0][1]===c)||(ep[1][0]===r&&ep[1][1]===c)) return keys[i];
      }
      return null;
    }
    function isConnected(col) {
      var p = paths[col], ep = endpoints[col];
      if (!p || p.length < 2) return false;
      var a = p[0], b = p[p.length-1];
      return ((a[0]===ep[0][0]&&a[1]===ep[0][1]&&b[0]===ep[1][0]&&b[1]===ep[1][1]) ||
              (a[0]===ep[1][0]&&a[1]===ep[1][1]&&b[0]===ep[0][0]&&b[1]===ep[0][1]));
    }
    function updateHud() {
      var keys = Object.keys(endpoints), done = 0, occ = {};
      keys.forEach(function(k){
        if (isConnected(k)) done++;
        paths[k].forEach(function(pt){ occ[pt[0]+","+pt[1]] = 1; });
        endpoints[k].forEach(function(pt){ occ[pt[0]+","+pt[1]] = 1; });
      });
      var cover = Math.round((Object.keys(occ).length / (N*N)) * 100);
      hudSt.textContent = "Màn " + lvNum + " (Vô tận) • " + done + "/" + keys.length + " hoa • Phủ " + cover + "%";
      if (!won && done === keys.length && cover === 100) {
        won = true; sfx(720, 0.2, "triangle"); vib(20);
        for (var i=0;i<28;i++) particles.push({x:W/2,y:W/2,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7,col:COLORS[keys[i%keys.length]].main,life:1});

        setTimeout(function(){

            nextLabel: "🌸 Màn " + (finished + 1),
            onNext: function(){ loadLevel(finished + 1); },
            onRetry: function(){ loadLevel(finished); }
          });
        }, 520);
      }
    }
    function cellAt(e) {
      var rect = cv.c.getBoundingClientRect();
      var x = (e.clientX - rect.left) * (W / rect.width), y = (e.clientY - rect.top) * (W / rect.height);
      pointer = { x:x, y:y };
      var c = Math.floor(x / cell), r = Math.floor(y / cell);
      if (r<0||c<0||r>=N||c>=N) return null;
      return [r, c];
    }
    function cutOtherPath(col, r, c) {
      Object.keys(paths).forEach(function(k){
        if (k === col) return;
        var p = paths[k];
        for (var i=0;i<p.length;i++) {
          if (p[i][0]===r && p[i][1]===c) { paths[k] = p.slice(0, i); break; }
        }

    }

    cv.c.addEventListener("pointerdown", function(e){
      if (won) return;
      var pt = cellAt(e); if (!pt) return;
      var r = pt[0], c = pt[1], epCol = isEndpoint(r, c);
      if (epCol) {
        activeColor = epCol; paths[epCol] = [[r, c]]; sfx(400, 0.05); updateHud(); return;
      }
      var keys = Object.keys(paths);
      for (var i=0;i<keys.length;i++) {
        var k = keys[i], p = paths[k];
        for (var j=0;j<p.length;j++) {
          if (p[j][0]===r && p[j][1]===c) {
            activeColor = k; paths[k] = p.slice(0, j+1); sfx(360, 0.04); updateHud(); return;
          }
        }
      }
    });
    cv.c.addEventListener("pointermove", function(e){
      if (!activeColor || won) return;
      var pt = cellAt(e); if (!pt) return;

      if (!p.length) return;
      var last = p[p.length - 1];
      if (last[0]===r && last[1]===c) return;
      if (Math.abs(last[0]-r) + Math.abs(last[1]-c) !== 1) return;
      var epCol = isEndpoint(r, c);
      if (epCol && epCol !== activeColor) return;
      for (var i=0;i<p.length;i++) {
        if (p[i][0]===r && p[i][1]===c) { paths[activeColor] = p.slice(0, i+1); updateHud(); return; }
      }
      if (isConnected(activeColor)) return;
      cutOtherPath(activeColor, r, c);
      p.push([r, c]);
      if (isConnected(activeColor)) {
        sfx(620, 0.1, "triangle"); vib(12);
        var cxp = (c + 0.5)*cell, cyp = (r + 0.5)*cell;
        for (var bi=0;bi<10;bi++) particles.push({x:cxp,y:cyp,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,col:COLORS[activeColor].main,life:1});
      } else sfx(440 + p.length*15, 0.03);
      updateHud();
    });
    cv.c.addEventListener("pointerup", function(){ activeColor = null; pointer = null; });
    cv.c.addEventListener("pointercancel", function(){ activeColor = null; pointer = null; });

    function loop(now) {
      var dt = Math.min(0.05, Math.max(0, ((now || performance.now()) - lastT) / 1000)); lastT = now || performance.now();
      clock += dt;
      ctx.clearRect(0, 0, W, W);
      ctx.drawImage(bgCv, 0, 0, W, W);

      // Luminous garden nectar glow under paths
      Object.keys(paths).forEach(function(col){
        var p = paths[col]; if (!p.length) return;
        ctx.fillStyle = COLORS[col].bg;
        p.forEach(function(pt){
          ctx.beginPath(); ctx.roundRect(pt[1]*cell + 2, pt[0]*cell + 2, cell - 4, cell - 4, 8); ctx.fill();
        });
      });

      // Glowing Vine / Light-Stream Paths
      Object.keys(paths).forEach(function(col){
        var p = paths[col]; if (p.length < 2) return;
        var conn = isConnected(col);
        ctx.save();
        ctx.lineCap = "round"; ctx.lineJoin = "round";
        ctx.shadowColor = COLORS[col].glow;
        ctx.shadowBlur = conn ? 16 : 9;
        ctx.strokeStyle = COLORS[col].main;
        ctx.lineWidth = cell * 0.28;
        ctx.beginPath();
        p.forEach(function(pt, idx){
          var cx = (pt[1]+0.5)*cell, cy = (pt[0]+0.5)*cell;
          if (idx===0) ctx.moveTo(cx, cy); else ctx.lineTo(cx, cy);
        });
        ctx.stroke();

        // Inner bright light core
        ctx.shadowBlur = 0;
        ctx.strokeStyle = "rgba(255,255,255," + (conn ? "0.75" : "0.42") + ")";
        ctx.lineWidth = cell * 0.09;
        ctx.stroke();
        ctx.restore();

        // Traveling pollen light pulse on connected vines
        if (conn) {
          var tPos = (clock * 1.6) % 1;
          var segF = tPos * (p.length - 1);
          var si = Math.min(p.length - 2, Math.floor(segF)), frac = segF - si;
          var lx = (p[si][1] + (p[si+1][1]-p[si][1])*frac + 0.5) * cell;
          var ly = (p[si][0] + (p[si+1][0]-p[si][0])*frac + 0.5) * cell;
          ctx.fillStyle = "#ffffff";
          ctx.beginPath(); ctx.arc(lx, ly, cell*0.09, 0, Math.PI*2); ctx.fill();
        }
      });

      // 3D Glowing Flower Endpoints
      Object.keys(endpoints).forEach(function(col, ci){
        var ep = endpoints[col], conn = isConnected(col);
        ep.forEach(function(pt, ei){
          var cx = (pt[1]+0.5)*cell, cy = (pt[0]+0.5)*cell;
          var breath = 1 + 0.06 * Math.sin(clock * 3.2 + ci + ei);

    var bar = document.createElement("div"); bar.className = "controls-bar";
    bar.appendChild(mkBtn("⏮", "btn-ico", function(){ loadLevel(Math.max(1, lvNum - 1)); }));

    bar.appendChild(mkBtn("⏭", "btn-ico", function(){ loadLevel(lvNum + 1); }));

  /* ==================== 2. XẾP HOA PHA LÊ 3D (VÔ TẬN • HOA 3D PHÁT SÁNG • 60FPS) ==================== */
  function startSort() {
    hdrTitle.textContent = "Xếp Hoa Pha Lê";
    var cv = makeCanvas(1.26), ctx = cv.ctx, W = cv.w, H = cv.h, DPR = cv.c.width / W;
    var PAL = [
      "#ef4444", // Vivid Red
      "#facc15", // Sunny Yellow
      "#4ea8de", // Sky Blue
      "#84cc16", // Lime Green
      "#b388eb", // Lavender Purple
      "#ff9f1c", // Peach Orange
      "#48cae4", // Aqua Bubble
      "#ff85a1", // Cotton Candy
      "#aacc00", // Apple Green
      "#e2e8f0"  // Pearl White
    ];
    var NUT_W = 60, NUT_H = 21, TILT = 0.36;
    var level = 1;
    try { level = Math.max(1, parseInt(localStorage.getItem("off_nuts_level") || "1", 10) || 1); } catch (e) {}
    var CAP = 4, bolts = [], sel = -1, history = [], extraUsed = false, ended = false, pendingCheck = false;
    var particles = [], doneFx = {}, shake = {}, L = null, boltSp = null, shaftSp = null, lastT = performance.now();

    function saveLevel() { try { localStorage.setItem("off_nuts_level", String(level)); } catch (e) {} }
    function easeOutBack(t) { var c1 = 1.70158, c3 = c1 + 1; return 1 + c3*Math.pow(t - 1, 3) + c1*Math.pow(t - 1, 2); }
    function shuffle(a) { for (var i=a.length-1;i>0;i--) { var j=(Math.random()*(i+1))|0, t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

    function rgbMod(hex, amt) {
      var n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
      var t = amt < 0 ? 0 : 255, p = Math.min(1, Math.abs(amt));
      return "rgb(" + Math.round(r + (t - r)*p) + "," + Math.round(g + (t - g)*p) + "," + Math.round(b + (t - b)*p) + ")";
    }

    // Enchanted Botanical Garden Twilight Backdrop
    var bgCv = document.createElement("canvas"); bgCv.width = cv.c.width; bgCv.height = cv.c.height;
    (function(){
      var b = bgCv.getContext("2d"); b.setTransform(DPR, 0, 0, DPR, 0, 0);
      b.save(); b.beginPath(); b.roundRect(0, 0, W, H, 20); b.clip();
      var rg = b.createRadialGradient(W*0.5, H*0.36, W*0.05, W*0.5, H*0.5, Math.max(W, H)*0.78);
      rg.addColorStop(0, "#174238"); rg.addColorStop(0.55, "#0d2621"); rg.addColorStop(1, "#071418");
      b.fillStyle = rg; b.fillRect(0, 0, W, H);
      for (var fi = 0; fi < 16; fi++) {
        b.fillStyle = "rgba(167,243,208,0.09)";
        b.beginPath(); b.arc(((fi*73)%97)/97*W, ((fi*53)%89)/89*H, 6 + (fi%4)*4, 0, Math.PI*2); b.fill();
      }
      b.restore();
    })();

    // Pre-render 3D Terracotta Garden Pots + Living Emerald Plant Stems & Buds (with isolated stem sprite for occlusion)
    function buildBoltSprites(sc) {
      var sw = 72*sc, shH = (CAP*NUT_H + 18)*sc, hh = shH + 28*sc;
      var cx = sw/2, by = shH + 12*sc, top = by - shH, r = 9.0*sc;

      function drawShaftOnly(b, withLeaves) {
        var sg = b.createLinearGradient(cx - r, 0, cx + r, 0);
        sg.addColorStop(0, "#14532d"); sg.addColorStop(0.26, "#4ade80"); sg.addColorStop(0.46, "#bbf7d0");
        sg.addColorStop(0.74, "#16a34a"); sg.addColorStop(1, "#052e16");
        b.fillStyle = sg;
        b.beginPath(); b.roundRect(cx - r*0.86, top + 5*sc, r*1.72, shH - 4*sc, [r*0.7, r*0.7, 0, 0]); b.fill();

        // Natural botanical node rings & veins
        b.save(); b.beginPath(); b.roundRect(cx - r*0.86, top + 5*sc, r*1.72, shH - 4*sc, [r*0.7, r*0.7, 0, 0]); b.clip();
        var step = 11*sc;
        for (var ty = by - 6*sc; ty > top + 12*sc; ty -= step) {
          b.strokeStyle = "rgba(5,46,22,.45)"; b.lineWidth = 1.4*sc;
          b.beginPath(); b.moveTo(cx - r, ty); b.quadraticCurveTo(cx, ty + 2*sc, cx + r, ty); b.stroke();
          b.strokeStyle = "rgba(220,252,231,.42)"; b.lineWidth = 0.9*sc;
          b.beginPath(); b.moveTo(cx - r, ty + 1.5*sc); b.quadraticCurveTo(cx, ty + 3.4*sc, cx + r, ty + 1.5*sc); b.stroke();
        }
        b.restore();

        // Living side leaf sprouts (only on backing full stem, cleanly outside pass-through hole sprite)
        if (withLeaves) {
          [-1, 1].forEach(function(dir, idx){
            var ly = by - (8 + idx * 7) * sc;
            b.save(); b.translate(cx + dir * r * 0.7, ly); b.rotate(dir * -0.45);
            b.beginPath();
            b.moveTo(0, 0);
            b.quadraticCurveTo(dir * 11*sc, -7*sc, dir * 18*sc, -2*sc);
            b.quadraticCurveTo(dir * 10*sc, 5*sc, 0, 0);
            var lg = b.createLinearGradient(0, -4*sc, dir * 18*sc, 2*sc);
            lg.addColorStop(0, "#15803d"); lg.addColorStop(1, "#86efac");
            b.fillStyle = lg; b.fill();
            b.strokeStyle = "rgba(255,255,255,.35)"; b.lineWidth = 0.8*sc; b.stroke();
            b.restore();
          });
        }

        // Cute glowing green flower calyx bud at tip
        var tg = b.createRadialGradient(cx - r*0.25, top + 4*sc, 1, cx, top + 6*sc, r*1.1);
        tg.addColorStop(0, "#fef9c3"); tg.addColorStop(0.55, "#4ade80"); tg.addColorStop(1, "#15803d");
        b.fillStyle = tg; b.beginPath(); b.ellipse(cx, top + 6*sc, r*0.95, r*TILT*1.15, 0, 0, Math.PI*2); b.fill();
        b.strokeStyle = "rgba(255,255,255,.6)"; b.lineWidth = 0.9*sc; b.stroke();
      }

      var cFull = document.createElement("canvas"); cFull.width = Math.ceil(sw*DPR); cFull.height = Math.ceil(hh*DPR);
      var bf = cFull.getContext("2d"); bf.setTransform(DPR, 0, 0, DPR, 0, 0);
      // Soft garden shadow under pot
      var shG = bf.createRadialGradient(cx, by + 5*sc, 4*sc, cx, by + 5*sc, 34*sc);
      shG.addColorStop(0, "rgba(0,0,0,.62)"); shG.addColorStop(1, "rgba(0,0,0,0)");
      bf.fillStyle = shG; bf.beginPath(); bf.ellipse(cx, by + 6*sc, 34*sc, 13*sc, 0, 0, Math.PI*2); bf.fill();
      // Tapered terracotta / moss garden pot base
      var potB = bf.createLinearGradient(cx - 28*sc, 0, cx + 28*sc, 0);
      potB.addColorStop(0, "#7c2d12"); potB.addColorStop(0.32, "#ea580c"); potB.addColorStop(0.68, "#c2410c"); potB.addColorStop(1, "#431407");
      bf.fillStyle = potB;
      bf.beginPath(); bf.ellipse(cx, by + 4.5*sc, 26*sc, 10*sc, 0, 0, Math.PI*2); bf.fill();
      var potRim = bf.createLinearGradient(cx - 28*sc, by - 8*sc, cx + 28*sc, by + 8*sc);
      potRim.addColorStop(0, "#fb923c"); potRim.addColorStop(0.45, "#fdba74"); potRim.addColorStop(1, "#9a3412");
      bf.fillStyle = potRim;
      bf.beginPath(); bf.ellipse(cx, by, 28*sc, 9.8*sc, 0, 0, Math.PI*2); bf.fill();
      bf.strokeStyle = "rgba(255,237,213,.55)"; bf.lineWidth = 1*sc; bf.stroke();
      // Rich garden soil & emerald moss inside pot
      bf.fillStyle = "#3f2314";
      bf.beginPath(); bf.ellipse(cx, by, 22*sc, 6.8*sc, 0, 0, Math.PI*2); bf.fill();
      bf.fillStyle = "rgba(74,222,128,.38)";
      bf.beginPath(); bf.ellipse(cx - 6*sc, by + 1*sc, 10*sc, 3.2*sc, 0.2, 0, Math.PI*2); bf.fill();
      drawShaftOnly(bf, true);

      var cShaft = document.createElement("canvas"); cShaft.width = Math.ceil(sw*DPR); cShaft.height = Math.ceil(hh*DPR);
      var bs = cShaft.getContext("2d"); bs.setTransform(DPR, 0, 0, DPR, 0, 0);
      drawShaftOnly(bs, false);

      boltSp = { c: cFull, w: sw, h: hh, ax: cx, ay: by, topOffset: by - (top + 3*sc), r: r };
      shaftSp = { c: cShaft, w: sw, h: hh, ax: cx, ay: by };
    }

    function slotY(b, i) { return L.pos[b].y - 3*L.sc - i*(NUT_H - 1.5)*L.sc; }
    function liftY(b) { return L.pos[b].y - (CAP*NUT_H + 34)*L.sc; }

    function computeLayout() {
      var n = bolts.length, perRow = n <= 5 ? n : Math.ceil(n / (n <= 10 ? 2 : 3)), rows = Math.ceil(n / perRow);
      var above = CAP*NUT_H + 36 + NUT_W*TILT + 8, unitH = above + 24;
      var sc = Math.min(1.1, (W - 16) / (perRow * 74), (H - 16) / (rows * unitH));
      var rowH = H / rows, pos = [];
      for (var r=0;r<rows;r++) {
        var inRow = Math.min(perRow, n - r*perRow), step = (W - 12) / inRow, baseY = r*rowH + (rowH - unitH*sc)/2 + above*sc;
        for (var c=0;c<inRow;c++) pos.push({ x: 6 + step*(c + 0.5), y: baseY });
      }
      L = { sc: sc, pos: pos };
      buildBoltSprites(sc);
      buildNutSprites(sc);
      bolts.forEach(function(arr){ arr.forEach(function(nut){
        if (nut.fly) { nut.fly.xb = pos[nut.fly.to].x; nut.fly.yb = liftY(nut.fly.to); nut.fly.y1 = slotY(nut.fly.to, nut.fly.slot); }
      }); });
    }

    var nutSp = [];
    function buildNutSprites(sc) {
      nutSp = [];
      var R = NUT_W*sc*0.54, h = NUT_H*sc*0.82, sw = R*2 + 18, sh = h + R*TILT*2 + 18;
      var cx = sw/2, yt = R*TILT + 9, yb = yt + h;
      for (var ci=0; ci<PAL.length; ci++) {
        var spF = FLOWER_SPECIES[ci % FLOWER_SPECIES.length];
        var flSpr = getFlowerSprite(ci, R * 1.9);
        var c = document.createElement("canvas");
        c.width = Math.ceil(sw*DPR); c.height = Math.ceil(sh*DPR);
        var b = c.getContext("2d"); b.setTransform(DPR, 0, 0, DPR, 0, 0);
        // Glowing 3D Flower Blossom Disc in isometric stack view
        var sideG = b.createLinearGradient(cx - R, 0, cx + R, 0);
        sideG.addColorStop(0, spF.dark); sideG.addColorStop(0.32, spF.light);
        sideG.addColorStop(0.65, spF.main); sideG.addColorStop(1, spF.dark);
        b.fillStyle = sideG;
        b.beginPath(); b.ellipse(cx, yb, R, R*TILT, 0, 0, Math.PI); b.lineTo(cx - R, yt);
        b.ellipse(cx, yt, R, R*TILT, 0, Math.PI, 0, true); b.closePath(); b.fill();

        // Top 3D Flower Canopy projected into isometric ellipse
        b.save();
        b.translate(cx, yt);
        b.scale(1, TILT * 1.15);
        b.drawImage(flSpr.c, -flSpr.tot * 0.5, -flSpr.tot * 0.5, flSpr.tot, flSpr.tot);
        b.restore();

        // Center stem bore so crystal stem passes cleanly through
        var hr = R*0.32;
        b.fillStyle = "#081716";
        b.beginPath(); b.ellipse(cx, yt, hr, hr*TILT, 0, 0, Math.PI*2); b.fill();
        b.strokeStyle = "rgba(255,255,255,.55)"; b.lineWidth = 0.9*sc; b.stroke();

        nutSp.push({ c: c, w: sw, h: sh, ax: cx, ay: yb, R: R, hr: hr, ytOff: yb - yt });
      }
    }

    function drawNut(x, yb, sc, ci, rot, boltX, boltBaseY, shadow) {
      var sp = nutSp[ci]; if (!sp) return;
      if (shadow) {
        ctx.fillStyle = "rgba(0,0,0,.32)";
        ctx.beginPath(); ctx.ellipse(x, yb + 2*sc, sp.R*0.98, sp.R*TILT*1.04, 0, 0, Math.PI*2); ctx.fill();
      }
      ctx.drawImage(sp.c, x - sp.ax, yb - sp.ay, sp.w, sp.h);
      if (boltBaseY != null && shaftSp) {
        var yt = yb - sp.ytOff, boltTopY = boltBaseY - boltSp.topOffset;
        if (yt > boltTopY + 1) {
          ctx.save();
          ctx.beginPath();
          ctx.rect(boltX - boltSp.r - 2, boltTopY - 6*sc, boltSp.r*2 + 4, yt - (boltTopY - 6*sc));
          ctx.ellipse(x, yt, sp.hr*0.94, sp.hr*TILT*0.94, 0, 0, Math.PI);
          ctx.clip();
          ctx.drawImage(shaftSp.c, boltX - shaftSp.ax, boltBaseY - shaftSp.ay, shaftSp.w, shaftSp.h);
          ctx.restore();
        }
      }
    }

    function topNut(b) { var a = bolts[b]; return a[a.length - 1]; }
    function isUniform(b) { var a = bolts[b]; return a.every(function(n){ return n.c === a[0].c; }); }
    function isDone(b) { return bolts[b].length === CAP && isUniform(b); }
    function isSolved() { return bolts.every(function(a, b){ return !a.length || isDone(b); }); }
    function canMove(a, b) {
      if (a === b || !bolts[a].length || isDone(a) || bolts[b].length >= CAP) return false;
      return !bolts[b].length || topNut(b).c === topNut(a).c;
    }
    function hasMove() {
      for (var i=0;i<bolts.length;i++) for (var j=0;j<bolts.length;j++) {
        if (canMove(i, j) && !(bolts[j].length === 0 && isUniform(i))) return true;
      }
      return false;
    }
    function anyFlying() { return bolts.some(function(a){ return a.some(function(n){ return n.fly; }); }); }

    function startFly(nut, from, to, slot, k) {
      var x0 = nut.px != null ? nut.px : L.pos[from].x, y0 = nut.py != null ? nut.py : liftY(from);
      var xa = L.pos[from].x, ya = liftY(from), xb = L.pos[to].x, yb = liftY(to), dx = Math.abs(xb - xa);
      nut.intro = 1;
      nut.fly = { t: -k*0.09, dur: 0.44 + Math.min(0.24, Math.hypot(xb - xa, yb - ya) / W * 0.28),
        x0: x0, y0: y0, xa: xa, ya: ya, xb: xb, yb: yb, y1: slotY(to, slot), from: from, to: to, slot: slot,
        arc: Math.min(38*L.sc, 12*L.sc + dx*0.12) };
    }
    function transfer(from, to, count) {
      var src = bolts[from], dst = bolts[to], col = src[src.length - 1].c, moved = [];
      while (src.length && dst.length + moved.length < CAP) {
        if (count == null ? src[src.length - 1].c !== col : moved.length >= count) break;
        moved.push(src.pop());
      }
      var base = dst.length;
      moved.forEach(function(nut, k){ dst.push(nut); startFly(nut, from, to, base + k, k); });
      return moved.length;
    }

    function confetti(x, y, n) {
      for (var i=0;i<n;i++) {
        var a = Math.random()*Math.PI*2, s = 2 + Math.random()*4.5;
        particles.push({ x: x, y: y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 3, rot: Math.random()*6, vr: (Math.random() - 0.5)*0.4, col: PAL[(Math.random()*PAL.length)|0], life: 1 });
      }
    }
    function onLand(b) {
      if (bolts[b].some(function(n){ return n.fly; })) return;
      if (isDone(b) && doneFx[b] == null) { doneFx[b] = 0; sfx(760, 0.14, "triangle"); vib(14); confetti(L.pos[b].x, liftY(b), 18); }
    }

    function addBolt() {
      if (extraUsed || ended) return;
      extraUsed = true; bolts.push([]); computeLayout(); sfx(520, 0.1, "triangle"); vib(10);
    }
    function undo() {
      if (ended) return;
      var h = history.pop(); if (!h) return;
      sel = -1; transfer(h.to, h.from, h.count); pendingCheck = true; sfx(340, 0.05);
    }

    function evaluate() {
      if (isSolved()) {
        ended = true; sel = -1;
        sfx(880, 0.25, "triangle"); vib(30);
        for (var i=0;i<4;i++) confetti(W*(0.2 + 0.2*i), H*0.3, 22);
        var done = level; level++; saveLevel();
        hudSt.textContent = "Hoàn thành màn " + done + "! 🌸";
        setTimeout(function(){
          showResultModal({
            win: true, title: "Hoàn thành màn " + done + "!", desc: "Tuyệt vời! Vườn hoa màn " + level + " đang chờ bạn (vô tận).",
            nextLabel: "🌸 Màn " + level, onNext: init,
            retryLabel: "🔄 Chơi lại màn " + done, onRetry: function(){ level = done; saveLevel(); init(); }
          });
        }, 720);
      } else if (!hasMove()) {
        sfx(200, 0.22, "sawtooth");
        showResultModal({
          win: false, title: "Hết nước đi!", desc: "Không còn bình hoa nào có thể chuyển ở màn " + level + ".",
          nextLabel: extraUsed ? "↩ Hoàn tác 1 bước" : "➕ Thêm 1 bình cứu nguy",
          onNext: extraUsed ? undo : addBolt, onRetry: init
        });
      }
    }

    function tap(i) {
      if (ended) return;
      if (sel < 0) {
        if (!bolts[i].length || isDone(i)) { shake[i] = 1; sfx(190, 0.06, "sawtooth"); return; }
        sel = i; sfx(440, 0.05); vib(6); return;
      }
      if (sel === i) { sel = -1; sfx(320, 0.04); return; }
      if (canMove(sel, i)) {
        var from = sel; sel = -1;
        history.push({ from: from, to: i, count: transfer(from, i, null) });
        sfx(560, 0.06); vib(8); pendingCheck = true;
      } else if (bolts[i].length && !isDone(i)) {
        sel = i; sfx(400, 0.04);
      } else {
        shake[i] = 1; sel = -1; sfx(180, 0.08, "sawtooth"); vib(15);
      }
    }

    cv.c.addEventListener("pointerdown", function(e){
      if (ended || !L) return;
      var rect = cv.c.getBoundingClientRect(), x = (e.clientX - rect.left)*(W/rect.width), y = (e.clientY - rect.top)*(H/rect.height);
      var best = -1, bd = 1e9, sc = L.sc;
      for (var i=0;i<L.pos.length;i++) {
        var p = L.pos[i], dx = Math.abs(x - p.x);
        if (dx < 38*sc && y > liftY(i) - 30*sc && y < p.y + 16*sc && dx < bd) { bd = dx; best = i; }
      }
      if (best >= 0) tap(best);
    });

    function updFly(nut, dt) {
      var f = nut.fly, sc = L.sc, x, y, spin = 0, t;
      f.t += dt / f.dur; t = f.t;
      if (t <= 0) { x = f.x0; y = f.y0; }
      else if (t < 0.24) { var u = t/0.24, e = 1 - Math.pow(1 - u, 3); x = f.x0 + (f.xa - f.x0)*e; y = f.y0 + (f.ya - f.y0)*e; spin = 15; }
      else if (t < 0.62) { var u2 = (t - 0.24)/0.38, e2 = u2 < 0.5 ? 2*u2*u2 : 1 - Math.pow(-2*u2 + 2, 2)/2; x = f.xa + (f.xb - f.xa)*e2; y = f.ya + (f.yb - f.ya)*e2 - Math.sin(u2*Math.PI)*f.arc; spin = 4; }
      else if (t < 1) { var u3 = (t - 0.62)/0.38, e3 = u3*u3*(3 - 2*u3); x = f.xb; y = f.yb + (f.y1 - f.yb)*e3; spin = -15; }
      else { x = f.xb; y = f.y1; }
      nut.rot += spin*dt; nut.px = x; nut.py = y;
      var bIdx = t < 0.24 ? f.from : (t >= 0.62 ? f.to : -1);

    const CANDY_COLORS = [

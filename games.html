<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Love Story • Offline Games</title>
<style>
  :root{
    --bg:#fdf0f4;--card-bg:#ffffff;--ink:#1c1e21;--muted:#65676b;
    --pink:#ff3b6f;--pink2:#ff1e56;--border:#e4e6eb;--border-light:#f0f2f5;
    --grad:linear-gradient(45deg,#ffa0b8 0%,#ff8aa6 25%,#ff3b6f 50%,#ff5c88 75%,#ff758c 100%);
    --ux-ease:cubic-bezier(.2,.8,.2,1);--ux-spring:cubic-bezier(.34,1.45,.64,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:'Roboto',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:radial-gradient(circle at 18% 0%,#ffe5ee 0%,var(--bg) 55%,#f8f9fc 100%);
    color:var(--ink);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;
  }
  .hidden{display:none!important}

  /* LUCIANLAB BUTTONS (SYNCED WITH MAIN APP) */
  button{
    border:0;font-family:inherit;cursor:pointer;position:relative;overflow:hidden;
    transition:transform .22s var(--ux-spring),box-shadow .2s var(--ux-ease),background .18s var(--ux-ease),opacity .18s;
  }
  button:active{transform:scale(.93)}

  .btn-3d{
    padding:14px 20px;border-radius:24px;font-size:15px;font-weight:700;color:#fff;width:100%;
    background:var(--grad);background-size:160% 160%;
    box-shadow:0 8px 22px rgba(255,59,111,.32),inset 0 1px 0 rgba(255,255,255,.35);
  }
  .btn-3d:active{box-shadow:0 3px 10px rgba(255,59,111,.25)}

  .btn-3d-light{
    padding:13px 20px;border-radius:24px;font-size:14.5px;font-weight:600;color:var(--ink);width:100%;
    background:rgba(255,255,255,.88);backdrop-filter:blur(16px);
    border:1px solid rgba(0,0,0,.08);box-shadow:0 4px 14px rgba(0,0,0,.06);
  }

  .btn-pill{
    padding:7px 13px;border-radius:20px;font-size:12.5px;font-weight:600;color:var(--ink);
    background:rgba(255,255,255,.86);backdrop-filter:blur(12px);
    border:1px solid rgba(0,0,0,.08);box-shadow:0 2px 8px rgba(0,0,0,.05);
    display:inline-flex;align-items:center;gap:5px;
  }
  .btn-pill.pri{
    color:#fff;border-color:transparent;background:var(--pink);
    box-shadow:0 4px 12px rgba(255,59,111,.28),inset 0 1px 0 rgba(255,255,255,.3);
  }
  .btn-pill.vio{
    color:var(--pink);border-color:rgba(255,59,111,.24);background:rgba(255,59,111,.08);box-shadow:none;
  }
  .btn-ico{
    width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
    font-size:15px;background:rgba(255,255,255,.86);backdrop-filter:blur(12px);
    border:1px solid rgba(0,0,0,.08);box-shadow:0 2px 8px rgba(0,0,0,.05);color:var(--ink);
  }

  /* OFFLINE GATE (2 BUTTONS ONLY) */
  .gate{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeUp .38s var(--ux-ease)}
  .gate-card{
    width:100%;max-width:340px;background:rgba(255,255,255,.84);-webkit-backdrop-filter:blur(20px) saturate(180%);
    backdrop-filter:blur(20px) saturate(180%);border:1px solid rgba(255,255,255,.65);
    border-radius:28px;padding:30px 24px;text-align:center;
    box-shadow:0 16px 44px rgba(255,59,111,.12),0 4px 16px rgba(0,0,0,.06);
    display:flex;flex-direction:column;align-items:center;gap:14px;
  }
  .gate-ico{
    width:72px;height:72px;border-radius:50%;background:var(--grad);
    display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff;
    box-shadow:0 10px 24px rgba(255,59,111,.3);animation:floatY 3s ease-in-out infinite;
  }
  .gate h1{font-size:20px;font-weight:800;letter-spacing:-.3px}
  .gate p{font-size:13.5px;color:var(--muted);line-height:1.5}
  .gate-btns{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:6px}

  /* HEADER */
  header{
    display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;
    background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(20px) saturate(180%);
    backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid rgba(0,0,0,.06);flex-shrink:0;
  }
  .brand{display:flex;align-items:center;gap:8px;min-width:0}
  .pill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;background:rgba(255,59,111,.12);color:var(--pink)}
  .htitle{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hbtns{display:flex;gap:7px;align-items:center}

  main{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;align-items:center}

  /* MENU */
  .menu-wrap{width:100%;max-width:450px;display:grid;grid-template-columns:1fr 1fr;gap:12px;animation:fadeUp .28s var(--ux-ease)}
  .gcard{
    background:var(--card-bg);border:1px solid var(--border-light);border-radius:18px;padding:15px 13px;
    box-shadow:0 4px 16px rgba(0,0,0,.05);display:flex;flex-direction:column;gap:6px;text-align:left;
  }
  .gcard:active{transform:scale(.96)}
  .gcard .ico{
    width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;
    font-size:23px;margin-bottom:2px;
  }
  .gcard .name{font-size:14px;font-weight:800;color:var(--ink)}
  .gcard .desc{font-size:11.5px;color:var(--muted);line-height:1.38}
  .gcard .tag{align-self:flex-start;margin-top:3px;font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px;background:rgba(255,59,111,.1);color:var(--pink)}

  /* GAME SHELL */
  .game-wrap{width:100%;max-width:440px;display:flex;flex-direction:column;gap:10px;align-items:center;animation:fadeUp .26s var(--ux-ease)}
  .hud{
    width:100%;background:rgba(255,255,255,.88);backdrop-filter:blur(16px);
    border:1px solid rgba(0,0,0,.06);border-radius:18px;padding:10px 12px;
    display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;
    box-shadow:0 4px 14px rgba(0,0,0,.05);
  }
  .hud-st{font-size:13px;font-weight:800;color:var(--ink)}
  .hud-bt{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .board{
    width:100%;background:var(--card-bg);border:1px solid var(--border-light);border-radius:20px;padding:10px;
    box-shadow:0 8px 26px rgba(0,0,0,.06);
    display:flex;flex-direction:column;align-items:center;gap:10px;
  }
  canvas.gcanvas{width:100%;display:block;border-radius:14px;touch-action:none}
  .controls-bar{display:flex;justify-content:center;align-items:center;gap:8px;width:100%;padding:2px 0 4px}

  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .res-ov{
    position:fixed;inset:0;z-index:200;background:rgba(15,10,18,.52);backdrop-filter:blur(8px);
    display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeUp .2s var(--ux-ease);
  }
  .res-ov.hidden{display:none}
  .res-card{
    width:100%;max-width:340px;background:#fff;border-radius:24px;padding:22px 18px 18px;
    text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.28);border:1px solid var(--border-light);
    display:flex;flex-direction:column;align-items:center;gap:10px;
  }
  .res-ico{font-size:48px;line-height:1}
  .res-title{font-size:19px;font-weight:900;color:var(--ink)}
  .res-desc{font-size:13.5px;color:var(--muted);line-height:1.45}
  .res-btns{display:flex;flex-direction:column;gap:8px;width:100%;margin-top:6px}
  .res-btns .btn-pill{width:100%;padding:11px 14px;font-size:13.5px}
</style>
</head>
<body>

  <!-- MÀN HÌNH MẤT MẠNG: 2 NÚT CHƠI GAME & LOAD LẠI -->
  <section class="gate" id="view-gate">
    <div class="gate-card">
      <div class="gate-ico">📡</div>
      <h1>Mất kết nối mạng</h1>
      <p>Hiện chưa thể tải Love Story. Bạn có thể chơi bộ 6 game giải trí offline hoặc tải lại trang khi có mạng.</p>
      <div class="gate-btns">
        <button class="btn-3d" id="btn-open-games">🎮 Chơi game</button>
        <button class="btn-3d-light" id="btn-reload-gate">🔄 Load lại</button>
      </div>
    </div>
  </section>

  <!-- HEADER -->
  <header class="hidden" id="app-hdr">
    <div class="brand">
      <span class="pill">Offline</span>
      <span class="htitle" id="hdr-title">Bộ 6 Game Giải Trí</span>
    </div>
    <div class="hbtns">
      <button class="btn-ico" id="btn-sound" title="Âm thanh">🔊</button>
      <button class="btn-pill hidden" id="btn-menu">⬅ Menu</button>
      <button class="btn-pill pri" id="btn-reload-top">🏠 Về Love Story</button>
    </div>
  </header>

  <main class="hidden" id="app-main">
    <section class="menu-wrap" id="view-menu">
      <button class="gcard" data-game="flow">
        <div class="ico" style="background:#e8f4ff">🔗</div>
        <div class="name">Nối Màu Sắc</div>
        <div class="desc">Kéo nối các cặp chấm cùng màu phủ kín toàn bộ bảng.</div>
        <span class="tag">Giải đố mượt</span>
      </button>
      <button class="gcard" data-game="sort">
        <div class="ico" style="background:#eef3f9">🔩</div>
        <div class="name">Nuts &amp; Bolts</div>
        <div class="desc">Tháo lắp đai ốc màu sắc sang bu lông đúng màu cực mượt.</div>
        <span class="tag">Vô tận • 60fps</span>
      </button>
      <button class="gcard" data-game="candy">
        <div class="ico" style="background:#fff3e0">🍬</div>
        <div class="name">Kẹo Ngọt Saga</div>
        <div class="desc">Ghép 4 kẹo sọc, ô 2×2/L-T kẹo gói, 5 viên nổ Bom màu • Vô tận.</div>
        <span class="tag">Vô tận • Match-3</span>
      </button>
      <button class="gcard" data-game="blocks">
        <div class="ico" style="background:#ede7f6">🧱</div>
        <div class="name">Xếp Khối Màu</div>
        <div class="desc">Kéo thả khối gạch lên lưới 8×8, lấp đầy hàng là nổ.</div>
        <span class="tag">Kéo thả 60fps</span>
      </button>
      <button class="gcard" data-game="g2048">
        <div class="ico" style="background:#fce4ec">🔢</div>
        <div class="name">2048</div>
        <div class="desc">Vuốt 4 hướng trượt mượt gộp ô số chạm mốc 2048.</div>
        <span class="tag">Kinh điển</span>
      </button>
      <button class="gcard" data-game="caro">
        <div class="ico" style="background:#fff8e1">⭕</div>
        <div class="name">Cờ Caro 11×11</div>
        <div class="desc">Xếp 5 quân thẳng hàng, hỗ trợ đấu Máy hoặc 2 Người.</div>
        <span class="tag">1 hoặc 2 Người</span>
      </button>
      <button class="gcard" data-game="onet">
        <div class="ico" style="background:#fff9c4">⚡</div>
        <div class="name">Pikachu Onet</div>
        <div class="desc">Nối cặp hình giống nhau tối đa 3 đoạn thẳng • Vô hạn màn.</div>
        <span class="tag">3D Glass • Vô tận</span>
      </button>
      <button class="gcard" data-game="rush">
        <div class="ico" style="background:#dcfce7">🚗</div>
        <div class="name">Kẹt Xe (Rush Hour)</div>
        <div class="desc">Trượt xe mở đường đưa xe đỏ thoát khỏi bãi đỗ • Vô hạn màn.</div>
        <span class="tag">Trí tuệ • Vô tận</span>
      </button>
      <button class="gcard" data-game="maze">
        <div class="ico" style="background:#e0f7fa">🎨</div>
        <div class="name">Maze Paint</div>
        <div class="desc">Vuốt lăn bóng sơn kín toàn bộ mê cung • Vô hạn màn.</div>
        <span class="tag">3D Glass • Vô tận</span>
      </button>
    </section>

    <section class="game-wrap hidden" id="view-game">
      <div class="hud">
        <div class="hud-st" id="hud-st">Sẵn sàng</div>
        <div class="hud-bt" id="hud-bt"></div>
      </div>
      <div class="board" id="board"></div>
    </section>
  </main>

  <div class="res-ov hidden" id="res-modal">
    <div class="res-card">
      <div class="res-ico" id="res-ico">🏆</div>
      <div class="res-title" id="res-title">Hoàn thành!</div>
      <div class="res-desc" id="res-desc"></div>
      <div class="res-btns" id="res-btns"></div>
    </div>
  </div>

<script>
(function(){
  var gate = document.getElementById("view-gate");
  var hdr = document.getElementById("app-hdr");
  var main = document.getElementById("app-main");
  var viewMenu = document.getElementById("view-menu");
  var viewGame = document.getElementById("view-game");
  var hdrTitle = document.getElementById("hdr-title");
  var btnMenu = document.getElementById("btn-menu");
  var btnSound = document.getElementById("btn-sound");
  var hudSt = document.getElementById("hud-st");
  var hudBt = document.getElementById("hud-bt");
  var board = document.getElementById("board");

  var activeRaf = 0, activeKeyFn = null, soundOn = true, audioCtx = null;
  function stopRaf(){ if(activeRaf){ cancelAnimationFrame(activeRaf); activeRaf = 0; } if(activeKeyFn){ document.removeEventListener("keydown", activeKeyFn); activeKeyFn = null; } }

  function sfx(freq, dur, type) {
    if (!soundOn) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || "sine"; o.frequency.value = freq;
      g.gain.setValueAtTime(0.075, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (dur || 0.09));
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + (dur || 0.09));
    } catch (e) {}
  }
  function vib(ms) { try { if (navigator.vibrate) navigator.vibrate(ms || 10); } catch(e){} }

  btnSound.addEventListener("click", function(){
    soundOn = !soundOn; btnSound.textContent = soundOn ? "🔊" : "🔇";
  });

  function reloadOnline() {
    if (window.AndroidBridge && typeof window.AndroidBridge.retryOnline === "function") {
      window.AndroidBridge.retryOnline();
    } else {
      location.href = "https://29s6.github.io/ptan/";
    }
  }
  document.getElementById("btn-reload-gate").addEventListener("click", reloadOnline);
  document.getElementById("btn-reload-top").addEventListener("click", reloadOnline);
  // standalone games.html stays open online

  gate.classList.add("hidden"); hdr.classList.remove("hidden"); main.classList.remove("hidden");
  document.getElementById("btn-open-games").addEventListener("click", function(){
    gate.classList.add("hidden"); hdr.classList.remove("hidden"); main.classList.remove("hidden");
    sfx(540, 0.1);
  });

  var resModal = document.getElementById("res-modal");
  var resIco = document.getElementById("res-ico");
  var resTitle = document.getElementById("res-title");
  var resDesc = document.getElementById("res-desc");
  var resBtns = document.getElementById("res-btns");

  function hideResultModal() { resModal.classList.add("hidden"); }
  function showResultModal(opts) {
    resIco.textContent = opts.win ? "🏆" : "💥";
    resTitle.textContent = opts.title || (opts.win ? "Chiến thắng!" : "Thua rồi!");
    resDesc.textContent = opts.desc || "";
    resBtns.innerHTML = "";
    if (opts.onNext) {
      resBtns.appendChild(mkBtn(opts.nextLabel || "▶ Chơi tiếp", "btn-pill pri", function(){
        hideResultModal(); opts.onNext();
      }));
    }
    if (opts.onRetry) {
      resBtns.appendChild(mkBtn(opts.retryLabel || "🔄 Chơi lại", "btn-pill vio", function(){
        hideResultModal(); opts.onRetry();
      }));
    }
    resBtns.appendChild(mkBtn("🎮 Chuyển màn / Đổi game", "btn-pill", function(){
      hideResultModal(); showMenu();
    }));
    resModal.classList.remove("hidden");
  }

  function showMenu() {
    hideResultModal();
    stopRaf();
    viewGame.classList.add("hidden"); viewMenu.classList.remove("hidden"); btnMenu.classList.add("hidden");
    hdrTitle.textContent = "Bộ 9 Game Giải Trí";
    board.innerHTML = ""; hudBt.innerHTML = "";
  }
  btnMenu.addEventListener("click", showMenu);

  document.querySelectorAll(".gcard").forEach(function(c){
    c.addEventListener("click", function(){
      stopRaf();
      viewMenu.classList.add("hidden"); viewGame.classList.remove("hidden"); btnMenu.classList.remove("hidden");
      sfx(460, 0.06);
      GAMES[c.getAttribute("data-game")]();
    });
  });

  function mkBtn(txt, cls, fn) {
    var b = document.createElement("button");
    b.className = cls || "btn-pill"; b.textContent = txt;
    b.addEventListener("click", fn); return b;
  }

  function makeCanvas(heightRatio) {
    var c = document.createElement("canvas");
    c.className = "gcanvas";
    board.innerHTML = ""; board.appendChild(c);
    var w = Math.min(416, board.clientWidth - 20) || 340;
    var h = Math.round(w * (heightRatio || 1));
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    c.width = w * dpr; c.height = h * dpr;
    c.style.height = h + "px";
    var ctx = c.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { c: c, ctx: ctx, w: w, h: h };
  }

  /* ==================== 1. NỐI MÀU SẮC (FLOW CONNECT) ==================== */
  function startFlow() {
    hdrTitle.textContent = "Nối Màu Sắc";
    var COLORS = {
      purple: { main:"#b86be0", bg:"rgba(184,107,224,.16)" },
      yellow: { main:"#f0c419", bg:"rgba(240,196,25,.18)" },
      blue:   { main:"#2d96df", bg:"rgba(45,150,223,.16)" },
      red:    { main:"#ef4d63", bg:"rgba(239,77,99,.16)" },
      teal:   { main:"#29c7a9", bg:"rgba(41,199,169,.16)" },
      orange: { main:"#ff8a3d", bg:"rgba(255,138,61,.16)" }
    };
    // 6 verified 100%-cover levels (Level 1 matches the screenshot!)
    var LEVELS = [
      { n:5, sol:{
        purple:[[0,0],[0,1],[1,1],[2,1],[2,2],[3,2]],
        yellow:[[1,0],[2,0],[3,0],[4,0]],
        blue:[[1,2],[0,2],[0,3],[0,4],[1,4]],
        red:[[1,3],[2,3],[2,4],[3,4],[4,4]],
        teal:[[3,1],[4,1],[4,2],[4,3],[3,3]]
      }},
      { n:5, sol:{
        red:[[0,0],[0,1],[0,2],[1,2],[2,2]],
        blue:[[1,0],[2,0],[3,0],[3,1],[2,1],[1,1]],
        teal:[[4,0],[4,1],[4,2],[3,2],[3,3]],
        yellow:[[0,3],[0,4],[1,4],[2,4],[2,3],[1,3]],
        purple:[[3,4],[4,4],[4,3]]
      }},
      { n:5, sol:{
        orange:[[0,0],[1,0],[2,0],[3,0],[4,0],[4,1]],
        blue:[[0,1],[0,2],[0,3],[1,3],[1,2],[1,1]],
        red:[[2,1],[3,1],[3,2],[2,2],[2,3]],
        teal:[[0,4],[1,4],[2,4],[3,4],[4,4]],
        purple:[[4,2],[4,3],[3,3]]
      }},
      { n:6, sol:{
        red:[[0,0],[0,1],[0,2],[0,3],[1,3]],
        blue:[[1,0],[2,0],[3,0],[3,1],[2,1],[1,1],[1,2],[2,2]],
        yellow:[[4,0],[5,0],[5,1],[5,2],[4,2],[4,1]],
        teal:[[0,4],[0,5],[1,5],[2,5],[2,4],[1,4]],
        purple:[[3,2],[3,3],[2,3],[3,4],[3,5],[4,5]],
        orange:[[5,3],[4,3],[4,4],[5,4],[5,5]]
      }},
      { n:6, sol:{
        purple:[[0,0],[1,0],[2,0],[2,1],[1,1],[0,1]],
        blue:[[0,2],[0,3],[0,4],[0,5],[1,5],[1,4]],
        red:[[1,2],[1,3],[2,3],[2,2],[3,2],[3,1],[3,0]],
        yellow:[[4,0],[5,0],[5,1],[4,1],[4,2],[5,2]],
        teal:[[2,4],[2,5],[3,5],[4,5],[5,5],[5,4]],
        orange:[[3,3],[3,4],[4,4],[4,3],[5,3]]
      }},
      { n:6, sol:{
        teal:[[0,0],[0,1],[0,2],[1,2],[2,2],[2,1],[1,1],[1,0]],
        red:[[2,0],[3,0],[4,0],[5,0],[5,1],[4,1],[3,1]],
        blue:[[0,3],[0,4],[0,5],[1,5],[1,4],[1,3]],
        yellow:[[2,3],[2,4],[2,5],[3,5],[3,4],[3,3],[3,2]],
        purple:[[4,2],[5,2],[5,3],[4,3],[4,4]],
        orange:[[4,5],[5,5],[5,4]]
      }}
    ];

    var cv = makeCanvas(1), ctx = cv.ctx, W = cv.w;
    var lvIdx = 0, N = 5, cell = W/5, paths = {}, endpoints = {}, activeColor = null, pointer = null, particles = [], won = false;

    function loadLevel(idx) {
      lvIdx = (idx + LEVELS.length) % LEVELS.length;
      var lv = LEVELS[lvIdx]; N = lv.n; cell = W / N;
      paths = {}; endpoints = {}; activeColor = null; pointer = null; won = false;
      Object.keys(lv.sol).forEach(function(col){
        var s = lv.sol[col];
        paths[col] = [];
        endpoints[col] = [s[0], s[s.length - 1]];

    }
    function isEndpoint(r, c) {
      var keys = Object.keys(endpoints);
      for (var i=0;i<keys.length;i++) {
        var ep = endpoints[keys[i]];
        if ((ep[0][0]===r&&ep[0][1]===c)||(ep[1][0]===r&&ep[1][1]===c)) return keys[i];
      }
      return null;
    }
    function isConnected(col) {
      var p = paths[col], ep = endpoints[col];
      if (!p || p.length < 2) return false;
      var a = p[0], b = p[p.length-1];
      return ((a[0]===ep[0][0]&&a[1]===ep[0][1]&&b[0]===ep[1][0]&&b[1]===ep[1][1]) ||
              (a[0]===ep[1][0]&&a[1]===ep[1][1]&&b[0]===ep[0][0]&&b[1]===ep[0][1]));
    }

      var keys = Object.keys(endpoints), done = 0, occ = {};
      keys.forEach(function(k){
        if (isConnected(k)) done++;
        paths[k].forEach(function(pt){ occ[pt[0]+","+pt[1]] = 1; });
        endpoints[k].forEach(function(pt){ occ[pt[0]+","+pt[1]] = 1; });
      });
      var cover = Math.round((Object.keys(occ).length / (N*N)) * 100);
      hudSt.textContent = "Màn " + (lvIdx+1) + "/" + LEVELS.length + " • " + done + "/" + keys.length + " • Phủ " + cover + "%";
      if (!won && done === keys.length && cover === 100) {
        won = true; sfx(720, 0.2, "triangle"); vib(20);
        for (var i=0;i<24;i++) particles.push({x:W/2,y:W/2,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7,col:COLORS[keys[i%keys.length]].main,life:1});
        hudSt.textContent = "Hoàn thành màn " + (lvIdx+1) + "! 🎉";
        setTimeout(function(){
          showResultModal({
            win: true,
            title: "Hoàn thành màn " + (lvIdx+1) + "!",
            desc: "Bạn đã nối kín 100% bảng màu.",
            nextLabel: "⏭ Chuyển màn tiếp",
            onNext: function(){ loadLevel(lvIdx + 1); },
            onRetry: function(){ loadLevel(lvIdx); }

      }
    }
    function cellAt(e) {
      var rect = cv.c.getBoundingClientRect();
      var x = e.clientX - rect.left, y = e.clientY - rect.top;

      var c = Math.floor(x / cell), r = Math.floor(y / cell);

    function cutOtherPath(col, r, c) {

    cv.c.addEventListener("pointerdown", function(e){

      }

        var k = keys[i], p = paths[k];
        for (var j=0;j<p.length;j++) {

    cv.c.addEventListener("pointermove", function(e){

      if (last[0]===r && last[1]===c) return;

      var epCol = isEndpoint(r, c);
      if (epCol && epCol !== activeColor) return;
      for (var i=0;i<p.length;i++) {
        if (p[i][0]===r && p[i][1]===c) { paths[activeColor] = p.slice(0, i+1); updateHud(); return; }
      }
      if (isConnected(activeColor)) return;
      cutOtherPath(activeColor, r, c);
      p.push([r, c]);
      if (isConnected(activeColor)) { sfx(620, 0.1, "triangle"); vib(12); }
      else sfx(440 + p.length*15, 0.03);
      updateHud();
    });
    cv.c.addEventListener("pointerup", function(){ activeColor = null; pointer = null; });
    cv.c.addEventListener("pointercancel", function(){ activeColor = null; pointer = null; });

    function loop() {
      ctx.clearRect(0, 0, W, W);
      ctx.fillStyle = "#f9fafc"; ctx.fillRect(0, 0, W, W);

      // Colored cell tint under paths
      Object.keys(paths).forEach(function(col){
        var p = paths[col]; if (!p.length) return;
        ctx.fillStyle = COLORS[col].bg;
        p.forEach(function(pt){ ctx.fillRect(pt[1]*cell, pt[0]*cell, cell, cell); });
      });

      // Grid lines
      ctx.strokeStyle = "#d9dfe8"; ctx.lineWidth = 1.2;
      for (var i=0;i<=N;i++) {
        ctx.beginPath(); ctx.moveTo(i*cell, 0); ctx.lineTo(i*cell, W); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i*cell); ctx.lineTo(W, i*cell); ctx.stroke();
      }

      // Pipes
      Object.keys(paths).forEach(function(col){
        var p = paths[col]; if (p.length < 2) return;
        ctx.save();

      Object.keys(endpoints).forEach(function(col){
        var ep = endpoints[col];
        ep.forEach(function(pt){

      });

      // Touch halo like screenshot
      if (activeColor && pointer) {
        ctx.save();
        ctx.fillStyle = COLORS[activeColor].bg;
        ctx.globalAlpha = 1.6;
        ctx.beginPath(); ctx.arc(pointer.x, pointer.y, cell*0.72, 0, Math.PI*2); ctx.fill();
        ctx.restore();
      }

      for (var k=particles.length-1;k>=0;k--) {
        var pt = particles[k]; pt.x+=pt.vx; pt.y+=pt.vy; pt.life-=0.03;
        if (pt.life<=0){ particles.splice(k,1); continue; }
        ctx.globalAlpha=pt.life; ctx.fillStyle=pt.col;
        ctx.beginPath(); ctx.arc(pt.x, pt.y, 4.5, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha=1;

    }

    var bar = document.createElement("div"); bar.className = "controls-bar";
    bar.appendChild(mkBtn("⏮", "btn-ico", function(){ loadLevel(lvIdx - 1); }));
    bar.appendChild(mkBtn("🔄 Chơi lại", "btn-pill", function(){ loadLevel(lvIdx); }));
    bar.appendChild(mkBtn("⏭", "btn-ico", function(){ loadLevel(lvIdx + 1); }));
    bar.appendChild(mkBtn("🔍 Gợi ý", "btn-pill pri", function(){
      var sol = LEVELS[lvIdx].sol, keys = Object.keys(sol);
      for (var i=0;i<keys.length;i++) {
        if (!isConnected(keys[i])) {

          s.forEach(function(pt){ cutOtherPath(keys[i], pt[0], pt[1]); });
          paths[keys[i]] = s.map(function(pt){ return [pt[0], pt[1]]; });
          sfx(580, 0.1); updateHud(); break;
        }
      }
    }));
    board.appendChild(bar);
    hudBt.innerHTML = "";
    loadLevel(0); loop();
  }

  /* ==================== 2. NUTS & BOLTS (VÔ TẬN • ĐỒ HỌA 3D CAO CẤP • 60FPS) ==================== */
  function startSort() {

      "#48cae4", // Aqua Bubble

    var particles = [], doneFx = {}, shake = {}, L = null, boltSp = null, shaftSp = null, lastT = performance.now();

    function easeOutBack(t) { var c1 = 1.70158, c3 = c1 + 1; return 1 + c3*Math.pow(t - 1, 3) + c1*Math.pow(t - 1, 2); }

    // Deep Royal Purple Studio Gradient matching Image 2
    var bgCv = document.createElement("canvas"); bgCv.width = cv.c.width; bgCv.height = cv.c.height;
    (function(){
      var b = bgCv.getContext("2d"); b.setTransform(DPR, 0, 0, DPR, 0, 0);
      b.save(); b.beginPath(); b.roundRect(0, 0, W, H, 20); b.clip();
      var rg = b.createRadialGradient(W*0.5, H*0.42, W*0.05, W*0.5, H*0.5, Math.max(W, H)*0.75);
      rg.addColorStop(0, "#4c1d95"); rg.addColorStop(0.55, "#2e1065"); rg.addColorStop(1, "#170533");

    // Pre-render full steel bolt (base flange + threaded shaft) AND isolated shaft-only sprite for true 3D pass-through occlusion
    function buildBoltSprites(sc) {
      var sw = 72*sc, shH = (CAP*NUT_H + 18)*sc, hh = shH + 28*sc;
      var cx = sw/2, by = shH + 12*sc, top = by - shH, r = 9.2*sc;

      function drawShaftOnly(b) {
        var sg = b.createLinearGradient(cx - r, 0, cx + r, 0);
        sg.addColorStop(0, "#475569"); sg.addColorStop(0.22, "#cbd5e1"); sg.addColorStop(0.42, "#ffffff");
        sg.addColorStop(0.68, "#94a3b8"); sg.addColorStop(1, "#334155");
        b.fillStyle = sg;
        b.beginPath(); b.roundRect(cx - r, top + 3*sc, r*2, shH - 2*sc, [r*0.75, r*0.75, 0, 0]); b.fill();
        // Realistic machined spiral threads
        b.save(); b.beginPath(); b.roundRect(cx - r, top + 3*sc, r*2, shH - 2*sc, [r*0.75, r*0.75, 0, 0]); b.clip();

          b.strokeStyle = "rgba(255,255,255,.55)"; b.lineWidth = 1.0*sc;
          b.beginPath(); b.moveTo(cx - r - 1, ty + 1.4*sc); b.quadraticCurveTo(cx, ty + 3.6*sc, cx + r + 1, ty - 0.4*sc); b.stroke();
        }

        tg.addColorStop(0, "#ffffff"); tg.addColorStop(0.55, "#cbd5e1"); tg.addColorStop(1, "#64748b");
        b.fillStyle = tg; b.beginPath(); b.ellipse(cx, top + 5*sc, r, r*TILT*1.05, 0, 0, Math.PI*2); b.fill();
        b.strokeStyle = "rgba(255,255,255,.65)"; b.lineWidth = 0.9*sc; b.stroke();
      }

      var cFull = document.createElement("canvas"); cFull.width = Math.ceil(sw*DPR); cFull.height = Math.ceil(hh*DPR);
      var bf = cFull.getContext("2d"); bf.setTransform(DPR, 0, 0, DPR, 0, 0);
      // Ambient drop shadow on board
      var shG = bf.createRadialGradient(cx, by + 3*sc, 4*sc, cx, by + 3*sc, 33*sc);
      shG.addColorStop(0, "rgba(0,0,0,.62)"); shG.addColorStop(1, "rgba(0,0,0,0)");
      bf.fillStyle = shG; bf.beginPath(); bf.ellipse(cx, by + 4*sc, 33*sc, 13*sc, 0, 0, Math.PI*2); bf.fill();
      // Heavy steel base washer (bottom lip + top chamfer)
      var wSide = bf.createLinearGradient(cx - 28*sc, 0, cx + 28*sc, 0);
      wSide.addColorStop(0, "#334155"); wSide.addColorStop(0.35, "#94a3b8"); wSide.addColorStop(0.7, "#64748b"); wSide.addColorStop(1, "#1e293b");
      bf.fillStyle = wSide;

    function slotY(b, i) { return L.pos[b].y - 3*L.sc - i*(NUT_H - 1.5)*L.sc; }
    function liftY(b) { return L.pos[b].y - (CAP*NUT_H + 34)*L.sc; }

    function computeLayout() {

      var above = CAP*NUT_H + 36 + NUT_W*TILT + 8, unitH = above + 24;

      }); });

    var nutSp = [];
    function buildNutSprites(sc) {

      var cx = sw/2, yt = R*TILT + 4, yb = yt + h;
      for (var ci=0; ci<PAL.length; ci++) {
        var hex = PAL[ci], c = document.createElement("canvas");
        c.width = Math.ceil(sw*DPR); c.height = Math.ceil(sh*DPR);
        var b = c.getContext("2d"); b.setTransform(DPR, 0, 0, DPR, 0, 0);
        // Side wall
        var sideG = b.createLinearGradient(cx - R, 0, cx + R, 0);
        sideG.addColorStop(0, rgbMod(hex, -0.35)); sideG.addColorStop(0.28, rgbMod(hex, 0.35));

    }

    function drawNut(x, yb, sc, ci, rot, boltX, boltBaseY, shadow) {

    function topNut(b) { var a = bolts[b]; return a[a.length - 1]; }
    function isUniform(b) { var a = bolts[b]; return a.every(function(n){ return n.c === a[0].c; }); }
    function isDone(b) { return bolts[b].length === CAP && isUniform(b); }
    function isSolved() { return bolts.every(function(a, b){ return !a.length || isDone(b); }); }
    function canMove(a, b) {
      if (a === b || !bolts[a].length || isDone(a) || bolts[b].length >= CAP) return false;

    function startFly(nut, from, to, slot, k) {
      var x0 = nut.px != null ? nut.px : L.pos[from].x, y0 = nut.py != null ? nut.py : liftY(from);

    function transfer(from, to, count) {

    function confetti(x, y, n) {

            nextLabel: "⏭ Màn " + level, onNext: init,

        sfx(560, 0.06); vib(8); pendingCheck = true;

    function updFly(nut, dt) {

        ctx.restore();

    }

    function draw(dt) {
      ctx.clearRect(0, 0, W, H);
      ctx.drawImage(bgCv, 0, 0, W, H);
      var sc = L.sc, flying = [];
      for (var b=0;b<bolts.length;b++) {
        var p = L.pos[b], sx = 0;
        if (shake[b]) { shake[b] = Math.max(0, shake[b] - dt*3.2); sx = Math.sin(shake[b]*28)*6*sc*shake[b]; }

          ag.addColorStop(0, "rgba(250,204,21,.55)"); ag.addColorStop(1, "rgba(250,204,21,0)");
          ctx.fillStyle = ag; ctx.beginPath(); ctx.ellipse(bx, p.y + 2*sc, 38*sc, 15*sc, 0, 0, Math.PI*2); ctx.fill();
        } else if (sel >= 0 && canMove(sel, b)) {
          var vg = ctx.createRadialGradient(bx, p.y, 6*sc, bx, p.y, 36*sc);
          vg.addColorStop(0, "rgba(52,211,153,.45)"); vg.addColorStop(1, "rgba(52,211,153,0)");
          ctx.fillStyle = vg; ctx.beginPath(); ctx.ellipse(bx, p.y + 2*sc, 36*sc, 14*sc, 0, 0, Math.PI*2); ctx.fill();
        }
        ctx.drawImage(boltSp.c, bx - boltSp.ax, p.y - boltSp.ay, boltSp.w, boltSp.h);
        var arr = bolts[b];
        for (var i=0;i<arr.length;i++) {
          var nut = arr[i];
          if (nut.fly) { flying.push(nut); continue; }
          var target = (sel === b && i === arr.length - 1) ? 1 : 0, prev = nut.lift;
          nut.lift += (target - nut.lift)*(1 - Math.exp(-dt*15));

        }

        if (doneFx[b] != null) {

            var s = easeOutBack(Math.min(1, doneFx[b]*2.8)), capY = p.y - boltSp.topOffset - 2*sc;
            ctx.save(); ctx.translate(bx, capY); ctx.scale(s, s);

    function solvable(start, cap) {
      var seen = {}, nodes = 0;
      function keyOf(s) { return s.map(function(b){ return String.fromCharCode.apply(null, b.map(function(x){ return 97 + x; })); }).sort().join("|"); }
      function solved(s) { return s.every(function(b){ return !b.length || (b.length === cap && b.every(function(x){ return x === b[0]; })); }); }
      function dfs(s) {
        if (solved(s)) return true;
        if (++nodes > 20000) return false;
        var key = keyOf(s); if (seen[key]) return false; seen[key] = 1;
        for (var i=0;i<s.length;i++) {
          var a = s[i]; if (!a.length) continue;
          var tc = a[a.length - 1], run = 1;
          while (run < a.length && a[a.length - 1 - run] === tc) run++;
          if (run === a.length && a.length === cap) continue;
          for (var j=0;j<s.length;j++) {
            if (i === j) continue;
            var b = s[j];
            if (b.length >= cap || (b.length && b[b.length - 1] !== tc) || (!b.length && run === a.length)) continue;
            var ns = s.map(function(x){ return x.slice(); }), mv = Math.min(run, cap - b.length);
            for (var m=0;m<mv;m++) ns[j].push(ns[i].pop());
            if (dfs(ns)) return true;
          }

        return false;
      }
      return dfs(start.map(function(b){ return b.slice(); }));
    }
    function gen(n, cap, empty) {
      var st = null, cand = null;
      for (var attempt=0; attempt<12; attempt++) {
        var pool = []; for (var c=0;c<n;c++) for (var k=0;k<cap;k++) pool.push(c);
        shuffle(pool);
        cand = []; for (var b=0;b<n;b++) cand.push(pool.slice(b*cap, b*cap + cap));
        for (var e=0;e<empty;e++) cand.push([]);
        if (cand.some(function(x){ return x.length === cap && x.every(function(y){ return y === x[0]; }); })) continue;
        st = cand;
        if (solvable(cand, cap)) break;
      }
      return st || cand;
    }

    function init() {
      hideResultModal();
      var n = Math.min(3 + Math.floor((level - 1) / 2), PAL.length);
      CAP = level >= 18 ? 5 : 4;
      var st = gen(n, CAP, 2), pick = shuffle(PAL.map(function(_, i){ return i; })).slice(0, n);
      bolts = st.map(function(arr, bi){ return arr.map(function(c, i){
        return { c: pick[c], rot: 0.25 + (i%2)*0.12, lift: 0, land: 0, fly: null, px: null, py: null, intro: -(bi*0.06 + i*0.08) };
      }); });
      sel = -1; history = []; extraUsed = false; ended = false; pendingCheck = false;
      particles = []; doneFx = {}; shake = {};
      computeLayout();
      hudSt.textContent = "Màn " + level + " (Vô tận) • " + n + " màu ốc" + (CAP > 4 ? " • 5 tầng" : "");
      sfx(500, 0.06);
    }

    function loop(now) {
      var dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000)); lastT = now;
      draw(dt);
      if (pendingCheck && !anyFlying()) { pendingCheck = false; evaluate(); }
      activeRaf = requestAnimationFrame(loop);
    }

    hudBt.innerHTML = "";
    hudBt.appendChild(mkBtn("↩ Hoàn tác", "btn-pill", undo));
    hudBt.appendChild(mkBtn("➕ Bu lông", "btn-pill vio", addBolt));
    hudBt.appendChild(mkBtn("🔄", "btn-ico", init));
    init();
    activeRaf = requestAnimationFrame(loop);
  }

  /* ==================== 3. KẸO NGỌT SAGA (ĐỒ HỌA CANDY CRUSH SAGA • VÔ TẬN • 60FPS) ==================== */
  function startCandy() {
    hdrTitle.textContent = "Kẹo Ngọt Saga";
    var cv = makeCanvas(1), ctx = cv.ctx, W = cv.w, DPR = cv.c.width / W, N = 8, pad = 8, cell = (W - pad*2) / N, RAD = cell*0.435, S = cell*1.48;
    // 6 Iconic Candy Crush Saga Candies: Red Jelly Bean, Orange Lozenge, Yellow Lemon Drop, Green Cushion, Blue Sphere, Purple Cluster
    var CANDIES = [
      { bg:"#f21b3f", hi:"#ff9ebb", core:"#ff5c77", sh:"#8c001a", kind:"bean" },
      { bg:"#ff7b00", hi:"#ffe099", core:"#ffaa2b", sh:"#9e3d00", kind:"lozenge" },
      { bg:"#ffcc00", hi:"#ffffb8", core:"#ffe84d", sh:"#ad7a00", kind:"drop" },
      { bg:"#22c55e", hi:"#bbf7d0", core:"#4ade80", sh:"#0c6b2e", kind:"cushion" },
      { bg:"#0ea5e9", hi:"#bae6fd", core:"#38bdf8", sh:"#034c81", kind:"sphere" },
      { bg:"#a855f7", hi:"#f3e8ff", core:"#c084fc", sh:"#581c87", kind:"cluster" }
    ];
    var grid = [], particles = [], floatTexts = [], effects = [], sel = null, score = 0, moves = 0, busy = false, over = false;
    var best = 0; try { best = +(localStorage.getItem("off_candy_best") || 0); } catch (e) {}
    var pending = null, pendingAt = 0, lastT = performance.now(), clock = 0, sprites = {};

    function K(r, c) { return r*N + c; }
    function cx(c) { return pad + c*cell + cell/2; }
    function cy(r) { return pad + r*cell + cell/2; }
    function rnd6() { return (Math.random()*6)|0; }
    function mk(t, sp) { return { t: t, sp: sp || "", ox: 0, oy: 0, vy: 0, fall: false, s: 1, land: 0 }; }
    function colAt(r, c) { var g = grid[r] && grid[r][c]; return (g && g.sp !== "b" && g.sp !== "x") ? g.t : -1; }
    function after(delay, fn) { pending = fn; pendingAt = performance.now() + delay; }
    function updHud() { hudSt.textContent = "Điểm: " + score + " • Lượt: " + moves + " • Kỷ lục: " + Math.max(best, score); }

    // 3D Cute Pastel Cotton-Candy Cartoon Board
    var bgCv = document.createElement("canvas"); bgCv.width = cv.c.width; bgCv.height = cv.c.height;
    (function(){
      var b = bgCv.getContext("2d"); b.setTransform(DPR, 0, 0, DPR, 0, 0);
      var outerG = b.createLinearGradient(0, 0, 0, W);
      outerG.addColorStop(0, "#3b0764"); outerG.addColorStop(0.5, "#1e1b4b"); outerG.addColorStop(1, "#0f172a");
      b.fillStyle = outerG; b.beginPath(); b.roundRect(0, 0, W, W, 20); b.fill();
      b.strokeStyle = "#ffffff"; b.lineWidth = 3;
      b.beginPath(); b.roundRect(2.5, 2.5, W - 5, W - 5, 18); b.stroke();

    })();

    // Trace each of the 6 iconic Candy Crush shapes
    function traceCandyShape(c2, rad, kind) {
      c2.beginPath();
      if (kind === "bean") {
        // Tilted plump Jelly Bean
        c2.rotate(-0.42);
        var w = rad*0.92, h = rad*0.64;
        c2.moveTo(-w*0.85, -h*0.1);
        c2.bezierCurveTo(-w*0.95, -h*1.1, w*0.95, -h*1.1, w*0.85, -h*0.1);

      } else if (cd.kind === "cushion") {

        for (var s=-2;s<=2;s++) {

    function planSpecials(G, pivots) {

      G.squares.forEach(function(sq){ sq.cells.forEach(function(p){ clear[K(p[0], p[1])] = 1; }); });

    hudBt.appendChild(mkBtn("🔄 Ván mới", "btn-pill pri", reset));

  /* ==================== 4. XẾP KHỐI MÀU (DRAG + LINE GLOW) ==================== */

    }

  /* ==================== 5. 2048 (CANVAS 60FPS + SWIPE) ==================== */

  /* ==================== 6. CỜ CARO (3x3 / 11x11 / VÔ HẠN • 60FPS) ==================== */
  function startCaro() {
    var MODES = ["11x11", "3x3", "inf"];
    var modeIdx = 0, vsBot = true, turn = 1, over = false, winLine = null;
    var cv = makeCanvas(1), ctx = cv.ctx, W = cv.w;
    var map = {}, anim = {}, lastKey = null, camX = 0, camY = 0, dragCam = null;

    function curMode() { return MODES[modeIdx]; }
    function gridSize() { return curMode() === "3x3" ? 3 : 11; }
    function winCount() { return curMode() === "3x3" ? 3 : 5; }
    function cellPx() { return curMode() === "3x3" ? (W - 24)/3 : (W - 24)/11; }
    function key(r, c) { return r + "," + c; }

    function reset() {
      map = {}; anim = {}; lastKey = null; turn = 1; over = false; winLine = null;
      camX = 0; camY = 0;
      var label = curMode() === "3x3" ? "3×3" : (curMode() === "11x11" ? "11×11" : "Vô hạn");
      hdrTitle.textContent = "Cờ Caro " + label;
      hudSt.textContent = (vsBot ? "🤖 vs Máy" : "👥 2 Người") + " • Lượt X";
    }

    function inBounds(r, c) {
      if (curMode() === "inf") return true;
      var n = gridSize(); return r >= 0 && c >= 0 && r < n && c < n;
    }

    function findWinFrom(r, c, p) {
      var need = winCount(), dirs = [[1,0],[0,1],[1,1],[1,-1]];
      for (var d=0;d<4;d++) {
        var dr = dirs[d][0], dc = dirs[d][1], pts = [[r,c]];
        for (var k=1;k<need;k++) { if (map[key(r+dr*k, c+dc*k)]===p) pts.push([r+dr*k, c+dc*k]); else break; }
        for (var k2=1;k2<need;k2++) { if (map[key(r-dr*k2, c-dc*k2)]===p) pts.unshift([r-dr*k2, c-dc*k2]); else break; }
        if (pts.length >= need) return { a: pts[0], b: pts[pts.length - 1] };
      }
      return null;
    }

    function isBoardFull() {
      if (curMode() === "inf") return false;
      var n = gridSize();

    }

    function scoreCell(r, c, p) {
      var need = winCount(), dirs = [[1,0],[0,1],[1,1],[1,-1]], tot = 0;
      for (var d=0;d<4;d++) {
        var dr=dirs[d][0], dc=dirs[d][1], cnt=1, op=0;
        for (var s=-1;s<=1;s+=2) for (var k=1;k<need;k++) {
          var nr=r+dr*k*s, nc=c+dc*k*s;
          if (!inBounds(nr, nc)) break;
          var v = map[key(nr, nc)] || 0;
          if (v===p) cnt++; else { if(v===0) op++; break; }
        }
        if (cnt>=need) tot+=100000;
        else if (cnt===need-1 && op===2) tot+=15000;
        else if (cnt===need-1 && op===1) tot+=3600;
        else if (cnt===need-2 && op===2) tot+=1400;
        else tot += cnt*14 + op*4;
      }
      return tot;
    }

    function botMove() {
      var cands = {};
      if (curMode() === "inf") {
        var keys = Object.keys(map);
        if (!keys.length) cands["0,0"] = [0, 0];
        else keys.forEach(function(k){
          var p = k.split(","); var rr=+p[0], cc=+p[1];
          for (var dr=-2;dr<=2;dr++) for (var dc=-2;dc<=2;dc++) {
            var nk = key(rr+dr, cc+dc);
            if (!map[nk]) cands[nk] = [rr+dr, cc+dc];
          }
        });
      } else {
        var n = gridSize();
        for (var r=0;r<n;r++) for (var c=0;c<n;c++) if (!map[key(r,c)]) cands[key(r,c)] = [r,c];
      }
      var best = null, bv = -1;

        var pt = cands[k], r = pt[0], c = pt[1];
        var centerBias = curMode()==="3x3" ? ((r===1&&c===1)?5:0) : (10 - Math.abs(r-5) - Math.abs(c-5))*0.2;
        var v = scoreCell(r,c,2)*1.15 + scoreCell(r,c,1) + centerBias;
        if (v > bv) { bv = v; best = pt; }

      if (!best) return;

    }

    function place(r, c, p, isBot) {
      var k = key(r, c);
      map[k] = p; anim[k] = 0.15; lastKey = k;
      sfx(isBot ? 340 : 460, 0.06); if (!isBot) vib(8);
      var w = findWinFrom(r, c, p);
      if (w) {
        over = true; winLine = w; sfx(720, 0.18, "triangle");
        var msg = vsBot ? (p===1 ? "Bạn thắng! 🎉" : "Máy (O) thắng!") : ((p===1 ? "X" : "O") + " thắng! 🎉");
        hudSt.textContent = msg;
        setTimeout(function(){
          showResultModal({
            win: !vsBot || p===1,
            title: msg,
            desc: "Chế độ: " + curMode(),
            nextLabel: "▶ Ván mới",
            onNext: reset,
            onRetry: reset
          });
        }, 480);
        return;
      }
      if (isBoardFull()) {
        over = true; hudSt.textContent = "Hòa nhau!";
        setTimeout(function(){
          showResultModal({ win: true, title: "Hòa nhau!", desc: "Bàn cờ đã kín.", nextLabel: "▶ Ván mới", onNext: reset, onRetry: reset });
        }, 350);
        return;
      }
      if (vsBot) {
        if (p === 1) { hudSt.textContent = "Máy đang đi..."; setTimeout(botMove, 180); }
        else hudSt.textContent = "🤖 vs Máy • Lượt bạn (X)";
      } else {
        turn = turn === 1 ? 2 : 1;
        hudSt.textContent = "👥 2 Người • Lượt " + (turn===1 ? "X" : "O");
      }
    }

    cv.c.addEventListener("pointerdown", function(e){
      var rect = cv.c.getBoundingClientRect();

    cv.c.addEventListener("pointerup", function(e){
      if (!dragCam) return;
      var wasMoved = dragCam.moved, lx = dragCam.lx, ly = dragCam.ly;

        c = Math.floor((lx - W/2 + camX) / cell);
        r = Math.floor((ly - W/2 + camY) / cell);
      } else {
        c = Math.floor((lx - 12) / cell);
        r = Math.floor((ly - 12) / cell);
      }

    });

    function toScreen(r, c) {
      var cell = cellPx();
      if (curMode() === "inf") return { x: W/2 + c*cell - camX, y: W/2 + r*cell - camY, cell: cell };

    function loop() {
      ctx.clearRect(0, 0, W, W);
      var bg = ctx.createLinearGradient(0, 0, W, W);
      bg.addColorStop(0, "#fff8f1"); bg.addColorStop(1, "#f7e7da");
      ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(0, 0, W, W, 16); ctx.fill();

      ctx.strokeStyle = "rgba(130,90,60,.26)"; ctx.lineWidth = 1;
      if (curMode() === "inf") {
        var cMin = Math.floor((camX - W/2)/cell) - 1, cMax = Math.ceil((camX + W/2)/cell) + 1;
        var rMin = Math.floor((camY - W/2)/cell) - 1, rMax = Math.ceil((camY + W/2)/cell) + 1;

          var sy = W/2 + r*cell - camY;

        ctx.fillStyle = "rgba(255,59,111,.35)";
        ctx.beginPath(); ctx.arc(o.x + cell/2, o.y + cell/2, 3.5, 0, Math.PI*2); ctx.fill();
      } else {
        var n = gridSize();
        for (var i=0;i<=n;i++) {
          var p = 12 + i*cell;
          ctx.beginPath(); ctx.moveTo(12, p); ctx.lineTo(W-12, p); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(p, 12); ctx.lineTo(p, W-12); ctx.stroke();
        }

        });
      }

      Object.keys(map).forEach(function(k){
        var v = map[k], parts = k.split(","), r = +parts[0], c = +parts[1];

    hudBt.innerHTML = "";
    var sizeBtn = mkBtn("📐 11×11", "btn-pill", function(){
      modeIdx = (modeIdx + 1) % MODES.length;
      sizeBtn.textContent = curMode()==="3x3" ? "📐 3×3" : (curMode()==="11x11" ? "📐 11×11" : "♾️ Vô hạn");

    });

    hudBt.appendChild(sizeBtn); hudBt.appendChild(mb); hudBt.appendChild(centerBtn); hudBt.appendChild(mkBtn("🔄", "btn-ico", reset));

  }

  /* ==================== 7. PIKACHU ONET (3D GLASS • VÔ HẠN MÀN) ==================== */
  function startOnet() {
    hdrTitle.textContent = "Pikachu Onet";
    var cv = makeCanvas(1.18), ctx = cv.ctx, W = cv.w, H = cv.h, DPR = cv.c.width / W;
    var ICONS = [
      { ic:"⚡", bg:"#fff3b0", bd:"#fbbf24" }, { ic:"🍓", bg:"#ffd6e0", bd:"#f43f5e" },
      { ic:"🍑", bg:"#ffe4cc", bd:"#fb923c" }, { ic:"🍋", bg:"#fef9c3", bd:"#eab308" },
      { ic:"🍉", bg:"#dcfce7", bd:"#22c55e" }, { ic:"🍇", bg:"#f3e8ff", bd:"#a855f7" },
      { ic:"🌸", bg:"#fce7f3", bd:"#ec4899" }, { ic:"🦋", bg:"#e0f2fe", bd:"#38bdf8" },
      { ic:"🐥", bg:"#fef08a", bd:"#f59e0b" }, { ic:"🐼", bg:"#f1f5f9", bd:"#64748b" },
      { ic:"🦊", bg:"#ffedd5", bd:"#ea580c" }, { ic:"🐰", bg:"#fdf2f8", bd:"#f472b6" },
      { ic:"💎", bg:"#cffafe", bd:"#06b6d4" }, { ic:"🎀", bg:"#ffe4e6", bd:"#e11d48" },
      { ic:"🍭", bg:"#fae8ff", bd:"#d946ef" }, { ic:"🧁", bg:"#ede9fe", bd:"#8b5cf6" },
      { ic:"🌟", bg:"#fef3c7", bd:"#d97706" }, { ic:"🍀", bg:"#d1fae5", bd:"#10b981" }
    ];
    var level = 1;
    try { level = Math.max(1, parseInt(localStorage.getItem("off_onet_level") || "1", 10) || 1); } catch (e) {}
    var cols = 6, rows = 6, grid = [], tileSc = [], sel = null, hintPair = null, pathFx = [], particles = [], score = 0, ended = false, lastT = performance.now(), oClock = 0;

    function saveLv() { try { localStorage.setItem("off_onet_level", String(level)); } catch (e) {} }
    function dims() {
      if (level <= 2) return { r: 6, c: 6, k: 9 };
      if (level <= 5) return { r: 6, c: 8, k: 12 };

    }
    function cellBox() {
      var pad = 10, cw = (W - pad*2) / (cols + 0.6), ch = (H - pad*2) / (rows + 0.6);
      var sz = Math.min(cw, ch), ox = (W - cols*sz)/2, oy = (H - rows*sz)/2;
      return { sz: sz, ox: ox, oy: oy };
    }
    function centerOf(r, c, b) { return { x: b.ox + (c + 0.5)*b.sz, y: b.oy + (r + 0.5)*b.sz }; }

    // BFS 0/1/2-turn pathfinder with 1-cell outer border [-1..rows, -1..cols]
    function findPath(r1, c1, r2, c2) {
      if (r1 === r2 && c1 === c2) return null;
      if (grid[r1][c1] < 0 || grid[r1][c1] !== grid[r2][c2]) return null;
      var dr = [-1, 1, 0, 0], dc = [0, 0, -1, 1];
      var R = rows + 2, C = cols + 2;
      var best = Array.from({length:R}, function(){ return Array.from({length:C}, function(){ return [9,9,9,9]; }); });
      var q = [];
      for (var d=0;d<4;d++) {
        best[r1+1][c1+1][d] = 0;

      }
      while (q.length) {
        var cur = q.shift();
        var nr = cur.r + dr[cur.d], nc = cur.c + dc[cur.d];
        while (nr >= 0 && nr < R && nc >= 0 && nc < C) {

    function findAnyPair() {
      var cells = [];
      for (var r=0;r<rows;r++) for (var c=0;c<cols;c++) if (grid[r][c] >= 0) cells.push([r, c]);
      for (var i=0;i<cells.length;i++) for (var j=i+1;j<cells.length;j++) {
        var p = findPath(cells[i][0], cells[i][1], cells[j][0], cells[j][1]);

      return null;

    function shuffleRemaining() {

        for (var i=vals.length-1;i>0;i--) { var j=(Math.random()*(i+1))|0, t=vals[i]; vals[i]=vals[j]; vals[j]=t; }
        var idx = 0;
        for (r=0;r<rows;r++) for (c=0;c<cols;c++) if (grid[r][c] >= 0) grid[r][c] = vals[idx++];

    }
    function remainingCount() {
      var n = 0; for (var r=0;r<rows;r++) for (var c=0;c<cols;c++) if (grid[r][c] >= 0) n++;
      return n;
    }

    function init() {
      hideResultModal();
      var d = dims(); rows = d.r; cols = d.c;
      var total = rows * cols, pool = [];
      for (var i=0;i<total/2;i++) { var v = i % d.k; pool.push(v, v); }
      for (var j=pool.length-1;j>0;j--) { var k=(Math.random()*(j+1))|0, t=pool[j]; pool[j]=pool[k]; pool[k]=t; }
      grid = []; tileSc = []; var p = 0;

    }

      var b = cellBox(), c = Math.floor((x - b.ox) / b.sz), r = Math.floor((y - b.oy) / b.sz);

      if (path) {
        var ic = ICONS[grid[r][c]];
        grid[sel[0]][sel[1]] = -1; grid[r][c] = -1; sel = null;
        score += 20; sfx(680, 0.1, "triangle"); vib(10);
        pathFx.push({ pts: path, col: ic.bd, life: 1 });
        [path[0], path[path.length-1]].forEach(function(pt){
          var ctr = centerOf(pt[0], pt[1], b);
          for (var i=0;i<8;i++) {
            var a = Math.random()*Math.PI*2, sp = 1.5 + Math.random()*3;

          }
        });
        if (remainingCount() === 0) {
          ended = true; sfx(860, 0.22, "triangle"); vib(25);
          var done = level; level++; saveLv();
          hudSt.textContent = "Hoàn thành màn " + done + "! ⚡";
          setTimeout(function(){
            showResultModal({
              win: true, title: "Hoàn thành màn " + done + "!", desc: "Tổng điểm: " + score + " • Màn " + level + " sẵn sàng.",
              nextLabel: "⏭ Màn " + level, onNext: init,
              retryLabel: "🔄 Chơi lại màn " + done, onRetry: function(){ level = done; saveLv(); init(); }
            });
          }, 420);
        } else {
          if (!findAnyPair()) { shuffleRemaining(); hudSt.textContent = "Màn " + level + " • Tự xáo bài! • Điểm: " + score; }
          else hudSt.textContent = "Màn " + level + " • Điểm: " + score;
        }
      } else {

      }
    });

    var tileSp = [], tileSpSz = 0;
    function ensureTileSprites(s) {
      if (tileSp.length && Math.abs(tileSpSz - s) < 0.5) return;

        var b = c.getContext("2d"); b.setTransform(DPR, 0, 0, DPR, 0, 0);
        var x = 2, y = 2;
        b.fillStyle = "rgba(0,0,0,.3)"; b.beginPath(); b.roundRect(x, y + 3, s, s, rad); b.fill();
        b.fillStyle = ic.bg; b.beginPath(); b.roundRect(x, y, s, s, rad); b.fill();
        b.fillStyle = "rgba(255,255,255,.48)"; b.beginPath(); b.roundRect(x + 2, y + 2, s - 4, s*0.4, [rad-2, rad-2, 4, 4]); b.fill();
        b.strokeStyle = "rgba(255,255,255,.85)"; b.lineWidth = 1.2; b.beginPath(); b.roundRect(x, y, s, s, rad); b.stroke();
        b.font = Math.round(s*0.56) + "px sans-serif"; b.textAlign = "center"; b.textBaseline = "middle";
        b.fillText(ic.ic, x + s/2, y + s/2 + 1.5);

    function loop(now) {

      ctx.clearRect(0, 0, W, H);
      var bg = ctx.createLinearGradient(0, 0, W, H);
      bg.addColorStop(0, "#1e1b4b"); bg.addColorStop(0.5, "#312e81"); bg.addColorStop(1, "#1e293b");
      ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(0, 0, W, H, 18); ctx.fill();
      var b = cellBox(), pad = 2.5, rad = 9, s = b.sz - pad*2;
      ensureTileSprites(s);
      for (var r=0;r<rows;r++) for (var c=0;c<cols;c++) {
        var v = grid[r][c]; if (v < 0) continue;
        var x = b.ox + c*b.sz + pad, y = b.oy + r*b.sz + pad;
        var isSel = sel && sel[0]===r && sel[1]===c;
        var isHint = hintPair && ((hintPair[0][0]===r&&hintPair[0][1]===c)||(hintPair[1][0]===r&&hintPair[1][1]===c));
        tileSc[r][c] = Math.min(1, tileSc[r][c] + dt*6);
        var scPop = Math.max(0.01, tileSc[r][c]) * (isSel ? (1.06 + 0.03*Math.sin(oClock*8)) : 1);
        if (scPop !== 1 || isSel || isHint) {
          ctx.save();
          ctx.translate(x + s/2, y + s/2 + (isSel ? -2.5 : 0)); ctx.scale(scPop, scPop);
          ctx.drawImage(tileSp[v], -s/2 - 2, -s/2 - 2, s + 4, s + 6);
          if (isSel || isHint) {
            ctx.strokeStyle = isSel ? "#fde047" : "#34d399"; ctx.lineWidth = 2.6;
            ctx.beginPath(); ctx.roundRect(-s/2, -s/2, s, s, rad); ctx.stroke();
          }
          ctx.restore();
        } else {
          ctx.drawImage(tileSp[v], x - 2, y - 2, s + 4, s + 6);
        }
      }
      for (var i=pathFx.length-1;i>=0;i--) {
        var f = pathFx[i]; f.life -= dt*3.2; if (f.life <= 0) { pathFx.splice(i,1); continue; }
        ctx.save(); ctx.globalAlpha = Math.min(1, f.life*1.4);
        ctx.strokeStyle = "#fff"; ctx.shadowColor = f.col; ctx.shadowBlur = 12; ctx.lineWidth = 4.5*f.life;
        ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.beginPath();
        f.pts.forEach(function(pt, idx){ var p = centerOf(pt[0], pt[1], b); if (!idx) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
        ctx.stroke(); ctx.restore();
      }
      for (var k=particles.length-1;k>=0;k--) {
        var pt = particles[k]; pt.x += pt.vx*dt*60; pt.y += pt.vy*dt*60; pt.life -= dt*2.4;
        if (pt.life <= 0) { particles.splice(k,1); continue; }
        ctx.globalAlpha = pt.life; ctx.fillStyle = pt.col; ctx.beginPath(); ctx.arc(pt.x, pt.y, 3.5, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1;
      }
      activeRaf = requestAnimationFrame(loop);
    }

    hudBt.innerHTML = "";
    hudBt.appendChild(mkBtn("💡 Gợi ý", "btn-pill", function(){
      if (ended) return; var res = findAnyPair(); if (res) { hintPair = [res[0], res[1]]; sfx(580, 0.08); }
    }));
    hudBt.appendChild(mkBtn("🔀 Xáo", "btn-pill vio", function(){ if (!ended) shuffleRemaining(); }));
    hudBt.appendChild(mkBtn("🔄", "btn-ico", init));
    init(); activeRaf = requestAnimationFrame(loop);
  }

  /* ==================== 8. KẸT XE / RUSH HOUR (GIỐNG ẢNH 1 • VÔ HẠN MÀN) ==================== */
  function startRush() {
    hdrTitle.textContent = "Kẹt Xe (Rush Hour)";
    var cv = makeCanvas(1.02), ctx = cv.ctx, W = cv.w, H = cv.h;
    var level = 1;
    try { level = Math.max(1, parseInt(localStorage.getItem("off_rush_level") || "1", 10) || 1); } catch (e) {}
    var N = 6, cars = [], moves = 0, drag = null, ended = false, winSlide = 0, lastT = performance.now();

    function saveLv() { try { localStorage.setItem("off_rush_level", String(level)); } catch (e) {} }

    var CAR_STYLES = [
      { body:"#ef4444", roof:"#fca5a5", cab:"#b91c1c", kind:"target" }, // 0: Target Red Car
      { body:"#2563eb", roof:"#93c5fd", cab:"#1e40af", kind:"sedan" },
      { body:"#f59e0b", roof:"#fde68a", cab:"#b45309", kind:"sedan" },
      { body:"#22c55e", roof:"#bbf7d0", cab:"#15803d", kind:"truck" },
      { body:"#f8fafc", roof:"#cbd5e1", cab:"#0f172a", kind:"police" },
      { body:"#e11d48", roof:"#fda4af", cab:"#9f1239", kind:"sedan" },
      { body:"#0ea5e9", roof:"#bae6fd", cab:"#0369a1", kind:"truck" },
      { body:"#a855f7", roof:"#e9d5ff", cab:"#6b21a8", kind:"sedan" },
      { body:"#f97316", roof:"#fed7aa", cab:"#c2410c", kind:"truck" }
    ];

    // BFS solver to guarantee every generated puzzle is solvable and nontrivial
    function solveMinMoves(list) {
      var target = list[0];
      function encode(pos) { return pos.join(","); }
      var initPos = list.map(function(c){ return c.dir === "h" ? c.c : c.r; });
      var q = [{ pos: initPos, d: 0 }], seen = {};
      seen[encode(initPos)] = 1;
      var nodes = 0;
      while (q.length && ++nodes < 6000) {
        var cur = q.shift(), pos = cur.pos;
        if (pos[0] === 4) return cur.d + 1;
        var g = [0,0,0,0,0,0].map(function(){ return [-1,-1,-1,-1,-1,-1]; });
        for (var i=0;i<list.length;i++) {
          var ci = list[i], rr = ci.dir==="h" ? ci.r : pos[i], cc = ci.dir==="h" ? pos[i] : ci.c;
          for (var k=0;k<ci.len;k++) g[ci.dir==="h"?rr:rr+k][ci.dir==="h"?cc+k:cc] = i;
        }
        for (var i=0;i<list.length;i++) {
          var ci = list[i], p = pos[i], step;
          for (step = p - 1; step >= 0; step--) {
            var r0 = ci.dir==="h"?ci.r:step, c0 = ci.dir==="h"?step:ci.c;
            if (g[r0][c0] !== -1) break;
            var np = pos.slice(); np[i] = step; var k1 = encode(np);
            if (!seen[k1]) { seen[k1] = 1; q.push({ pos: np, d: cur.d + 1 }); }
          }
          for (step = p + 1; step + ci.len <= N; step++) {
            var r1 = ci.dir==="h"?ci.r:(step+ci.len-1), c1 = ci.dir==="h"?(step+ci.len-1):ci.c;
            if (g[r1][c1] !== -1) break;
            var np2 = pos.slice(); np2[i] = step; var k2 = encode(np2);
            if (!seen[k2]) { seen[k2] = 1; q.push({ pos: np2, d: cur.d + 1 }); }
          }
        }
      }
      return -1;
    }

    function genPuzzle(lv) {
      var wantCars = Math.min(11, 6 + Math.floor(lv / 2));
      var minD = Math.min(14, 4 + Math.floor(lv * 0.8));
      for (var attempt=0; attempt<120; attempt++) {
        var g = Array.from({length:N}, function(){ return new Array(N).fill(-1); });
        var c0x = (Math.random()*2)|0; var list = [{ id:0, r:2, c:c0x, dc:c0x, dr:2, len:2, dir:"h", st:0 }];
        g[2][list[0].c] = 0; g[2][list[0].c+1] = 0;
        for (var tries=0; tries<60 && list.length < wantCars; tries++) {
          var dir = Math.random() < 0.5 ? "h" : "v";
          var len = Math.random() < 0.28 ? 3 : 2;
          var r = dir==="h" ? ((Math.random()*N)|0) : ((Math.random()*(N-len+1))|0);
          var c = dir==="v" ? ((Math.random()*N)|0) : ((Math.random()*(N-len+1))|0);
          if (dir==="h" && r===2) continue; // don't block row 2 with horizontal cars
          var ok = true;
          for (var k=0;k<len;k++) if (g[dir==="h"?r:r+k][dir==="h"?c+k:c] !== -1) { ok = false; break; }
          if (!ok) continue;
          var id = list.length;
          for (var k=0;k<len;k++) g[dir==="h"?r:r+k][dir==="h"?c+k:c] = id;
          list.push({ id:id, r:r, c:c, dc:c, dr:r, len:len, dir:dir, st: 1 + ((id-1) % (CAR_STYLES.length-1)) });
        }
        var d = solveMinMoves(list);
        if (d >= Math.min(minD, 6)) return list;
      }
      // Fallback guaranteed puzzle
      return [
        {id:0,r:2,c:1,dc:1,dr:2,len:2,dir:"h",st:0},{id:1,r:0,c:0,dc:0,dr:0,len:2,dir:"h",st:1},{id:2,r:0,c:2,dc:2,dr:0,len:3,dir:"v",st:3},
        {id:3,r:1,c:3,dc:3,dr:1,len:2,dir:"v",st:2},{id:4,r:3,c:0,dc:0,dr:3,len:3,dir:"h",st:6},{id:5,r:3,c:3,dc:3,dr:3,len:2,dir:"h",st:4},
        {id:6,r:4,c:2,dc:2,dr:4,len:2,dir:"v",st:5},{id:7,r:1,c:5,dc:5,dr:1,len:3,dir:"v",st:8}
      ];
    }

    function boardMetrics() {
      var border = 26, inner = W - border*2, cell = inner / N;
      return { border: border, inner: inner, cell: cell };
    }

    function boundsFor(idx) {
      var g = Array.from({length:N}, function(){ return new Array(N).fill(-1); });
      for (var i=0;i<cars.length;i++) {
        if (i === idx) continue;
        var cr = cars[i];
        for (var k=0;k<cr.len;k++) g[cr.dir==="h"?cr.r:cr.r+k][cr.dir==="h"?cr.c+k:cr.c] = i;
      }
      var c0 = cars[idx], p = c0.dir==="h" ? c0.c : c0.r, mn = p, mx = p;
      while (mn > 0 && g[c0.dir==="h"?c0.r:mn-1][c0.dir==="h"?mn-1:c0.c] === -1) mn--;
      while (mx + c0.len < N && g[c0.dir==="h"?c0.r:mx+c0.len][c0.dir==="h"?mx+c0.len:c0.c] === -1) mx++;
      if (idx === 0 && mx + c0.len === N) mx = N; // can slide out exit gate!
      return { min: mn, max: mx };
    }

    function init() {
      hideResultModal();
      cars = genPuzzle(level);
      moves = 0; drag = null; ended = false; winSlide = 0;
      hudSt.textContent = "Màn " + level + " (Vô tận) • Lượt: 0";
    }

    cv.c.addEventListener("pointerdown", function(e){
      if (ended) return;
      var rect = cv.c.getBoundingClientRect(), x = (e.clientX - rect.left)*(W/rect.width), y = (e.clientY - rect.top)*(H/rect.height);
      var m = boardMetrics(), col = Math.floor((x - m.border)/m.cell), row = Math.floor((y - m.border)/m.cell);
      for (var i=0;i<cars.length;i++) {
        var cr = cars[i];
        var hit = cr.dir==="h" ? (row===cr.r && col>=cr.c && col<cr.c+cr.len) : (col===cr.c && row>=cr.r && row<cr.r+cr.len);
        if (hit) {
          drag = { idx: i, sx: x, sy: y, base: cr.dir==="h"?cr.c:cr.r, cur: cr.dir==="h"?cr.c:cr.r, bnd: boundsFor(i) };
          sfx(380, 0.04); break;
        }
      }
    });
    cv.c.addEventListener("pointermove", function(e){
      if (!drag || ended) return;
      var rect = cv.c.getBoundingClientRect(), x = (e.clientX - rect.left)*(W/rect.width), y = (e.clientY - rect.top)*(H/rect.height);
      var m = boardMetrics(), cr = cars[drag.idx];
      var delta = (cr.dir==="h" ? (x - drag.sx) : (y - drag.sy)) / m.cell;
      drag.cur = Math.max(drag.bnd.min, Math.min(drag.bnd.max, drag.base + delta));
    });
    function endDrag() {
      if (!drag || ended) return;
      var cr = cars[drag.idx], snapped = Math.round(drag.cur);
      snapped = Math.max(drag.bnd.min, Math.min(drag.bnd.max, snapped));
      if (snapped !== drag.base) { moves++; sfx(480, 0.05); vib(8); }
      if (cr.dir === "h") cr.c = snapped; else cr.r = snapped;
      var isWin = drag.idx === 0 && cr.c >= N - 2;
      drag = null;
      hudSt.textContent = "Màn " + level + " (Vô tận) • Lượt: " + moves;
      if (isWin) {
        ended = true; winSlide = 1; sfx(820, 0.22, "triangle"); vib(25);
        var done = level; level++; saveLv();
        setTimeout(function(){
          showResultModal({
            win: true, title: "Thoát kẹt xe màn " + done + "!", desc: "Hoàn thành sau " + moves + " lượt.",
            nextLabel: "⏭ Màn " + level, onNext: init,
            retryLabel: "🔄 Chơi lại màn " + done, onRetry: function(){ level = done; saveLv(); init(); }
          });
        }, 420);
      }
    }
    cv.c.addEventListener("pointerup", endDrag);
    cv.c.addEventListener("pointercancel", endDrag);

    function drawVehicle(cr, x, y, w, h) {
      var st = CAR_STYLES[cr.st];
      ctx.save();
      // Drop shadow + white plastic base tray like Image 1
      ctx.fillStyle = "rgba(0,0,0,.22)"; ctx.beginPath(); ctx.roundRect(x+2, y+4, w-4, h-4, 10); ctx.fill();
      ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.roundRect(x+2, y+2, w-4, h-4, 10); ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,.12)"; ctx.lineWidth = 1; ctx.stroke();

      // Car body
      var pad = 4.5, bx = x+pad, by = y+pad, bw = w-pad*2, bh = h-pad*2;
      ctx.fillStyle = st.body; ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 8); ctx.fill();
      // Windshield & cabin
      ctx.fillStyle = "#1e293b";
      if (cr.dir === "h") {
        ctx.beginPath(); ctx.roundRect(bx + bw*0.24, by + bh*0.16, bw*0.52, bh*0.68, 5); ctx.fill();
        ctx.fillStyle = st.roof; ctx.beginPath(); ctx.roundRect(bx + bw*0.32, by + bh*0.22, bw*0.32, bh*0.56, 4); ctx.fill();
        // Headlights
        ctx.fillStyle = "#fef08a"; ctx.fillRect(bx + bw - 3, by + 4, 3, 5); ctx.fillRect(bx + bw - 3, by + bh - 9, 3, 5);
      } else {
        ctx.beginPath(); ctx.roundRect(bx + bw*0.16, by + bh*0.24, bw*0.68, bh*0.52, 5); ctx.fill();
        ctx.fillStyle = st.roof; ctx.beginPath(); ctx.roundRect(bx + bw*0.22, by + bh*0.32, bw*0.56, bh*0.32, 4); ctx.fill();
        ctx.fillStyle = "#fef08a"; ctx.fillRect(bx + 4, by + bh - 3, 5, 3); ctx.fillRect(bx + bw - 9, by + bh - 3, 5, 3);
      }
      // Target red car arrow indicator
      if (cr.id === 0) {
        ctx.fillStyle = "#fff"; ctx.font = "900 13px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText("➜", bx + bw*0.5, by + bh*0.5 + 0.5);
      }
      ctx.restore();
    }

    function loop(now) {
      var dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000)); lastT = now;
      ctx.clearRect(0, 0, W, H);
      var m = boardMetrics();

      // Bright lime-green toy frame with crosswalk stripes like Image 1!
      var fg = ctx.createLinearGradient(0, 0, 0, H); fg.addColorStop(0, "#a3e635"); fg.addColorStop(1, "#65a30d");
      ctx.fillStyle = fg; ctx.beginPath(); ctx.roundRect(0, 0, W, H, 22); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.85)";
      for (var s=-2;s<=2;s++) { ctx.fillRect(W/2 + s*14 - 3, 7, 6, 12); ctx.fillRect(W/2 + s*14 - 3, H - 19, 6, 12); }

      // Grey recessed 6x6 board + Exit gate opening on row 2 right!
      ctx.fillStyle = "#cbd5e1"; ctx.beginPath(); ctx.roundRect(m.border-4, m.border-4, m.inner+8, m.inner+8, 12); ctx.fill();
      ctx.fillStyle = "#e2e8f0"; ctx.fillRect(m.border + m.inner, m.border + 2*m.cell, m.border + 4, m.cell);
      for (var r=0;r<N;r++) for (var c=0;c<N;c++) {
        ctx.fillStyle = "#f1f5f9";
        ctx.beginPath(); ctx.roundRect(m.border + c*m.cell + 3, m.border + r*m.cell + 3, m.cell - 6, m.cell - 6, 6); ctx.fill();
      }
      for (var i=0;i<cars.length;i++) {
        var cr = cars[i];
        var tc = (drag && drag.idx===i && cr.dir==="h") ? drag.cur : cr.c;
        var tr = (drag && drag.idx===i && cr.dir==="v") ? drag.cur : cr.r;
        if (cr.dc == null) { cr.dc = cr.c; cr.dr = cr.r; }
        cr.dc += (tc - cr.dc) * Math.min(1, dt*18); cr.dr += (tr - cr.dr) * Math.min(1, dt*18);
        var cc = cr.dc, rr = cr.dr;
        if (i === 0 && ended) { winSlide += dt*5; cc += winSlide; }
        var x = m.border + cc*m.cell, y = m.border + rr*m.cell;
        var w = (cr.dir==="h" ? cr.len : 1)*m.cell, h = (cr.dir==="v" ? cr.len : 1)*m.cell;
        drawVehicle(cr, x, y, w, h);
      }
      activeRaf = requestAnimationFrame(loop);
    }

    hudBt.innerHTML = ""; hudBt.appendChild(mkBtn("🔄 Chơi lại", "btn-pill pri", init));
    init(); activeRaf = requestAnimationFrame(loop);
  }
  /* ==================== 9. MAZE PAINT (3D GLASS • VÔ HẠN MÀN) ==================== */
  function startMazePaint() {
    hdrTitle.textContent = "Maze Paint";
    var cv = makeCanvas(1), ctx = cv.ctx, W = cv.w;
    var COLORS = ["#ff4d8d", "#8b5cf6", "#06b6d4", "#10b981", "#f59e0b", "#3b82f6"];
    var level = 1;
    try { level = Math.max(1, parseInt(localStorage.getItem("off_maze_level") || "1", 10) || 1); } catch (e) {}
    var N = 7, grid = [], painted = [], br = 1, bc = 1, bx = 1, by = 1, slide = null, sq = 0, paintCol = COLORS[0], particles = [], ended = false, lastT = performance.now();

    function saveLv() { try { localStorage.setItem("off_maze_level", String(level)); } catch (e) {} }
    function genMaze(sz) {
      // Carve guaranteed 100%-reachable corridors on odd grid using randomized DFS
      var g = Array.from({length:sz}, function(){ return new Array(sz).fill(1); });
      function carve(r, c) {
        g[r][c] = 0;
        var dirs = [[-2,0],[2,0],[0,-2],[0,2]];
        for (var i=dirs.length-1;i>0;i--) { var j=(Math.random()*(i+1))|0, t=dirs[i]; dirs[i]=dirs[j]; dirs[j]=t; }
        dirs.forEach(function(d){
          var nr = r + d[0], nc = c + d[1];
          if (nr > 0 && nc > 0 && nr < sz-1 && nc < sz-1 && g[nr][nc] === 1) {
            g[r + d[0]/2][c + d[1]/2] = 0;
            carve(nr, nc);
          }
        });
      }
      carve(1, 1);
      // Add a couple extra loops for fun multi-path sliding
      for (var k=0;k<Math.floor(sz/2);k++) {
        var rr = 1 + ((Math.random()*(sz-2))|0), cc = 1 + ((Math.random()*(sz-2))|0);
        if (g[rr][cc] === 1 && ((g[rr-1][cc]===0&&g[rr+1][cc]===0) || (g[rr][cc-1]===0&&g[rr][cc+1]===0))) g[rr][cc] = 0;
      }
      return g;
    }

    function countProgress() {
      var tot = 0, done = 0;
      for (var r=0;r<N;r++) for (var c=0;c<N;c++) if (grid[r][c] === 0) { tot++; if (painted[r][c]) done++; }
      return { tot: tot, done: done };
    }
    function init() {
      hideResultModal();
      N = level <= 2 ? 7 : (level <= 6 ? 9 : (level <= 12 ? 11 : 13));
      paintCol = COLORS[(level - 1) % COLORS.length];
      grid = genMaze(N);
      painted = Array.from({length:N}, function(){ return new Array(N).fill(false); });
      br = 1; bc = 1; bx = 1; by = 1; painted[1][1] = true; slide = null; sq = 0; particles = []; ended = false;
      var p = countProgress();
      hudSt.textContent = "Màn " + level + " (Vô tận) • Đã sơn " + p.done + "/" + p.tot;
    }

    function move(dr, dc) {
      if (slide || ended) return;
      var nr = br, nc = bc;
      while (nr + dr >= 0 && nc + dc >= 0 && nr + dr < N && nc + dc < N && grid[nr + dr][nc + dc] === 0) {
        nr += dr; nc += dc;
      }
      if (nr === br && nc === bc) { sq = 0.6; sfx(200, 0.04); return; }
      slide = { r0: br, c0: bc, r1: nr, c1: nc, dr: dr, dc: dc, dist: Math.abs(nr - br) + Math.abs(nc - bc) };
      sfx(460, 0.06);
    }

    var swDrag = null;
    cv.c.addEventListener("pointerdown", function(e){ swDrag = { x: e.clientX, y: e.clientY }; });
    window.addEventListener("pointermove", function(e){
      if (!swDrag || slide || ended) return;
      var dx = e.clientX - swDrag.x, dy = e.clientY - swDrag.y;
      if (Math.max(Math.abs(dx), Math.abs(dy)) >= 16) {
        swDrag = null;
        if (Math.abs(dx) > Math.abs(dy)) move(0, dx > 0 ? 1 : -1); else move(dy > 0 ? 1 : -1, 0);
      }
    });
    window.addEventListener("pointerup", function(){ swDrag = null; });
    activeKeyFn = function(e) {
      var k = e.key;
      if (k === "ArrowUp" || k === "w" || k === "W") { e.preventDefault(); move(-1, 0); }
      else if (k === "ArrowDown" || k === "s" || k === "S") { e.preventDefault(); move(1, 0); }
      else if (k === "ArrowLeft" || k === "a" || k === "A") { e.preventDefault(); move(0, -1); }
      else if (k === "ArrowRight" || k === "d" || k === "D") { e.preventDefault(); move(0, 1); }
    };
    document.addEventListener("keydown", activeKeyFn);

    function loop(now) {
      var dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000)); lastT = now;
      var pad = 10, cell = (W - pad*2) / N;

      if (slide) {
        var spd = 22 * dt;
        bx += slide.dc * spd; by += slide.dr * spd;
        var cr = Math.round(by), cc = Math.round(bx);
        if (cr >= 0 && cc >= 0 && cr < N && cc < N && grid[cr][cc] === 0 && !painted[cr][cc]) {
          painted[cr][cc] = true;
          for (var i=0;i<5;i++) particles.push({ x: pad+(cc+0.5)*cell, y: pad+(cr+0.5)*cell, vx:(Math.random()-0.5)*3, vy:(Math.random()-0.5)*3, col:paintCol, life:1 });
        }
        if ((slide.dc > 0 && bx >= slide.c1) || (slide.dc < 0 && bx <= slide.c1) || (slide.dr > 0 && by >= slide.r1) || (slide.dr < 0 && by <= slide.r1)) {
          br = slide.r1; bc = slide.c1; bx = bc; by = br;
          if (!painted[br][bc]) painted[br][bc] = true;
          slide = null; sq = 1; sfx(340, 0.04); vib(8);
          var p = countProgress();
          hudSt.textContent = "Màn " + level + " • Đã sơn " + p.done + "/" + p.tot;
          if (p.done === p.tot && !ended) {
            ended = true; sfx(820, 0.22, "triangle"); vib(25);
            var done = level; level++; saveLv();
            setTimeout(function(){
              showResultModal({
                win: true, title: "Sơn kín mê cung " + done + "!", desc: "Hoàn hảo 100%! Màn " + level + " đang chờ bạn.",
                nextLabel: "⏭ Màn " + level, onNext: init,
                retryLabel: "🔄 Chơi lại màn " + done, onRetry: function(){ level = done; saveLv(); init(); }
              });
            }, 350);
          }
        }
      }
      if (sq > 0) sq = Math.max(0, sq - dt*6);

      ctx.clearRect(0, 0, W, W);
      var bg = ctx.createLinearGradient(0, 0, W, W); bg.addColorStop(0, "#f1f5f9"); bg.addColorStop(1, "#e2e8f0");
      ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(0, 0, W, W, 18); ctx.fill();

      for (var r=0;r<N;r++) for (var c=0;c<N;c++) {
        var x = pad + c*cell, y = pad + r*cell;
        if (grid[r][c] === 1) {
          ctx.fillStyle = "rgba(30,41,59,.2)"; ctx.beginPath(); ctx.roundRect(x+1, y+3, cell-2, cell-2, 6); ctx.fill();
          ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.roundRect(x+1, y+1, cell-2, cell-2, 6); ctx.fill();
          ctx.fillStyle = "rgba(148,163,184,.25)"; ctx.beginPath(); ctx.roundRect(x+1, y+cell*0.55, cell-2, cell*0.45-1, [0,0,6,6]); ctx.fill();
        } else if (painted[r][c]) {
          ctx.fillStyle = paintCol; ctx.beginPath(); ctx.roundRect(x+0.5, y+0.5, cell-1, cell-1, 4); ctx.fill();
          ctx.fillStyle = "rgba(255,255,255,.26)"; ctx.beginPath(); ctx.roundRect(x+2, y+2, cell-4, cell*0.35, 3); ctx.fill();
        } else {
          ctx.fillStyle = "rgba(255,255,255,.65)"; ctx.beginPath(); ctx.roundRect(x+1, y+1, cell-2, cell-2, 4); ctx.fill();
        }
      }
      // 3D Glossy Glass Ball
      var cx0 = pad + (bx + 0.5)*cell, cy0 = pad + (by + 0.5)*cell, rad = cell*0.4;
      ctx.save(); ctx.translate(cx0, cy0); ctx.scale(1 + sq*0.18, 1 - sq*0.16);
      ctx.fillStyle = "rgba(0,0,0,.22)"; ctx.beginPath(); ctx.ellipse(0, rad*0.7, rad*0.85, rad*0.3, 0, 0, Math.PI*2); ctx.fill();
      var bg2 = ctx.createRadialGradient(-rad*0.3, -rad*0.35, rad*0.08, 0, 0, rad);
      bg2.addColorStop(0, "#ffffff"); bg2.addColorStop(0.35, paintCol); bg2.addColorStop(1, "#1e293b");
      ctx.fillStyle = bg2; ctx.beginPath(); ctx.arc(0, 0, rad, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.78)"; ctx.beginPath(); ctx.ellipse(-rad*0.26, -rad*0.32, rad*0.28, rad*0.14, -0.5, 0, Math.PI*2); ctx.fill();
      ctx.restore();

      for (var k=particles.length-1;k>=0;k--) {
        var pt = particles[k]; pt.x += pt.vx*dt*60; pt.y += pt.vy*dt*60; pt.life -= dt*2.6;
        if (pt.life <= 0) { particles.splice(k,1); continue; }
        ctx.globalAlpha = pt.life; ctx.fillStyle = pt.col; ctx.beginPath(); ctx.arc(pt.x, pt.y, 3, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1;
      }
      activeRaf = requestAnimationFrame(loop);
    }

    var dpad = document.createElement("div"); dpad.className = "controls-bar";
    dpad.appendChild(mkBtn("⬅", "btn-ico", function(){ move(0,-1); }));
    dpad.appendChild(mkBtn("⬆", "btn-ico", function(){ move(-1,0); }));
    dpad.appendChild(mkBtn("⬇", "btn-ico", function(){ move(1,0); }));
    dpad.appendChild(mkBtn("➡", "btn-ico", function(){ move(0,1); }));
    board.appendChild(dpad);
    hudBt.innerHTML = ""; hudBt.appendChild(mkBtn("🔄", "btn-ico", init));
    init(); activeRaf = requestAnimationFrame(loop);
  }

  var GAMES = { flow:startFlow, sort:startSort, candy:startCandy, blocks:startBlocks, g2048:start2048, caro:startCaro, onet:startOnet, rush:startRush, maze:startMazePaint };

  var _lastOfflineBack = 0;
  window.handleAppBack = function () {
    if (!resModal.classList.contains("hidden")) { hideResultModal(); return true; }
    if (!viewGame.classList.contains("hidden")) { showMenu(); return true; }
    if (!hdr.classList.contains("hidden")) {
      stopRaf(); hdr.classList.add("hidden"); main.classList.add("hidden"); gate.classList.remove("hidden");
      return true;
    }
    var now = Date.now();
    if (now - _lastOfflineBack < 2200) { _lastOfflineBack = 0; return false; }
    _lastOfflineBack = now;
    return true;
  };
})();
</script>
</body>
